# Tasks for the Molecule prepare stage: Add resources needed for later steps
# (e.g. verify) on all driver-created instances.


- name: "Molecule | Verify | Initialize the foundata.linux.sysctl role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
    tasks_from: "init"
    public: true


- name: "Molecule | Prepare | Add custom values to sysctl main config file (to test automatic commenting later)"
  ansible.posix.sysctl:
    sysctl_file: "{{ __sysctl_linux_config_file_path }}"
    name: "{{ item['key'] }}"
    value: "{{ item['value'] }}"
    state: "present"
    sysctl_set: false
    reload: false
  vars:
    __testing_sysctl_values_to_comment:
      "net.ipv4.tcp_syncookies": "1" # Managed during the converge stage; must be commented out
      "net.ipv4.tcp_mtu_probing": "1" # Unmanaged; must NOT be commented out
      "net.ipv4.tcp_timestamps": "0" # Managed during the converge stage; must be commented out
      "net.ipv4.tcp_fin_timeout": "99" # Managed by the web profile only (not in sysctl_linux_parameters); must be commented out
  loop: "{{ __testing_sysctl_values_to_comment | ansible.builtin.dict2items }}"


## Fixtures for the foundata.linux.user role tests.
#
# Created here (the prepare stage only auto-includes all.yml and
# <inventory_hostname>.yml, not every *.yml) and ONCE, so the role's destructive
# actions become observable on the first converge (removing absent accounts,
# reaping unmanaged ones, purging non-exclusive keys) while the second converge
# stays idempotent.

- name: "Molecule | Prepare | user | Create a group the role will remove (state: absent)"
  ansible.builtin.group:
    name: "molecule_legacy_absent"
    state: "present"


- name: "Molecule | Prepare | user | Create an account the role will remove (state: absent)"
  ansible.builtin.user:
    name: "molecule_obsolete"
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Create an unmanaged in-range account the role should reap"
  ansible.builtin.user:
    name: "molecule_reapme"
    uid: 4998
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Create an unmanaged in-range account that is excluded from reaping"
  ansible.builtin.user:
    name: "molecule_keepme"
    uid: 4999
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Create an account with a stray authorized_key (to test exclusive purge)"
  ansible.builtin.user:
    name: "molecule_keyuser"
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Add a stray authorized_key that the role must purge"
  ansible.posix.authorized_key:
    user: "molecule_keyuser"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILmFhCG3dipt7baMWEJOo9chtWBt+rpTsltkYcnd4jcu molecule_stray@example.com"
    state: "present"
