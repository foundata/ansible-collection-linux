# Configuration: Manage settings, like adapting or creating config files.

---

# Order matters:
#   1. validate rule definitions (fail fast on misconfiguration)
#   2. build the per-grantee drop-in lists (one file per user/group)
#   3. create/update drop-ins for "present" rules
#   4. remove drop-ins for "absent" rules
#   5. render (or remove) the global Defaults / extra_content drop-in
#   6. optionally reap unmanaged drop-ins (authoritative /etc/sudoers.d)


- name: "Config | Default | Ensure rule names are unique"
  ansible.builtin.assert:
    that:
      - >-
        (sudo_linux_rules | ansible.builtin.map(attribute='name') | ansible.builtin.list | ansible.builtin.length)
        == (sudo_linux_rules | ansible.builtin.map(attribute='name') | ansible.builtin.unique | ansible.builtin.list | ansible.builtin.length)
    fail_msg: "sudo_linux_rules contains duplicate 'name' values; names must be unique."
    quiet: true


- name: "Config | Default | Validate rule definitions"
  ansible.builtin.assert:
    that:
      # Dots are disallowed: sudo ignores drop-in files whose name contains a '.'.
      - "__sudo_linux_rule_item['name'] is ansible.builtin.match('^[a-zA-Z0-9_-]+$')"
      # A "present" rule needs commands and at least one grantee; "absent" only needs its name.
      - >-
        (__sudo_linux_rule_item['state'] | ansible.builtin.default('present')) == 'absent'
        or (__sudo_linux_rule_item['commands'] | ansible.builtin.default([]) | ansible.builtin.length) > 0
      - >-
        (__sudo_linux_rule_item['state'] | ansible.builtin.default('present')) == 'absent'
        or ((__sudo_linux_rule_item['users'] | ansible.builtin.default([]) | ansible.builtin.length)
            + (__sudo_linux_rule_item['groups'] | ansible.builtin.default([]) | ansible.builtin.length)) > 0
    fail_msg: >-
      Invalid sudo_linux_rules entry "{{ __sudo_linux_rule_item['name'] | ansible.builtin.default('<unnamed>') }}":
      its 'name' may only contain a-z, A-Z, 0-9, '_' and '-' (no dots, as sudo
      ignores dotted drop-in filenames), and a 'present' rule requires 'commands'
      and at least one entry across 'users'/'groups'.
    quiet: true
  loop: "{{ sudo_linux_rules }}"
  loop_control:
    loop_var: "__sudo_linux_rule_item"
    label: "{{ __sudo_linux_rule_item['name'] | ansible.builtin.default('<unnamed>') }}"


- name: "Config | Default | Build the per-grantee drop-in lists from sudo_linux_rules"
  ansible.builtin.set_fact:
    # "present" grantees, each a flat dict carrying the merged rule options plus
    # the target drop-in filename (one file per user and per group).
    __sudo_linux_grantees_present: >-
      {%- set __ns = namespace(items=[]) -%}
      {%- for __rule in sudo_linux_rules -%}
      {%-   set __r = __sudo_linux_rule_defaults_effective | ansible.builtin.combine(__rule, recursive=true) -%}
      {%-   if __r['state'] | ansible.builtin.default('present') == 'present' -%}
      {%-     for __u in (__r['users'] | ansible.builtin.default([])) -%}
      {%-       set _ = __ns.items.append({
                  'file': __sudo_linux_dropin_prefix ~ __rule['name'] ~ '-user-' ~ __u,
                  'user': __u, 'group': none,
                  'commands': __r['commands'], 'runas': __r['runas'], 'host': __r['host'],
                  'nopassword': __r['nopassword'], 'setenv': __r['setenv'], 'noexec': __r['noexec']}) -%}
      {%-     endfor -%}
      {%-     for __g in (__r['groups'] | ansible.builtin.default([])) -%}
      {%-       set _ = __ns.items.append({
                  'file': __sudo_linux_dropin_prefix ~ __rule['name'] ~ '-group-' ~ __g,
                  'user': none, 'group': __g,
                  'commands': __r['commands'], 'runas': __r['runas'], 'host': __r['host'],
                  'nopassword': __r['nopassword'], 'setenv': __r['setenv'], 'noexec': __r['noexec']}) -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.items }}
    # "absent" grantees: only the target drop-in filenames need to be derived.
    __sudo_linux_grantees_absent: >-
      {%- set __ns = namespace(items=[]) -%}
      {%- for __rule in sudo_linux_rules -%}
      {%-   if (__rule['state'] | ansible.builtin.default('present')) == 'absent' -%}
      {%-     for __u in (__rule['users'] | ansible.builtin.default([])) -%}
      {%-       set _ = __ns.items.append({'file': __sudo_linux_dropin_prefix ~ __rule['name'] ~ '-user-' ~ __u}) -%}
      {%-     endfor -%}
      {%-     for __g in (__rule['groups'] | ansible.builtin.default([])) -%}
      {%-       set _ = __ns.items.append({'file': __sudo_linux_dropin_prefix ~ __rule['name'] ~ '-group-' ~ __g}) -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.items }}
    # Whether the global Defaults / extra_content drop-in has any content.
    __sudo_linux_defaults_has_content: >-
      {{
        (sudo_linux_defaults | ansible.builtin.default([]) | ansible.builtin.length) > 0
        or (sudo_linux_extra_content | ansible.builtin.default('') | trim | ansible.builtin.length) > 0
      }}


- name: "Config | Default | Create or update sudo rules (one validated drop-in per grantee)"
  community.general.sudoers:
    name: "{{ __sudo_linux_grantee_item['file'] }}"
    user: "{{ __sudo_linux_grantee_item['user'] | ansible.builtin.default(omit, true) }}"
    group: "{{ __sudo_linux_grantee_item['group'] | ansible.builtin.default(omit, true) }}"
    commands: "{{ __sudo_linux_grantee_item['commands'] }}"
    runas: "{{ __sudo_linux_grantee_item['runas'] | ansible.builtin.default(omit, true) }}"
    host: "{{ __sudo_linux_grantee_item['host'] | ansible.builtin.default(omit, true) }}"
    nopassword: "{{ __sudo_linux_grantee_item['nopassword'] }}"
    setenv: "{{ __sudo_linux_grantee_item['setenv'] }}"
    noexec: "{{ __sudo_linux_grantee_item['noexec'] }}"
    sudoers_path: "{{ __sudo_linux_dropin_dir }}"
    validation: "detect"
    state: "present"
  loop: "{{ __sudo_linux_grantees_present }}"
  loop_control:
    loop_var: "__sudo_linux_grantee_item"
    label: "{{ __sudo_linux_grantee_item['file'] }}"


- name: "Config | Default | Remove drop-ins for sudo rules marked absent"
  community.general.sudoers:
    name: "{{ __sudo_linux_grantee_item['file'] }}"
    sudoers_path: "{{ __sudo_linux_dropin_dir }}"
    state: "absent"
  loop: "{{ __sudo_linux_grantees_absent }}"
  loop_control:
    loop_var: "__sudo_linux_grantee_item"
    label: "{{ __sudo_linux_grantee_item['file'] }}"


- name: "Config | Default | Render the global Defaults / extra_content drop-in"
  ansible.builtin.template:
    src: "sudoers_defaults.j2"
    dest: "{{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_prefix }}defaults"
    owner: "{{ __sudo_linux_dropin_file_owner }}"
    group: "{{ __sudo_linux_dropin_file_group }}"
    mode: "{{ __sudo_linux_dropin_file_mode }}"
    validate: "{{ __sudo_linux_visudo_exec_path }} -cf %s"
  when:
    - __sudo_linux_defaults_has_content | ansible.builtin.bool


- name: "Config | Default | Remove the global Defaults / extra_content drop-in when empty"
  ansible.builtin.file:
    path: "{{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_prefix }}defaults"
    state: "absent"
  when:
    - not (__sudo_linux_defaults_has_content | ansible.builtin.bool)


- name: "Config | Default | Reap unmanaged drop-in files (authoritative /etc/sudoers.d)"
  when:
    - sudo_linux_delete_unmanaged | ansible.builtin.bool
  block:

    - name: "Config | Default | List existing drop-in files"
      ansible.builtin.find:
        paths:
          - "{{ __sudo_linux_dropin_dir }}"
        file_type: "file"
        hidden: true
      register: __sudo_linux_existing_dropins


    - name: "Config | Default | Remove unmanaged drop-in files"
      ansible.builtin.file:
        path: "{{ __sudo_linux_reap_item['path'] }}"
        state: "absent"
      vars:
        # Files to keep: the drop-ins this role manages right now, the global
        # Defaults drop-in (if any), the per-platform protected list and the
        # caller-provided exclude list.
        __sudo_linux_dropin_keep: >-
          {{
            (__sudo_linux_grantees_present | ansible.builtin.map(attribute='file') | ansible.builtin.list)
            + ([__sudo_linux_dropin_prefix ~ 'defaults'] if (__sudo_linux_defaults_has_content | ansible.builtin.bool) else [])
            + (__sudo_linux_dropin_protected | ansible.builtin.default([]))
            + (sudo_linux_delete_unmanaged_exclude | ansible.builtin.default([]))
          }}
      when:
        - (__sudo_linux_reap_item['path'] | ansible.builtin.basename) not in __sudo_linux_dropin_keep
      loop: "{{ __sudo_linux_existing_dropins['files'] }}"
      loop_control:
        loop_var: "__sudo_linux_reap_item"
        label: "{{ __sudo_linux_reap_item['path'] }}"
