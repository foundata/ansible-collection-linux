# Internal role variables specific to: Ubuntu (os_family or distribution)
#
# Ubuntu has os_family "Debian" but distribution "Ubuntu", so this file is
# loaded after (and overrides) vars/debian.yml. Only the apt Origins-Pattern
# differs from Debian; package, backend and timer unit are inherited.

---

# Origins-Pattern entries for Unattended-Upgrade on Ubuntu. The ${distro_id} and
# ${distro_codename} placeholders are resolved by unattended-upgrades itself at
# runtime.
# These use the "key=value" pattern form, not the "origin:archive" shorthand of
# Allowed-Origins
__auto_update_linux_apt_origins_security:
  - "origin=${distro_id},archive=${distro_codename}-security"
  - "origin=${distro_id}ESMApps,archive=${distro_codename}-apps-security"
  - "origin=${distro_id}ESM,archive=${distro_codename}-infra-security"
__auto_update_linux_apt_origins_all_extra:
  - "origin=${distro_id},archive=${distro_codename}-updates"
