# Uninstall: Manage basic resource removal, such as packages or service users.
#
# For this role (disk_linux_state "absent"): every entry in
# disk_linux_devices is treated as state "absent" - unmount plus /etc/fstab
# cleanup, children before parents. Data is kept; a per-entry wipe is only
# honored when the entry's own effective state is "absent" (the global
# "absent" never enables wiping). Tool packages are never uninstalled
# (__disk_linux_packages_uninstall is empty), they are base-system components.

---

# The shared safety preflight runs here as well: a per-entry wipe reachable
# through the role-global "absent" must never bypass the whole-disk,
# duplicate and system-disk checks.
- name: "Setup | Uninstall | Run the shared disk safety preflight"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/shared/safety.yml"


# Every absent entry with wipe enabled is activity-checked BEFORE the first
# one is touched: a busy disk discovered mid-loop would come too late, after
# earlier candidates were already destroyed. The entry's own declared
# mountpoint is exempt (its unmount is part of the absent handling); an
# immediate recheck runs again right before each wipe.
- name: "Setup | Uninstall | Reset the wipe violation aggregate"
  ansible.builtin.set_fact:
    __disk_linux_wipe_violations: []


- name: "Setup | Uninstall | Run the wipe activity preflight for the absent entries"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/shared/wipe_preflight.yml"
  vars:
    __disk_linux_wp_device: "{{ __disk_linux_wp_entry_item['device'] }}"
    __disk_linux_wp_allowed_mountpoint: "{{ __disk_linux_wp_entry_item['path'] }}"
  when:
    - __disk_linux_wp_entry_item['wipe'] | ansible.builtin.bool
    - __disk_linux_device_exists[__disk_linux_wp_entry_item['device']] | ansible.builtin.default(false)
  loop: "{{ __disk_linux_devices_effective_cleanup_order }}"
  loop_control:
    loop_var: "__disk_linux_wp_entry_item"
    label: "{{ __disk_linux_wp_entry_item['device'] }}"


- name: "Setup | Uninstall | Check every absent entry's device tree is inactive"
  ansible.builtin.assert:
    that:
      - (__disk_linux_wipe_violations | ansible.builtin.length) == 0
    fail_msg: >-
      Refusing the wipe of absent entries: device tree(s) still active
      ({{ __disk_linux_wipe_violations | ansible.builtin.join('; ') }}).
      Unmount or deactivate them first; nothing was changed.
    quiet: true


- name: "Setup | Uninstall | Unmount and de-register the declared devices (children first)"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/config/device_absent.yml"
  loop: "{{ __disk_linux_devices_effective_cleanup_order }}"
  loop_control:
    label: "{{ __disk_linux_entry_item['path'] }}"
    loop_var: "__disk_linux_entry_item"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __disk_linux_packages_uninstall }}"
    state: "absent"
  when:
    - __disk_linux_packages_uninstall is ansible.builtin.defined
    - (__disk_linux_packages_uninstall | ansible.builtin.length) > 0
