# Main entry point for the role.

---

- name: "Main | Include role initialization tasks"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/init.yml"
    apply:
      tags:
        - "always"
        - "sudo_linux_always"
  tags:
    - "always"
    - "sudo_linux_always"


- name: "Main | Include setup tasks (install): best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __sudo_linux_task_file }}"
    apply:
      tags:
        - "sudo_linux_setup"
  vars:
    __sudo_linux_task_file: "{{ role_path }}/tasks/setup/install/{{ __sudo_linux_loop_item }}"
  when:
    - sudo_linux_state == 'present'
    - __sudo_linux_task_file is ansible.builtin.file
  loop: "{{ __sudo_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__sudo_linux_loop_item"
  tags:
    - "sudo_linux_setup"


- name: "Main | Include configuration tasks: best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __sudo_linux_task_file }}"
    apply:
      tags:
        - "sudo_linux_config"
  vars:
    __sudo_linux_task_file: "{{ role_path }}/tasks/config/{{ __sudo_linux_loop_item }}"
  when:
    - sudo_linux_state == 'present'
    - __sudo_linux_task_file is ansible.builtin.file
  loop: "{{ __sudo_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__sudo_linux_loop_item"
  tags:
    - "sudo_linux_config"


- name: "Main | Include setup tasks (uninstall): best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __sudo_linux_task_file }}"
    apply:
      tags:
        - "sudo_linux_setup"
  vars:
    __sudo_linux_task_file: "{{ role_path }}/tasks/setup/uninstall/{{ __sudo_linux_loop_item }}"
  when:
    - sudo_linux_state == 'absent'
    - __sudo_linux_task_file is ansible.builtin.file
  loop: "{{ __sudo_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__sudo_linux_loop_item"
  tags:
    - "sudo_linux_setup"
