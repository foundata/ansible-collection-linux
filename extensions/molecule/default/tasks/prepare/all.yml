# Tasks for the Molecule prepare stage: Add resources needed for later steps
# (e.g. verify) on all driver-created instances.


# Bring the instance to the current package level BEFORE any role runs: the
# auto_update role enables unattended-upgrades during converge and the
# apt-daily catch-up timers fire shortly after boot, so a pending update
# (e.g. a new kernel) would get installed in the background BETWEEN converge
# and idempotence - and the reboot role then legitimately reboots on the
# second run, failing the idempotence stage.
- name: "Molecule | Prepare | Upgrade all packages (deterministic state for the idempotence stage)"
  ansible.builtin.apt:
    upgrade: "dist"
    update_cache: true
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'


- name: "Molecule | Verify | Initialize the foundata.linux.sysctl role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
    tasks_from: "init"
    public: true


- name: "Molecule | Prepare | Add custom values to sysctl main config file (to test automatic commenting later)"
  ansible.posix.sysctl:
    sysctl_file: "{{ __sysctl_linux_config_file_path }}"
    name: "{{ item['key'] }}"
    value: "{{ item['value'] }}"
    state: "present"
    sysctl_set: false
    reload: false
  vars:
    __testing_sysctl_values_to_comment:
      "net.ipv4.tcp_syncookies": "1" # Managed during the converge stage; must be commented out
      "net.ipv4.tcp_mtu_probing": "1" # Unmanaged; must NOT be commented out
      "net.ipv4.tcp_timestamps": "0" # Managed during the converge stage; must be commented out
      "net.ipv4.tcp_fin_timeout": "99" # Managed by the web profile only (not in sysctl_linux_parameters); must be commented out
  loop: "{{ __testing_sysctl_values_to_comment | ansible.builtin.dict2items }}"


# Simulate a leftover from an earlier run: a line the role previously disabled
# (carries the marker) for a key it does NOT manage in the converge stage. The
# present run must restore it (strip the marker) since the key is now unmanaged.
- name: "Molecule | Prepare | Add a pre-existing role-disabled line for a now-unmanaged key"
  ansible.builtin.lineinfile:
    path: "{{ __sysctl_linux_config_file_path }}"
    line: "{{ __sysctl_linux_main_disabled_marker }}net.ipv4.tcp_keepalive_time = 7200"
    state: "present"


- name: "Molecule | Prepare | sysctl | Ensure the drop-in directory exists before seeding"
  # /etc/sysctl.d is created by the role, but the seed below runs first and some
  # minimal images (e.g. AlmaLinux) do not ship the directory.
  ansible.builtin.file:
    path: "{{ __sysctl_linux_config_dropin_dir_path }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=rx,o=rx" # 0755


- name: "Molecule | Prepare | sysctl | Seed drop-in lines exercising the existing-parameter parser"
  # Two hand-written lines in the role-managed drop-in:
  #   - an UNMANAGED key (net.ipv4.tcp_rfc1337): the parser must detect it and the
  #     role must remove it. Requires splitlines(): split('\n') never splits the
  #     real newlines here, so nothing is parsed and orphans are never removed.
  #   - a hand-INDENTED MANAGED key: the parser must trim keys, otherwise the
  #     indented key is misdetected as an orphan and the removal (which strips the
  #     name) deletes the managed parameter, breaking idempotence.
  # The file name matches sysctl_linux_config_dropin_file_name in the converge.
  ansible.builtin.copy:
    dest: "{{ __sysctl_linux_config_dropin_dir_path }}/zz-custom-dropin.conf"
    content: "net.ipv4.tcp_rfc1337 = 1\n  net.ipv4.tcp_syncookies = 0\n"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644


- name: "Molecule | Prepare | sysctl | Seed a stale drop-in with the legacy default name"
  # Simulates a deployment of an earlier role version, whose default drop-in
  # name was 90-managed.conf ("90-" lost against distribution files like
  # 99-protect-links.conf, hence the rename). The role has to remove it.
  ansible.builtin.copy:
    dest: "{{ __sysctl_linux_config_dropin_dir_path }}/90-managed.conf"
    content: "net.ipv4.tcp_rfc1337 = 1\n"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644


- name: "Molecule | Prepare | sysctl | Install the extra kernel modules package (Enterprise Linux 10)"
  # br_netfilter (needed by the container profile checks in the verify stage)
  # lives in kernel-modules-extra on Enterprise Linux 10, which the cloud
  # images do not ship. Version-matched to the running kernel: a bare package
  # name would pull the newest kernel's build, which the running kernel
  # cannot load.
  ansible.builtin.package:
    name: "kernel-modules-extra-{{ ansible_facts['kernel'] }}"
    state: "present"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat'
    - (ansible_facts['distribution'] | ansible.builtin.lower) != 'fedora'
    - ansible_facts['distribution_major_version'] == '10'


## Fixtures for the foundata.linux.user role tests.
#
# Created here (the prepare stage only auto-includes all.yml and
# <inventory_hostname>.yml, not every *.yml) and ONCE, so the role's destructive
# actions become observable on the first converge (removing absent accounts,
# reaping unmanaged ones, purging non-exclusive keys) while the second converge
# stays idempotent.

- name: "Molecule | Prepare | sudo | Seed a stale role-managed drop-in the role must clean up"
  # A leftover "99_managed_*" file that no current rule produces (simulates a
  # renamed rule or a removed grantee). Seeded in prepare (once) so the first
  # converge removes it via the always-on namespace cleanup and the second
  # converge stays idempotent.
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/99_managed_molecule_orphan-user-ghost-deadbeef"
    content: "molecule_ghost ALL=(ALL) NOPASSWD: /usr/bin/true\n"
    owner: "root"
    group: "root"
    mode: "u=r,g=r,o=" # 0440


- name: "Molecule | Prepare | user | Create a group the role will remove (state: absent)"
  ansible.builtin.group:
    name: "molecule_legacy_absent"
    state: "present"


- name: "Molecule | Prepare | user | Create an account the role will remove (state: absent)"
  ansible.builtin.user:
    name: "molecule_obsolete"
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Create an unmanaged in-range account the role should reap"
  ansible.builtin.user:
    name: "molecule_reapme"
    uid: 4998
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Create an unmanaged in-range account that is excluded from reaping"
  ansible.builtin.user:
    name: "molecule_keepme"
    uid: 4999
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Create an account with a stray authorized_key (to test exclusive purge)"
  ansible.builtin.user:
    name: "molecule_keyuser"
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Add a stray authorized_key that the role must purge"
  ansible.posix.authorized_key:
    user: "molecule_keyuser"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILmFhCG3dipt7baMWEJOo9chtWBt+rpTsltkYcnd4jcu molecule_stray@example.com"
    state: "present"


# Counterpart to molecule_keyuser: that account runs with
# ssh_authorized_keys_delete_unmanaged set to true (exclusive purge), this one
# with false. Both keys are seeded here so the role has something to actually
# remove (a per-key "state: absent" against a non-existent key would pass
# vacuously) and something it must keep its hands off.
- name: "Molecule | Prepare | user | Create an account for per-key removal without exclusive purge"
  ansible.builtin.user:
    name: "molecule_keyabsent"
    shell: "/bin/bash"
    state: "present"


- name: "Molecule | Prepare | user | Add the authorized_keys the role must remove and preserve"
  ansible.posix.authorized_key:
    user: "molecule_keyabsent"
    key: "{{ item }}"
    state: "present"
  loop:
    # removed by the role via a per-key "state: absent"
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPCKwsfPvV0FPdHtrqpD2M3kq7hqzZQSACqe91lubnBz molecule_remove@example.com"
    # unmanaged: must survive because delete_unmanaged is false for this account
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGo3ZYAUdoTQIf26vXtpPF5hoQ8OuLo5Ufcs+ZZE26Je molecule_stray@example.com"
