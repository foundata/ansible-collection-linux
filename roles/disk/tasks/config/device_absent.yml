# Absent-state handling for ONE device entry (loop_var __disk_linux_entry):
# unmount and remove the /etc/fstab entry, keeping the mountpoint directory,
# the partition, the filesystem and all data. Destroying the on-disk
# structures additionally requires wipe (already normalized to be true only
# when the entry's own effective state is "absent").
#
# Included from tasks/config/default.yml (per-item absent) and from
# tasks/setup/uninstall/default.yml (role-global disk_linux_state absent).
# The non-destructive cleanup always proceeds, even when the disk itself has
# already been detached.

---

# A stale declaration must not tear down a replacement: after a disk swap
# the declared mountpoint may be supplied by a DIFFERENT device (or by tmpfs,
# NFS, an overlay, ...), and an absent entry still addressing the old disk
# would unmount the replacement and remove its /etc/fstab entry.
#
# Classification below (the role only ever creates block-device mounts and
# UUID= fstab rows, which is what makes these rules sound):
# - A source whose ancestry (inverse lsblk, Btrfs "[/subvolume]" decoration
#   stripped first) contains the declared device is OWN: removable.
# - Every other ACTIVE source is FOREIGN - including ones lsblk cannot
#   resolve (tmpfs, NFS, overlay): whatever is mounted there now, it could
#   not be proven to be the declared device.
# - An fstab source that resolves to a different existing device, or that is
#   not block-device-shaped at all (tmpfs, server:/export), is FOREIGN.
# - An fstab source that is a dead tag (findmnt --evaluate leaves it blank)
#   or a dead /dev path is the normal remains of an already-detached disk:
#   removable WITHOUT further proof of ownership - deliberately no manifest,
#   the dead row at the declared mountpoint is treated as authoritative.

- name: "Absent | Determine the canonical name of the declared device"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_lsblk_exec_path }}"
      - "--noheadings"
      - "--nodeps"
      - "--output"
      - "KNAME"
      - "{{ __disk_linux_entry['device'] }}"
  changed_when:
    - false
  # a detached declared device has no canonical name; every resolvable
  # source is foreign then
  failed_when:
    - false
  register: __disk_linux_absent_kname_result


- name: "Absent | Determine the active source of the declared mountpoint"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_findmnt_exec_path }}"
      - "--noheadings"
      - "--output"
      - "SOURCE"
      - "--mountpoint"
      - "{{ __disk_linux_entry['path'] }}"
  changed_when:
    - false
  failed_when:
    - __disk_linux_absent_active_result['rc'] not in [0, 1]
  register: __disk_linux_absent_active_result


- name: "Absent | Determine the /etc/fstab source of the declared mountpoint"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_findmnt_exec_path }}"
      - "--fstab"
      - "--evaluate"
      - "--noheadings"
      - "--output"
      - "SOURCE"
      - "--mountpoint"
      - "{{ __disk_linux_entry['path'] }}"
  changed_when:
    - false
  failed_when:
    - __disk_linux_absent_fstab_result['rc'] not in [0, 1]
  register: __disk_linux_absent_fstab_result


- name: "Absent | Resolve the ancestors of every source"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_lsblk_exec_path }}"
      - "--noheadings"
      - "--inverse"
      - "--output"
      - "KNAME"
      - "{{ __disk_linux_absent_source['normalized'] }}"
  changed_when:
    - false
  # sources without an existing block device are exactly the stale remains
  # this cleanup exists for
  failed_when:
    - false
  # provenance is preserved: an unresolvable ACTIVE source is foreign, an
  # unresolvable fstab source may be the removable remains of a dead disk
  loop: >-
    {%- set __ns = namespace(rows=[], seen=[]) -%}
    {%- set __groups = [
          ['active', __disk_linux_absent_active_result['stdout_lines'] | ansible.builtin.default([])],
          ['fstab', __disk_linux_absent_fstab_result['stdout_lines'] | ansible.builtin.default([])],
        ] -%}
    {%- for __origin, __lines in __groups -%}
    {%-   for __line in __lines -%}
    {%-     set __src = __line | ansible.builtin.trim -%}
    {#-     blank = a tag findmnt --evaluate could not resolve (dead disk) -#}
    {%-     if (__src | ansible.builtin.length) > 0 -%}
    {%-       set __norm = __src | ansible.builtin.regex_replace('\[.*\]$', '') -%}
    {%-       if (__origin ~ ':' ~ __norm) not in __ns.seen -%}
    {%-         set _ = __ns.seen.append(__origin ~ ':' ~ __norm) -%}
    {%-         set _ = __ns.rows.append({'source': __src, 'normalized': __norm, 'origin': __origin}) -%}
    {%-       endif -%}
    {%-     endif -%}
    {%-   endfor -%}
    {%- endfor -%}
    {{ __ns.rows }}
  loop_control:
    loop_var: "__disk_linux_absent_source"
    label: "{{ __disk_linux_absent_source['origin'] }}: {{ __disk_linux_absent_source['source'] }}"
  register: __disk_linux_absent_ancestry_result


- name: "Absent | Check every source belongs to the declared device"
  ansible.builtin.assert:
    that:
      - (__disk_linux_absent_foreign | ansible.builtin.length) == 0
    fail_msg: >-
      Refusing the absent cleanup of {{ __disk_linux_entry['path'] }}: the
      active mount or its /etc/fstab entry is backed by
      {{ __disk_linux_absent_foreign | ansible.builtin.join(', ') }}, which
      does not belong to the declared device
      {{ __disk_linux_entry['device'] }}. Update or remove the stale
      declaration; the role never touches the resources of other devices.
    quiet: true
  vars:
    __disk_linux_absent_kname: "{{ __disk_linux_absent_kname_result['stdout'] | ansible.builtin.default('') | ansible.builtin.trim }}"
    __disk_linux_absent_foreign: >-
      {%- set __ns = namespace(foreign=[]) -%}
      {%- for __r in (__disk_linux_absent_ancestry_result['results'] | ansible.builtin.default([])) -%}
      {%-   set __src = __r['__disk_linux_absent_source'] -%}
      {%-   if (__r['rc'] | ansible.builtin.default(1)) == 0 -%}
      {%-     set __ancestors = (__r['stdout_lines'] | ansible.builtin.default([]))
                | ansible.builtin.map('ansible.builtin.trim') | ansible.builtin.list -%}
      {%-     if ((__disk_linux_absent_kname | ansible.builtin.length) == 0)
                or (__disk_linux_absent_kname not in __ancestors) -%}
      {%-       set _ = __ns.foreign.append(__src['origin'] ~ ' source ' ~ __src['source']) -%}
      {%-     endif -%}
      {%-   elif __src['origin'] == 'active' -%}
      {#-     an active mount that could not be proven ours (tmpfs, NFS,
              overlay, vanished device) is never unmounted -#}
      {%-     set _ = __ns.foreign.append('active source ' ~ __src['source'] ~ ' (unresolvable)') -%}
      {%-   elif not (__src['normalized'] is ansible.builtin.match('^/dev/')) -%}
      {#-     a non-block fstab row (tmpfs, server:/export) was never written
              by this role; a dead /dev path stays removable -#}
      {%-     set _ = __ns.foreign.append('fstab source ' ~ __src['source'] ~ ' (not a block device)') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.foreign }}


- name: "Absent | Unmount the filesystem"
  ansible.posix.mount:
    path: "{{ __disk_linux_entry['path'] }}"
    state: "unmounted"


- name: "Absent | Remove the /etc/fstab entry"
  ansible.posix.mount:
    path: "{{ __disk_linux_entry['path'] }}"
    state: "absent_from_fstab"


- name: "Absent | Validate /etc/fstab"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_findmnt_exec_path }}"
      - "--verify"
  changed_when:
    - false
  register: __disk_linux_absent_verify_result


- name: "Absent | Destroy the on-disk structures (wipe)"
  when:
    - __disk_linux_entry['wipe'] | ansible.builtin.bool
  block:

    - name: "Absent | Determine device existence for the wipe"
      ansible.builtin.stat:
        path: "{{ __disk_linux_entry['device'] }}"
        follow: true
      register: __disk_linux_absent_stat_result


    - name: "Absent | Fail on a missing device with on_missing policy fail"
      ansible.builtin.fail:
        msg: >-
          Cannot wipe {{ __disk_linux_entry['device'] }}: the device does not
          exist and its on_missing policy is "fail". Attach the disk or set
          on_missing to "skip" to perform the cleanup without the wipe.
      when:
        - not __disk_linux_absent_stat_result['stat']['exists']
        - __disk_linux_entry['on_missing'] == 'fail'


    # Immediate recheck right before the wipe: the aggregate pre-pass ran
    # earlier, this narrows the race between discovery and destruction (the
    # declared mount is unmounted by now, so nothing may be active anymore).
    - name: "Absent | Reset the wipe violation aggregate (immediate recheck)"
      ansible.builtin.set_fact:
        __disk_linux_wipe_violations: []
      when:
        - __disk_linux_absent_stat_result['stat']['exists']


    - name: "Absent | Run the wipe activity preflight (immediate recheck)"
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/shared/wipe_preflight.yml"
      vars:
        __disk_linux_wp_device: "{{ __disk_linux_entry['device'] }}"
        __disk_linux_wp_allowed_mountpoint: ""
      when:
        - __disk_linux_absent_stat_result['stat']['exists']


    - name: "Absent | Check the device tree is inactive (immediate recheck)"
      ansible.builtin.assert:
        that:
          - (__disk_linux_wipe_violations | ansible.builtin.length) == 0
        fail_msg: >-
          Refusing to wipe {{ __disk_linux_entry['device'] }}: its device
          tree became active again
          ({{ __disk_linux_wipe_violations | ansible.builtin.join('; ') }}).
        quiet: true
      when:
        - __disk_linux_absent_stat_result['stat']['exists']


    - name: "Absent | Notice about the skipped wipe of the missing device"
      ansible.builtin.debug:
        msg: >-
          Notice: skipping the wipe of {{ __disk_linux_entry['device'] }} - the
          device does not exist (on_missing policy is "skip"). The unmount and
          /etc/fstab cleanup was performed.
      when:
        - not __disk_linux_absent_stat_result['stat']['exists']


    - name: "Absent | Wipe the existing device"
      when:
        - __disk_linux_absent_stat_result['stat']['exists']
      block:

        - name: "Absent | Query the on-disk layout for the wipe"
          ansible.builtin.command:
            argv:
              - "{{ __disk_linux_lsblk_exec_path }}"
              - "--json"
              - "--output"
              # NAME must be part of the output: lsblk only nests the
              # "children" arrays in its JSON when the NAME column is present
              - "NAME,KNAME,MOUNTPOINTS"
              - "{{ __disk_linux_entry['device'] }}"
          changed_when:
            - false
          register: __disk_linux_absent_lsblk_result


        - name: "Absent | Derive the wipe targets"
          ansible.builtin.set_fact:
            __disk_linux_absent_children: >-
              {{
                (__disk_linux_absent_lsblk_result['stdout'] | ansible.builtin.from_json)['blockdevices'][0]['children']
                | ansible.builtin.default([])
                | ansible.builtin.map(attribute='kname')
                | ansible.builtin.list
              }}
            __disk_linux_absent_mounted_paths: >-
              {{
                (__disk_linux_absent_lsblk_result['stdout'] | ansible.builtin.from_json)['blockdevices'][0]['children']
                | ansible.builtin.default([])
                | ansible.builtin.map(attribute='mountpoints')
                | ansible.builtin.flatten
                | ansible.builtin.reject('ansible.builtin.none')
                | ansible.builtin.list
              }}


        - name: "Absent | WARNING about the following data destruction"
          ansible.builtin.debug:
            msg: >-
              WARNING: "wipe: true" is about to erase the filesystem
              signatures and the partition table of
              {{ __disk_linux_entry['device'] }}. All data on this disk becomes
              inaccessible. This is logical destruction, not secure erasure -
              use dedicated tooling before disposing of the medium.


        - name: "Absent | Unmount any remaining mounts of the disk"
          ansible.posix.mount:
            path: "{{ item }}"
            state: "unmounted"
          loop: "{{ __disk_linux_absent_mounted_paths }}"


        - name: "Absent | Erase the partition signatures"
          ansible.builtin.command:
            argv:
              - "{{ __disk_linux_wipefs_exec_path }}"
              - "--all"
              - "/dev/{{ item }}"
          changed_when:
            - (__disk_linux_absent_wipefs_part_result['stdout'] | ansible.builtin.default('', true) | ansible.builtin.length) > 0
          loop: "{{ __disk_linux_absent_children }}"
          register: __disk_linux_absent_wipefs_part_result


        - name: "Absent | Erase the partition table"
          ansible.builtin.command:
            argv:
              - "{{ __disk_linux_wipefs_exec_path }}"
              - "--all"
              - "{{ __disk_linux_entry['device'] }}"
          changed_when:
            - (__disk_linux_absent_wipefs_disk_result['stdout'] | ansible.builtin.length) > 0
          register: __disk_linux_absent_wipefs_disk_result
