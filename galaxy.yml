# Collection meta data for Galaxy (needed to to build a collection artifact)
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---

namespace: "foundata"
name: "linux"
version: "1.5.0"
license:
  # See https://spdx.org/licenses/ for valid IDs and syntax. The project's
  # REUSE.toml file provides detailed licensing and copyright information
  # in a human- and machine-readable format.
  - "GPL-3.0-or-later"
authors:
  - "Andreas Haerter <ah@foundata.com>"

readme: "README.md"
description: "Manage basic configuration and maintenance on Linux systems"
repository: "https://foundata.com/en/projects/ansible-collection-linux/#source"
documentation: "https://foundata.com/en/projects/ansible-collection-linux/#doc"
issues: "https://foundata.com/en/projects/ansible-collection-linux/#issues"
homepage: "https://foundata.com/en/projects/ansible-collection-linux/"
tags:
  - "linux"
  - "security"
  - "tools"

# Collections that this collection requires to be installed.
# Note: "*" selects the latest version available (not: "any")
dependencies:
  "ansible.posix": ">=2.0.0"
  # community.general.sudoers is used by the sudo role; setenv/noexec need >=8.4.0.
  "community.general": ">=8.4.0"

# List of file glob-like patterns to filter files or directories that should
# not be included in the build artifact. Some are always filtered by
# _build_files_manifest_walk(), e.g. galaxy.yml, *.pyc, *.retry, and .git
build_ignore:
  # Build artifacts, Ansible
  - "*.tar.gz"
  - ".ansible"
  # Parts of the collection itself
  - "changelogs/.plugin-cache.yaml"
  - "changelogs/fragments/00-fragment-template.txt"
  - "changelogs/fragments/archive"
  - "extensions/molecule"
  - "CODE_OF_CONDUCT.md"
  - "CONTRIBUTING.md"
  - "DEVELOPMENT.md"
  # Development tooling
  - ".ansible-docsmith.toml"
  - ".ansible-lint"
  - ".cache"
  - ".gitattributes"
  - ".gitignore"
  - ".mypy.ini"
  - ".mypy_cache"
  - ".nox"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".releasing.toml"
  - ".rumdl.toml"
  - ".rumdl_cache"
  - ".venv"
  - ".yamllint"
  - "antsibull-nox.toml"
  - "scripts"
  - "noxfile.py"
  - "pyproject.toml"
  - "uv.lock"
  - "releasing.toml"
  - "requirements-dev.txt"
  - "ruff.toml"
  - "rumdl.toml"
  - "tests/output"
  - "tools"
  # Repository hosting
  - ".github"
  - ".gitlab"
  # Editor / IDE configuration
  - ".idea"
  - ".vscode"
  # Coding agents
  - ".aider.conf.yml"
  - ".aiderignore"
  - ".claude"
  - ".continue"
  - ".cursor"
  - ".cursorrules"
  - ".windsurf"
  - ".windsurfrules"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "GEMINI.md"
  # OS metadata
  - ".DS_Store"
  - "Desktop.ini"
  - "Thumbs.db"
  - "Thumbs.db:encryptable"
  - "hack"
