---

# The "service" managed here is the systemd timer that triggers the unattended
# update run. Its unit name is platform-specific (see vars/<platform>.yml).

# Service-only runs can encounter unit files changed outside this play.
- name: "Service | Default | Check whether systemd needs the timer units reloaded"
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl', 'show', '--property=NeedDaemonReload', '--property=LoadState', '--']
         + ([__auto_update_linux_systemd_timer_unit_name] | ansible.builtin.reject('equalto', '') | ansible.builtin.list)
         + ([__auto_update_linux_reboot_timer_unit_name, __auto_update_linux_reboot_service_unit_name]
            if auto_update_linux_reboot == 'scheduled' else []) }}
  when:
    - auto_update_linux_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - (__auto_update_linux_systemd_timer_unit_name | ansible.builtin.length) > 0 or auto_update_linux_reboot == 'scheduled'
  changed_when:
    - false
  failed_when:
    - __auto_update_linux_unit_status['rc'] not in [0, 4]
  check_mode: false
  register: __auto_update_linux_unit_status

- name: "Service | Default | Reload stale timer units before managing their state"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - __auto_update_linux_unit_status is not ansible.builtin.skipped
    - >-
      'NeedDaemonReload=yes' in __auto_update_linux_unit_status['stdout_lines'] or
      'LoadState=not-found' in __auto_update_linux_unit_status['stdout_lines']


- name: "Service | Default | Ensure timer state: {{ __auto_update_linux_systemd_timer_unit_name }}"
  ansible.builtin.systemd_service:
    name: "{{ __auto_update_linux_systemd_timer_unit_name }}"
    state: "{{ 'started' if auto_update_linux_service_state in ['enabled', 'running'] else 'stopped' if auto_update_linux_service_state == 'disabled' }}"
    enabled: "{{ true if auto_update_linux_service_state == 'enabled' else false if auto_update_linux_service_state in ['disabled', 'running'] }}"
  when:
    - auto_update_linux_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - (__auto_update_linux_systemd_timer_unit_name | ansible.builtin.length) > 0


# Scheduled reboot timer (auto_update_linux_reboot == "scheduled"). Its units
# are installed/removed in tasks/config/default.yml; here we only manage its
# enable/run state, following auto_update_linux_service_state like the update
# timer above (so "disabled" does not leave a forced reboot timer running, and
# "unmanaged" leaves its state untouched).
- name: "Service | Default | Ensure scheduled reboot timer state: {{ __auto_update_linux_reboot_timer_unit_name }}"
  ansible.builtin.systemd_service:
    name: "{{ __auto_update_linux_reboot_timer_unit_name }}"
    state: "{{ 'started' if auto_update_linux_service_state in ['enabled', 'running'] else 'stopped' if auto_update_linux_service_state == 'disabled' }}"
    enabled: "{{ true if auto_update_linux_service_state == 'enabled' else false if auto_update_linux_service_state in ['disabled', 'running'] }}"
  when:
    - auto_update_linux_reboot == 'scheduled'
    - auto_update_linux_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
