# Check collection role "auto_update" outcomes.

- name: "Molecule | Verify | Set auto_update_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'match', '^(auto_update_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | Initialize the foundata.linux.auto_update role (expose internal variables without running it)"
  ansible.builtin.include_role:
    name: "foundata.linux.auto_update"
    tasks_from: "init"
    public: true


## systemd timer drop-in

- name: "Molecule | Verify | Check if the systemd timer drop-in file exists"
  ansible.builtin.stat:
    path: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}"
  register: __testing_timer_dropin


- name: "Molecule | Verify | Assert the systemd timer drop-in file exists"
  ansible.builtin.assert:
    that:
      - __testing_timer_dropin['stat']['exists']
    fail_msg: "The systemd timer drop-in '{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}' does not exist."
    success_msg: "The systemd timer drop-in '{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}' exists."


- name: "Molecule | Verify | Read the systemd timer drop-in file content"
  ansible.builtin.slurp:
    src: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}"
  register: __testing_timer_dropin_content


- name: "Molecule | Verify | Assert the timer drop-in contains the configured schedule"
  ansible.builtin.assert:
    that:
      - "__testing_needle in (__testing_timer_dropin_content['content'] | ansible.builtin.b64decode)"
    fail_msg: "Expected '{{ __testing_needle }}' not found in the timer drop-in file."
    success_msg: "Found '{{ __testing_needle }}' in the timer drop-in file."
  loop:
    - "[Timer]"
    - "OnCalendar=*-*-* 03:30:00"
    - "RandomizedDelaySec=30m"
  loop_control:
    loop_var: "__testing_needle"


# All trigger directives share one list in systemd, so the drop-in must carry
# exactly ONE empty reset line: a second one would wipe the triggers rendered
# before it. The two configured OnCalendar values must therefore appear as two
# assignments after that single reset.
- name: "Molecule | Verify | Assert the timer drop-in carries exactly one trigger reset"
  vars:
    __testing_timer_dropin_decoded: "{{ __testing_timer_dropin_content['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      - >-
        (__testing_timer_dropin_decoded | ansible.builtin.regex_findall('(?m)^OnCalendar=$')
         | ansible.builtin.length) == 1
      - >-
        (__testing_timer_dropin_decoded | ansible.builtin.regex_findall('(?m)^OnCalendar=.+$')
         | ansible.builtin.length) == 2
    fail_msg: >-
      The rendered timer drop-in must contain exactly one empty 'OnCalendar=' reset line
      followed by the two configured expressions.
      Actual content: {{ __testing_timer_dropin_decoded }}
    success_msg: >-
      The rendered timer drop-in carries exactly one trigger reset followed by both
      configured OnCalendar expressions.


- name: "Molecule | Verify | Get enablement state of the automatic update timer"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "is-enabled"
      - "{{ __auto_update_linux_systemd_timer_unit_name }}"
  register: __testing_timer_enabled
  changed_when:
    - false
  failed_when:
    - false


- name: "Molecule | Verify | Assert the automatic update timer is enabled"
  ansible.builtin.assert:
    that:
      - "'enabled' in __testing_timer_enabled['stdout']"
    fail_msg: "The timer '{{ __auto_update_linux_systemd_timer_unit_name }}' is not enabled (is-enabled returned '{{ __testing_timer_enabled['stdout'] }}')."
    success_msg: "The timer '{{ __auto_update_linux_systemd_timer_unit_name }}' is enabled."


# The drop-in must REPLACE the vendor timer's schedule, not add to it. OnCalendar
# is a list-typed systemd directive, so a drop-in that does not reset it first
# leaves the vendor schedule active alongside the configured one. TimersCalendar
# reflects the effective, merged schedule and lists one "OnCalendar=" entry per
# active calendar spec, which makes accumulation visible without hard-coding
# each platform's vendor time.
- name: "Molecule | Verify | Get the effective calendar schedule of the automatic update timer"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "--property=TimersCalendar"
      - "--property=TimersMonotonic"
      - "{{ __auto_update_linux_systemd_timer_unit_name }}"
  register: __testing_timer_calendar
  changed_when:
    - false


- name: "Molecule | Verify | Assert the drop-in replaces the vendor schedule instead of accumulating"
  ansible.builtin.assert:
    that:
      - "'03:30:00' in __testing_timer_calendar['stdout']"
      - "'05:00:00' in __testing_timer_calendar['stdout']"
      # both configured expressions, and nothing from the vendor unit
      - "(__testing_timer_calendar['stdout'] | ansible.builtin.regex_findall('OnCalendar=') | ansible.builtin.length) == 2"
      # the configured monotonic trigger must survive next to the calendar one
      - "'OnActiveUSec=1w' in __testing_timer_calendar['stdout']"
    fail_msg: >-
      The timer '{{ __auto_update_linux_systemd_timer_unit_name }}' has an
      unexpected effective schedule: the drop-in must replace the vendor
      OnCalendar, not add to it. Got '{{ __testing_timer_calendar['stdout'] }}'.
    success_msg: >-
      The timer '{{ __auto_update_linux_systemd_timer_unit_name }}' runs only on
      the configured schedule ('{{ __testing_timer_calendar['stdout'] }}').


## Backend configuration: unattended-upgrades (Debian/Ubuntu)

- name: "Molecule | Verify | unattended-upgrades | Read the managed configuration file"
  ansible.builtin.slurp:
    src: "{{ __auto_update_linux_apt_config_file_path }}"
  register: __testing_apt_config
  when:
    - __auto_update_linux_backend == 'unattended-upgrades'


- name: "Molecule | Verify | unattended-upgrades | Assert the configuration contains the expected settings"
  ansible.builtin.assert:
    that:
      - "__testing_needle in (__testing_apt_config['content'] | ansible.builtin.b64decode)"
    fail_msg: "Expected '{{ __testing_needle }}' not found in '{{ __auto_update_linux_apt_config_file_path }}'."
    success_msg: "Found '{{ __testing_needle }}' in '{{ __auto_update_linux_apt_config_file_path }}'."
  loop:
    - "Unattended-Upgrade::Origins-Pattern"
    # reboot == scheduled forces the backend-native reboot off
    - 'Unattended-Upgrade::Automatic-Reboot "false"'
    - 'Unattended-Upgrade::Download-Only "false"'
    - '"vim"'
  loop_control:
    loop_var: "__testing_needle"
  when:
    - __auto_update_linux_backend == 'unattended-upgrades'


- name: "Molecule | Verify | unattended-upgrades | Assert a security Origins-Pattern entry is well-formed"
  vars:
    __testing_uu_content: "{{ __testing_apt_config['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # A key=value security origin whose codename/archive ends in "-security"
      # must be present. Guards two bugs: the Debian codename lacking the
      # "-security" suffix (never matches the security archive), and Ubuntu using
      # the "origin:archive" colon shorthand (Allowed-Origins syntax, which
      # raises "not enough values to unpack" inside Origins-Pattern).
      - '__testing_uu_content is regex("(codename|archive)=[^,\"]*-security")'
    fail_msg: "No well-formed '-security' Origins-Pattern entry in '{{ __auto_update_linux_apt_config_file_path }}'."
    success_msg: "The unattended-upgrades config has a well-formed security Origins-Pattern entry."
  when:
    - __auto_update_linux_backend == 'unattended-upgrades'


## Backend configuration: dnf / dnf5 automatic (RHEL/Fedora)

- name: "Molecule | Verify | dnf-automatic | Read the managed configuration file"
  ansible.builtin.slurp:
    src: "{{ __auto_update_linux_dnf_config_file_path }}"
  register: __testing_dnf_config
  when:
    - __auto_update_linux_backend == 'dnf-automatic'


- name: "Molecule | Verify | dnf-automatic | Assert the configuration contains the expected settings"
  ansible.builtin.assert:
    that:
      - "__testing_needle in (__testing_dnf_config['content'] | ansible.builtin.b64decode)"
    fail_msg: "Expected '{{ __testing_needle }}' not found in '{{ __auto_update_linux_dnf_config_file_path }}'."
    success_msg: "Found '{{ __testing_needle }}' in '{{ __auto_update_linux_dnf_config_file_path }}'."
  loop:
    - "upgrade_type = security"
    - "download_updates = yes"
    - "apply_updates = yes"
    # reboot == scheduled forces the backend-native reboot off
    - "reboot = never"
    - "exclude = vim"
  loop_control:
    loop_var: "__testing_needle"
  when:
    - __auto_update_linux_backend == 'dnf-automatic'


