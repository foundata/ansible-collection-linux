# Default variables and values for this role.
#
# These variables are designed to be easily overridden (as they have a low
# precedence) and typically allow users to customize the role's behavior.
# Each variable should have a clear comment above it, describing its purpose
# and how it fits into the role's functionality.

---

# Determines whether the managed resources should be `present` or `absent`.
#
# `present` ensures that required components, such as software packages, are
# installed and configured.
#
# `absent` reverts changes as much as possible, such as removing packages,
# deleting created users, stopping services, restoring modified settings, …
#
# - Type: str
# - Required: No
# - Default: present
# - Choices: present, absent
auto_update_linux_state: "present"


# If set to `true`, all managed packages will be upgraded during each Ansible
# run (e.g., when the package provider detects a newer version than the
# currently installed one).
#
# Note: This only affects the packages that provide the automatic update
# mechanism itself (e.g., `unattended-upgrades`, `dnf-automatic`,
# `dnf5-plugin-automatic` or `os-update`). It does not control the unattended
# updates applied to the rest of the system; those are governed by
# `auto_update_linux_type` and `auto_update_linux_apply`.
#
# - Type: bool
# - Required: No
# - Default: false
auto_update_linux_autoupgrade: false


# Defines the status of the service(s) the role needs on the target platform to
# perform automatic updates. On all currently supported platforms this is just a
# single systemd timer (such as `apt-daily-upgrade.timer`,
# `dnf-automatic.timer`, `dnf5-automatic.timer` or `os-update.timer`) that
# periodically triggers the unattended update run. The term "service" is used
# generically and also covers such timer units.
#
# Possible values:
#
# - `enabled`: Service is running and will start automatically at boot.
# - `disabled`: Service is stopped and will not start automatically at boot.
# - `running`: Service is running but will not start automatically at boot. This
#   can be used to start a service on the first Ansible run without enabling it
#   for boot.
# - `unmanaged`: Service will not start at boot, and Ansible will not manage its
#   running state. This is primarily useful when services are monitored and
#   managed by systems other than Ansible.
#
# The singular form ("service") is used for simplicity. However, the defined
# status applies to all services if multiple are being managed by this role.
#
# Note: Most platforms ship the relevant timer disabled by default, so `enabled`
# is required for unattended updates to actually take place. Only effective when
# `auto_update_linux_state` is `present`.
#
# - Type: str
# - Required: No
# - Default: enabled
# - Choices: enabled, disabled, running, unmanaged
auto_update_linux_service_state: "enabled"

# Selects which kinds of updates are installed automatically. Possible values:
#
# - `security`: Only security updates are applied. This is the recommended and
#   safest default for unattended operation.
# - `all`: All available updates are applied (security and non-security).
#
# Supported on all platforms.
#
# - Type: str
# - Required: No
# - Default: security
# - Choices: security, all
auto_update_linux_type: "security"

# Controls what the automatic update mechanism does when updates are available.
# Possible values:
#
# - `install`: Download and install updates automatically.
# - `download`: Only download updates; do not install them.
# - `notify`: Only check and notify (e.g., via email/MOTD); do not download or
#   install.
#
# Backend support:
#
# - Debian/Ubuntu (`unattended-upgrades`): `install` and `download`. `notify` is
#   best-effort.
# - RHEL/Fedora (`dnf`/`dnf5` automatic): `install`, `download` and `notify`.
# - openSUSE Leap (`os-update`): `install` only. `download` and `notify` emit a
#   notice and fall back to `install`.
#
# - Type: str
# - Required: No
# - Default: install
# - Choices: install, download, notify
auto_update_linux_apply: "install"

# Configuration for the systemd timer that triggers the automatic update run.
# This dictionary controls when and how often updates are checked/applied.
#
# These settings map to systemd timer unit directives and are applied via a
# drop-in override file. They take highest priority, overriding internal
# defaults (see `__auto_update_linux_timer_settings_defaults` in
# `vars/main.yml`) and platform-specific overrides.
#
# Use standard systemd `[Timer]` directives as keys with their corresponding
# values.
#
# Dictionary structure:
#
# - Keys: Standard systemd `[Timer]` directives.
# - Values: Corresponding configuration values. Common options include:
#     - `OnCalendar`: Defines the schedule on which the update timer is triggered.
#       Defaults to `daily`. An (at least) daily schedule is recommended for
#       security updates.
#     - `RandomizedDelaySec`: Adds a random delay before execution to avoid
#       simultaneous runs across systems. Defaults to `60m`.
#     - `Persistent`: Ensures missed timer runs are executed at the next boot if
#       the system was powered off. Defaults to `true`.
#
# Special cases:
#
# - For boolean values, use `true`/`false` (these will be converted to strings
#   by the role as needed).
#
# Only effective when `auto_update_linux_state` is `present` and
# `auto_update_linux_service_state` is not `unmanaged`.
#
# - Type: dict
# - Required: No
# - Default: {}
auto_update_linux_timer_settings: {}

# Controls whether and when the system reboots automatically after unattended
# updates. Automatic updates run out-of-band (triggered by a timer, while no
# Ansible run is active), so any reboot is likewise performed out-of-band and
# not by the `foundata.linux.reboot` role. Possible values:
#
# - `never`: Never reboot automatically.
# - `immediate`: Reboot immediately after the unattended update run, using the
#   platform's native mechanism (`unattended-upgrades` `Automatic-Reboot`,
#   `dnf`/`dnf5` automatic `reboot = when-needed`, `os-update`
#   `REBOOT_CMD=auto`). The timing is uncontrolled: the reboot rides on the
#   update timer and its `RandomizedDelaySec`, so it can happen at an
#   unpredictable moment.
# - `scheduled`: Reboot at a controlled time via a role-managed systemd timer
#   (`auto-update-reboot.timer`) that runs a "reboot if needed" check on the
#   schedule from `auto_update_linux_reboot_timer_settings`. The platform's
#   native reboot is forced off so the system only reboots in this window.
#
# Both `immediate` and `scheduled` reboot **only when a reboot is actually
# required** (e.g. after a kernel, glibc or systemd upgrade); an up-to-date
# system is never rebooted. Reboots require a systemd-managed host.
#
# - Type: str
# - Required: No
# - Default: never
# - Choices: never, immediate, scheduled
auto_update_linux_reboot: "never"


# Configuration for the role-managed systemd timer that performs the scheduled
# "reboot if needed" check. This dictionary controls when that check runs.
#
# Only effective when `auto_update_linux_reboot` is `scheduled` (and
# `auto_update_linux_state` is `present` on a systemd-managed host). The
# settings map to systemd timer unit directives and override the internal
# defaults (see `__auto_update_linux_reboot_timer_settings_defaults` in
# `vars/main.yml`).
#
# Use standard systemd `[Timer]` directives as keys with their corresponding
# values.
#
# Dictionary structure:
#
# - Keys: Standard systemd `[Timer]` directives.
# - Values: Corresponding configuration values. Common options include:
#     - `OnCalendar`: When the reboot check runs. Defaults to `*-*-* 04:00:00`.
#       Choose a time after the update window so a reboot triggered by updates is
#       picked up in the same night.
#     - `RandomizedDelaySec`: Random delay before execution to spread reboots
#       across systems. Defaults to `30m`.
#     - `Persistent`: Run a missed check at the next boot if the system was
#       powered off. Defaults to `true`.
#
# Special cases:
#
# - For boolean values, use `true`/`false` (these will be converted to strings
#   by the role as needed).
#
# - Type: dict
# - Required: No
# - Default: {}
auto_update_linux_reboot_timer_settings: {}


# List of package names (or globs/patterns) to hold back from automatic updates.
#
# Backend support:
#
# - Debian/Ubuntu (`unattended-upgrades`): Yes.
# - RHEL/Fedora (`dnf`/`dnf5` automatic): Yes.
# - openSUSE Leap (`os-update`): No. A notice is emitted if the list is
#   non-empty.
#
# Example:
#
# ```yaml
# auto_update_linux_exclude:
#   - "linux-image-*"
#   - "docker-ce"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: str
auto_update_linux_exclude: []

# Email address that should receive automatic update reports. An empty string
# (the default) disables email notifications.
#
# Backend support:
#
# - Debian/Ubuntu (`unattended-upgrades`): Yes.
# - RHEL/Fedora (`dnf`/`dnf5` automatic): Yes.
# - openSUSE Leap (`os-update`): No. A notice is emitted if a value is set.
#
# Note: Sending mail requires a working local mail transport (MTA) on the
# managed host; configuring one is out of scope for this role.
#
# - Type: str
# - Required: No
# - Default: ""
auto_update_linux_notify_email: ""

# Additional, backend-native configuration written verbatim into the
# configuration of the active update mechanism. This is an escape hatch for
# advanced options not covered by the dedicated parameters above; values set
# here take precedence over the values derived from those parameters.
#
# The dictionary is keyed by backend, so the same variable can carry settings
# for mixed-platform inventories. Only the key matching the target host's
# backend is applied; the others are ignored.
#
# Top-level keys (backends):
#
# - `apt`: Debian/Ubuntu (`unattended-upgrades`). A flat dictionary; keys are
#   full apt option names, rendered as `KEY "VALUE";` apt configuration lines.
# - `dnf`: RHEL/Fedora (`dnf`/`dnf5` automatic). A dictionary keyed by
#   `automatic.conf` section name (`commands`, `emitters`, `email`, `base`, …);
#   each value is a flat dictionary of that section's `key: value` pairs.
# - `os_update`: openSUSE Leap (`os-update`). A flat dictionary; keys are
#   os-update variable names, rendered as `KEY="VALUE"` lines in
#   `/etc/os-update.conf`.
#
# Example:
#
# ```yaml
# auto_update_linux_extra_config:
#   unattended-upgrades:
#     "Unattended-Upgrade::MinimalSteps": "true"
#   dnf-automatic:
#     commands:
#       network_online_timeout: 120
#   os-update:
#     RESTART_SERVICES: "no"
# ```
#
# - Type: dict
# - Required: No
# - Default: {}
auto_update_linux_extra_config: {}
