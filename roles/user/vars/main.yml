# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# List of facts used by the role (gathered on a best-effort basis if needed).
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__user_linux_used_facts:
  # from subset "distribution"
  - "distribution"
  - "distribution_major_version"
  - "distribution_version"
  - "os_family"


# List of platforms this role supports and was designed for.
#
# A warning will be issued if the list contains values and the role is executed
# on an unknown (not listed) platform, but execution will continue. Example:
#
# - name: "Fedora" # A ansible_facts value ('distribution' or 'os_family')
#   versions: # A ansible_facts value ('distribution_major_version' or
#     - "all" # 'distribution_version') or "all"
# - name: "Ubuntu"
#   versions:
#     - "22.04"
#     - "24.04"
# - name: "RedHat"
#   versions:
#     - "all"
# - name: "Debian"
#   versions:
#     - "all"
__user_linux_supported_platforms:
  - name: "Debian"
    versions:
      - "12"
      - "13"
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "openSUSE Leap"
    versions:
      - "16.0"
  - name: "RedHat" # includes AlmaLinux, Rocky and CentOS Stream
    versions:
      - "9"
      - "10"
  - name: "Ubuntu"
    versions:
      - "22.04"
      - "24.04"
      - "26.04"

# Built-in default values applied to every entry in "user_linux_accounts" that
# does not set the corresponding key itself. The public "user_linux_account_defaults"
# is deep-merged over this dict (see __user_linux_account_defaults_effective below),
# and an individual account overrides both.
#
# Keys not listed here have no role-level default: the matching ansible.builtin.user
# parameter is omitted, so its own module default applies (e.g. "uid" auto-allocates,
# an unset "group" yields a user-private group).
#
# Three values deliberately deviate from the ansible.builtin.user module defaults:
#   - groups_append: true        (module "append" defaults to false)
#   - home.move: true            (module "move_home" defaults to false)
#   - password.update: on_create (module "update_password" defaults to "always")
__user_linux_account_defaults_builtin:
  state: "present"
  comment: ""
  shell: "/bin/bash"
  umask: "0027"
  system: false
  local: false
  groups_append: true
  expires: -1
  home:
    create: true
    move: true
  password:
    update: "on_create"
  ssh_authorized_keys_delete_unmanaged: false


# Effective per-account defaults: the built-in defaults deep-merged with the public
# "user_linux_account_defaults". Evaluated lazily on first dereference, by which
# point tasks/init.yml has loaded any platform-specific vars. Each account in
# "user_linux_accounts" is in turn merged over this in tasks/config/default.yml.
__user_linux_account_defaults_effective: >-
  {{
    __user_linux_account_defaults_builtin
    | ansible.builtin.combine(user_linux_account_defaults, recursive=true)
  }}


# Path to the login.defs file from which UID_MIN/UID_MAX are read when reaping
# unmanaged accounts. Defaults to the traditional /etc location; openSUSE Leap
# (stateless /usr) overrides this to /usr/etc/login.defs in vars/suse.yml. A
# missing file is tolerated (the role falls back to UID_MIN 1000 / UID_MAX 60000).
__user_linux_login_defs_path: "/etc/login.defs"


# Name of the administrative group on this platform, for convenient reference by
# callers (e.g. in "user_linux_accounts[].groups"). The role itself does not act
# on it. Defaults to "wheel" (RedHat/Fedora/SUSE); overridden to "sudo" for
# Debian/Ubuntu in vars/debian.yml.
__user_linux_admin_group: "wheel"


### Override defaults of dependencies used by this role (if any).

# nothing right now
