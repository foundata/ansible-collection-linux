# Regression test: profile kernel modules load best effort on EVERY platform.
#
# Background: the "container" profile depends on br_netfilter, which
# Enterprise Linux 10 cloud images cannot load (br_netfilter.ko ships in
# kernel-modules-extra, which GenericCloud images do not install). The role
# used to hard-fail there despite its "best effort" claim. It must now
# converge everywhere, drop the parameters gated by an unloadable module with
# a notice, and only fail when sysctl_linux_modules_required is enabled.
#
# Coverage comes in two parts. The availability-adaptive checks below assert
# both directions (keys present exactly where the module is loadable) on
# whatever the platform provides - note the molecule VMs usually CAN load
# every profile module (the prepare stage upgrades the kernel/module
# packages), unlike the stock cloud images of the original incident. The
# synthetic-negative section afterwards therefore forces the unloadable case
# deterministically on every platform.

- name: "Molecule | Verify | sysctl modules | Probe which profile kernel modules the running kernel can resolve"
  ansible.builtin.command:
    argv: ["modprobe", "-n", "{{ __testing_sysctl_module_item }}"]
  changed_when:
    - false
  failed_when:
    - false
  loop:
    - "br_netfilter"
    - "nf_conntrack"
  loop_control:
    loop_var: "__testing_sysctl_module_item"
  register: __testing_sysctl_module_probe


- name: "Molecule | Verify | sysctl modules | Set module availability facts"
  ansible.builtin.set_fact:
    __testing_sysctl_brnf_available: "{{ __testing_sysctl_module_probe['results'][0]['rc'] == 0 }}"
    __testing_sysctl_conntrack_available: "{{ __testing_sysctl_module_probe['results'][1]['rc'] == 0 }}"


- name: "Molecule | Verify | sysctl modules | Show module availability"
  ansible.builtin.debug:
    msg: >-
      Resolvable by the running kernel: br_netfilter={{ __testing_sysctl_brnf_available }},
      nf_conntrack={{ __testing_sysctl_conntrack_available }}


# Explicit empty sysctl_linux_parameters: converge-time set_fact variables
# survive into verify and would otherwise leak into this run (include_role
# vars beat set_fact).
- name: "Molecule | Verify | sysctl modules | Include the sysctl role with the container profile (best effort default)"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
  vars:
    sysctl_linux_profile: ["container"]
    sysctl_linux_parameters: {}
    sysctl_linux_config_dropin_file_name: "zz-testing-modules.conf"


- name: "Molecule | Verify | sysctl modules | Read the rendered drop-in"
  ansible.builtin.slurp:
    src: "/etc/sysctl.d/zz-testing-modules.conf"
  register: __testing_sysctl_modules_dropin


- name: "Molecule | Verify | sysctl modules | Decode the rendered drop-in"
  ansible.builtin.set_fact:
    __testing_sysctl_modules_dropin_content: "{{ __testing_sysctl_modules_dropin['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | sysctl modules | Assert module-gated keys match the module availability"
  ansible.builtin.assert:
    that:
      - >-
        (__testing_sysctl_modules_dropin_content
         is ansible.builtin.search('net\.bridge\.bridge-nf-call-iptables'))
        == (__testing_sysctl_brnf_available | ansible.builtin.bool)
      - >-
        (__testing_sysctl_modules_dropin_content
         is ansible.builtin.search('net\.netfilter\.nf_conntrack_max'))
        == (__testing_sysctl_conntrack_available | ansible.builtin.bool)
      # keys without module dependency are present regardless
      - >-
        __testing_sysctl_modules_dropin_content
        is ansible.builtin.search('net\.ipv4\.ip_forward')
    fail_msg: >-
      The rendered drop-in does not match the module availability
      (br_netfilter={{ __testing_sysctl_brnf_available }},
      nf_conntrack={{ __testing_sysctl_conntrack_available }}):
      {{ __testing_sysctl_modules_dropin_content }}
    success_msg: "Module-gated keys are present exactly where their module is loadable."


- name: "Molecule | Verify | sysctl modules | Check the live bridge netfilter value (module loaded and applied)"
  ansible.builtin.command:
    argv: ["sysctl", "-n", "net.bridge.bridge-nf-call-iptables"]
  changed_when:
    - false
  register: __testing_sysctl_brnf_live
  when:
    - __testing_sysctl_brnf_available | ansible.builtin.bool


- name: "Molecule | Verify | sysctl modules | Assert the live bridge netfilter value"
  ansible.builtin.assert:
    that:
      - __testing_sysctl_brnf_live['stdout'] == '1'
    fail_msg: "br_netfilter is loadable but net.bridge.bridge-nf-call-iptables is not applied."
    success_msg: "br_netfilter got loaded and net.bridge.bridge-nf-call-iptables is applied."
  when:
    - __testing_sysctl_brnf_available | ansible.builtin.bool


# sysctl_linux_modules_required: true must fail exactly on the platforms where
# a profile module is unloadable, and change nothing on the others.
- name: "Molecule | Verify | sysctl modules | Attempt a run with sysctl_linux_modules_required enabled"
  block:

    - name: "Molecule | Verify | sysctl modules | Include the sysctl role requiring the profile modules"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_profile: ["container"]
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-testing-modules.conf"
        sysctl_linux_modules_required: true

    - name: "Molecule | Verify | sysctl modules | Record that the required-modules run succeeded"
      ansible.builtin.set_fact:
        __testing_sysctl_required_failed: false

  rescue:

    - name: "Molecule | Verify | sysctl modules | Record that the required-modules run failed"
      ansible.builtin.set_fact:
        __testing_sysctl_required_failed: true


- name: "Molecule | Verify | sysctl modules | Assert sysctl_linux_modules_required fails exactly on unloadable modules"
  ansible.builtin.assert:
    that:
      - >-
        (__testing_sysctl_required_failed | ansible.builtin.bool)
        == (not ((__testing_sysctl_brnf_available | ansible.builtin.bool)
                 and (__testing_sysctl_conntrack_available | ansible.builtin.bool)))
    fail_msg: >-
      sysctl_linux_modules_required=true
      {{ 'failed although all modules are loadable' if (__testing_sysctl_required_failed | ansible.builtin.bool)
         else 'did not fail although a module is unloadable' }}
      (br_netfilter={{ __testing_sysctl_brnf_available }},
      nf_conntrack={{ __testing_sysctl_conntrack_available }}).
    success_msg: "sysctl_linux_modules_required behaves correctly for this platform."


# Synthetic negative: the role-internal module map is overridden with a
# module that cannot exist. include_role vars are role params (precedence
# 20) and shadow the role's set_fact accumulator (precedence 19), so init
# probes only the bogus mapping, which gates the net.bridge.* prefix. The
# role must converge, drop those keys from the drop-in with a notice and
# keep all others. (Ordering note: the net.netfilter.* keys stay writable
# for the live-apply because the positive run above already loaded
# nf_conntrack.)
- name: "Molecule | Verify | sysctl modules | Include the sysctl role with an unloadable module mapping (synthetic negative)"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
  vars:
    sysctl_linux_profile: ["container"]
    sysctl_linux_parameters: {}
    sysctl_linux_config_dropin_file_name: "zz-testing-modules.conf"
    __sysctl_linux_profile_modules:
      molecule_testing_nonexistent_module: ["net.bridge."]


- name: "Molecule | Verify | sysctl modules | Read the drop-in after the synthetic negative run"
  ansible.builtin.slurp:
    src: "/etc/sysctl.d/zz-testing-modules.conf"
  register: __testing_sysctl_neg_dropin


- name: "Molecule | Verify | sysctl modules | Assert the gated keys were dropped and all others kept"
  ansible.builtin.assert:
    that:
      - >-
        not ((__testing_sysctl_neg_dropin['content'] | ansible.builtin.b64decode)
             is ansible.builtin.search('net\.bridge\.'))
      - >-
        (__testing_sysctl_neg_dropin['content'] | ansible.builtin.b64decode)
        is ansible.builtin.search('net\.netfilter\.nf_conntrack_max')
      - >-
        (__testing_sysctl_neg_dropin['content'] | ansible.builtin.b64decode)
        is ansible.builtin.search('net\.ipv4\.ip_forward')
    fail_msg: >-
      The synthetic unloadable module did not drop exactly the net.bridge.*
      keys: {{ __testing_sysctl_neg_dropin['content'] | ansible.builtin.b64decode }}
    success_msg: "An unloadable module drops exactly the keys it gates; the run stays green."


- name: "Molecule | Verify | sysctl modules | Attempt the synthetic negative with sysctl_linux_modules_required enabled"
  block:

    - name: "Molecule | Verify | sysctl modules | Include the sysctl role requiring the unloadable module"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_profile: ["container"]
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-testing-modules.conf"
        sysctl_linux_modules_required: true
        __sysctl_linux_profile_modules:
          molecule_testing_nonexistent_module: ["net.bridge."]

    - name: "Molecule | Verify | sysctl modules | Record that the synthetic required-modules run succeeded"
      ansible.builtin.set_fact:
        __testing_sysctl_required_neg_failed: false

  rescue:

    - name: "Molecule | Verify | sysctl modules | Record that the synthetic required-modules run failed"
      ansible.builtin.set_fact:
        __testing_sysctl_required_neg_failed: true


- name: "Molecule | Verify | sysctl modules | Assert sysctl_linux_modules_required fails on the unloadable module"
  ansible.builtin.assert:
    that:
      - __testing_sysctl_required_neg_failed | ansible.builtin.bool
    fail_msg: "sysctl_linux_modules_required=true did not fail although the (synthetic) profile module is unloadable."
    success_msg: "sysctl_linux_modules_required=true fails as intended when a profile module cannot be loaded."


- name: "Molecule | Verify | sysctl modules | Remove the test drop-in"
  ansible.builtin.file:
    path: "/etc/sysctl.d/zz-testing-modules.conf"
    state: "absent"


## Boot-time module registration (fixed role-owned file)
#
# Regression 1: the role made the profile modules persistent but never
# removed that registration again. Regression 2: the registration followed
# the configurable sysctl drop-in filename, so a filename change orphaned
# the old modules-load file, which kept loading modules at boot forever.
# The registration now lives in the fixed, marker-owned
# /etc/modules-load.d/zz-managed.conf, regardless of the sysctl filename.
# Only meaningful where the kernel can actually load the module.

- name: "Molecule | Verify | sysctl modules | Registration checks (br_netfilter loadable)"
  when:
    - __testing_sysctl_brnf_available | ansible.builtin.bool
  block:

    # Historical fixtures: files the RELEASED role versions created through
    # the modprobe persistency (one per module, no marker). Their ownership
    # is unknowable, so the role must never touch them.
    - name: "Molecule | Verify | sysctl modules | Registration: plant historical per-module files"
      ansible.builtin.copy:
        dest: "/etc/modules-load.d/{{ item }}.conf"
        content: "{{ item }}\n"
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r"
      loop:
        - "br_netfilter"
        - "nf_conntrack"

    - name: "Molecule | Verify | sysctl modules | Registration: apply a module-gated profile (first filename)"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_profile: ["container"]
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-first.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: read the fixed modules-load file"
      ansible.builtin.slurp:
        src: "/etc/modules-load.d/zz-managed.conf"
      register: __testing_sysctl_modreg_slurp

    - name: "Molecule | Verify | sysctl modules | Registration: get information about filename-derived paths"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_sysctl_modreg_paths
      loop:
        - "/etc/sysctl.d/zz-first.conf"
        - "/etc/modules-load.d/zz-first.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: assert the fixed file carries marker and module"
      ansible.builtin.assert:
        that:
          - >-
            (__testing_sysctl_modreg_content.splitlines() | ansible.builtin.first)
            == '# Managed by Ansible (foundata.linux.sysctl)'
          - "'br_netfilter' in __testing_sysctl_modreg_content.splitlines()"
          # the sysctl drop-in uses the configurable name, the registration does NOT
          - __testing_sysctl_modreg_paths['results'][0]['stat']['exists'] | ansible.builtin.bool
          - not (__testing_sysctl_modreg_paths['results'][1]['stat']['exists'] | ansible.builtin.bool)
        fail_msg: >-
          The module registration does not use the fixed marker-owned file
          ({{ __testing_sysctl_modreg_content }};
          {{ __testing_sysctl_modreg_paths['results'] | ansible.builtin.map(attribute='stat.exists') | ansible.builtin.list }}).
        success_msg: "The registration is marker-owned and independent of the sysctl filename."
      vars:
        __testing_sysctl_modreg_content: "{{ __testing_sysctl_modreg_slurp['content'] | ansible.builtin.b64decode }}"

    - name: "Molecule | Verify | sysctl modules | Registration: apply the profile again with a changed filename"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_profile: ["container"]
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-second.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: get information after the filename change"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_sysctl_modreg_renamed
      loop:
        - "/etc/modules-load.d/zz-managed.conf"
        - "/etc/modules-load.d/zz-first.conf"
        - "/etc/modules-load.d/zz-second.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: assert the filename change orphans nothing"
      ansible.builtin.assert:
        that:
          - __testing_sysctl_modreg_renamed['results'][0]['stat']['exists'] | ansible.builtin.bool
          - not (__testing_sysctl_modreg_renamed['results'][1]['stat']['exists'] | ansible.builtin.bool)
          - not (__testing_sysctl_modreg_renamed['results'][2]['stat']['exists'] | ansible.builtin.bool)
        fail_msg: "A sysctl filename change created or left a filename-derived modules-load file."
        success_msg: "The registration survives a sysctl filename change at the fixed path only."

    - name: "Molecule | Verify | sysctl modules | Registration: drop the profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_profile: []
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-second.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: get information after dropping the profile"
      ansible.builtin.stat:
        path: "/etc/modules-load.d/zz-managed.conf"
      register: __testing_sysctl_modreg_dropped

    - name: "Molecule | Verify | sysctl modules | Registration: query the running module"
      ansible.builtin.command:
        argv: ["lsmod"]
      register: __testing_sysctl_modreg_lsmod
      changed_when:
        - false

    - name: "Molecule | Verify | sysctl modules | Registration: assert the registration went, the module stayed"
      ansible.builtin.assert:
        that:
          - not (__testing_sysctl_modreg_dropped['stat']['exists'] | ansible.builtin.bool)
          - "'br_netfilter' in __testing_sysctl_modreg_lsmod['stdout']"
        fail_msg: >-
          Dropping the profile did not remove the fixed registration, or it
          unloaded the running module.
        success_msg: "Dropping the profiles removes the boot registration and leaves the running module loaded."

    # state absent must remove the fixed file regardless of the current
    # filename or profile list
    - name: "Molecule | Verify | sysctl modules | Registration: re-apply the profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_profile: ["container"]
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-second.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: run state absent with a different filename and no profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_state: "absent"
        sysctl_linux_profile: []
        sysctl_linux_parameters: {}
        sysctl_linux_config_dropin_file_name: "zz-third.conf"

    - name: "Molecule | Verify | sysctl modules | Registration: get information after state absent"
      ansible.builtin.stat:
        path: "/etc/modules-load.d/zz-managed.conf"
      register: __testing_sysctl_modreg_absent

    - name: "Molecule | Verify | sysctl modules | Registration: assert state absent removed the fixed file"
      ansible.builtin.assert:
        that:
          - not (__testing_sysctl_modreg_absent['stat']['exists'] | ansible.builtin.bool)
        fail_msg: "sysctl_linux_state absent left the fixed modules-load registration behind."
        success_msg: "state absent removes the fixed registration regardless of filename and profile list."

    ## Foreign file at the fixed path

    - name: "Molecule | Verify | sysctl modules | Registration: plant an unmarked file at the fixed path"
      ansible.builtin.copy:
        dest: "/etc/modules-load.d/zz-managed.conf"
        content: "some_admin_module\n"
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r"

    - name: "Molecule | Verify | sysctl modules | Registration: apply the profile over the foreign file (must fail)"
      block:

        - name: "Molecule | Verify | sysctl modules | Registration: include the role over the foreign file"
          ansible.builtin.include_role:
            name: "foundata.linux.sysctl"
          vars:
            sysctl_linux_profile: ["container"]
            sysctl_linux_parameters: {}
            sysctl_linux_config_dropin_file_name: "zz-second.conf"

        - name: "Molecule | Verify | sysctl modules | Registration: fail because the foreign file was accepted"
          ansible.builtin.fail:
            msg: "The role overwrote an unmarked file at the fixed modules-load path."

      rescue:

        - name: "Molecule | Verify | sysctl modules | Registration: assert the collision was refused"
          ansible.builtin.assert:
            that:
              - >-
                'does not carry this role' in
                (ansible_failed_result['msg'] | ansible.builtin.default(''))
            fail_msg: >-
              The run failed, but not in the ownership check:
              {{ ansible_failed_result['msg'] | ansible.builtin.default('(no message)') }}
            success_msg: "An unmarked file at the fixed path is refused, not overwritten."

    - name: "Molecule | Verify | sysctl modules | Registration: repeat the collision in check mode (must fail)"
      block:

        - name: "Molecule | Verify | sysctl modules | Registration: include the role in check mode over the foreign file"
          ansible.builtin.include_role:
            name: "foundata.linux.sysctl"
            apply:
              check_mode: true
          vars:
            sysctl_linux_profile: ["container"]
            sysctl_linux_parameters: {}
            sysctl_linux_config_dropin_file_name: "zz-second.conf"

        - name: "Molecule | Verify | sysctl modules | Registration: fail because check mode accepted the foreign file"
          ansible.builtin.fail:
            msg: "Check mode did not report the ownership collision."

      rescue:

        - name: "Molecule | Verify | sysctl modules | Registration: assert the check mode collision"
          ansible.builtin.assert:
            that:
              - >-
                'does not carry this role' in
                (ansible_failed_result['msg'] | ansible.builtin.default(''))
            fail_msg: >-
              The check mode run failed, but not in the ownership check:
              {{ ansible_failed_result['msg'] | ansible.builtin.default('(no message)') }}
            success_msg: "Check mode reports the ownership collision."

    - name: "Molecule | Verify | sysctl modules | Registration: run state absent over the foreign file"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_state: "absent"
        sysctl_linux_profile: []
        sysctl_linux_parameters: {}

    - name: "Molecule | Verify | sysctl modules | Registration: read the foreign file after the collision runs"
      ansible.builtin.slurp:
        src: "/etc/modules-load.d/zz-managed.conf"
      register: __testing_sysctl_modreg_foreign

    - name: "Molecule | Verify | sysctl modules | Registration: assert the foreign file survived unchanged"
      ansible.builtin.assert:
        that:
          - >-
            (__testing_sysctl_modreg_foreign['content'] | ansible.builtin.b64decode
             | ansible.builtin.trim) == 'some_admin_module'
        fail_msg: "A collision run modified or removed the unmarked file at the fixed path."
        success_msg: "Present, check mode and absent runs all preserve an unmarked file at the fixed path."

    - name: "Molecule | Verify | sysctl modules | Registration: read the historical per-module files"
      ansible.builtin.slurp:
        src: "/etc/modules-load.d/{{ item }}.conf"
      register: __testing_sysctl_modreg_legacy
      loop:
        - "br_netfilter"
        - "nf_conntrack"

    - name: "Molecule | Verify | sysctl modules | Registration: assert the historical files stayed untouched"
      ansible.builtin.assert:
        that:
          - (item['content'] | ansible.builtin.b64decode | ansible.builtin.trim) == item['item']
        fail_msg: "The role touched the historical per-module file {{ item['item'] }}.conf (ownership is unknowable)."
        success_msg: "Historical per-module files are never touched."
      loop: "{{ __testing_sysctl_modreg_legacy['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"

  always:

    - name: "Molecule | Verify | sysctl modules | Registration: remove the fixtures again"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop:
        - "/etc/modules-load.d/zz-managed.conf"
        - "/etc/modules-load.d/br_netfilter.conf"
        - "/etc/modules-load.d/nf_conntrack.conf"
        - "/etc/sysctl.d/zz-first.conf"
        - "/etc/sysctl.d/zz-second.conf"
        - "/etc/sysctl.d/zz-third.conf"


- name: "Molecule | Verify | sysctl modules | Registration: report a skipped check"
  ansible.builtin.debug:
    msg: >-
      The running kernel cannot load br_netfilter here, so the boot
      registration reconciliation cannot be observed on this platform.
  when:
    - not (__testing_sysctl_brnf_available | ansible.builtin.bool)
