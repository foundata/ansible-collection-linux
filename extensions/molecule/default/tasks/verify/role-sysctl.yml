# Check collection role "sysctl" outcomes.

- name: "Molecule | Verify | Initialize the foundata.linux.sysctl role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
    tasks_from: "init"
    public: true


## Preparation

- name: "Molecule | Verify | Set sysctl_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(sysctl_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | Set other expected or needed facts"
  # "__testing_" namespace on purpose: a fact named like the role's internal
  # __sysctl_linux_config_dropin_file_path would shadow the role's own (lazy)
  # computation in every later role include of this play.
  ansible.builtin.set_fact:
    __testing_sysctl_dropin_file_path: "{{ __sysctl_linux_config_dropin_dir_path }}/zz-custom-dropin.conf"


## Drop-in config file

- name: "Molecule | Verify | Check if sysctl drop-in configuration file exists"
  ansible.builtin.stat:
    path: "{{ __testing_sysctl_dropin_file_path }}"
  register: __testing_dropin_file


- name: "Molecule | Verify | Assert sysctl drop-in configuration file exists"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file['stat']['exists']
    fail_msg: "The sysctl drop-in configuration file '{{ __testing_sysctl_dropin_file_path }}' does not exist."
    success_msg: "The sysctl drop-in configuration file '{{ __testing_sysctl_dropin_file_path }}' exists."


- name: "Molecule | Verify | Check if default sysctl drop-in configuration file does exists (if custom filename is used)"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_dropin_file_path_default }}"
  when:
    - __testing_sysctl_dropin_file_path != __sysctl_linux_config_dropin_file_path_default
  register: __testing_dropin_file_default


- name: "Molecule | Verify | Assert default sysctl drop-in configuration file does not exists (if custom filename is used)"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file_default['stat']['exists'] is ansible.builtin.false
    fail_msg: >-
      The default sysctl drop-in configuration file '{{ __testing_sysctl_dropin_file_path }}' exists (even though a custom filename is used).
    success_msg: >-
      The default sysctl drop-in configuration file '{{ __testing_sysctl_dropin_file_path }}' does not exist (valid as custom filename is used).
  when:
    - __testing_sysctl_dropin_file_path != __sysctl_linux_config_dropin_file_path_default


- name: "Molecule | Verify | Check the legacy default drop-in file was removed"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_dropin_file_path_legacy }}"
  register: __testing_dropin_file_legacy
  failed_when:
    - __testing_dropin_file_legacy['stat']['exists']


- name: "Molecule | Verify | Read sysctl drop-in configuration file content"
  ansible.builtin.slurp:
    src: "{{ __testing_sysctl_dropin_file_path }}"
  register: __testing_dropin_content


- name: "Molecule | Verify | Assert sysctl drop-in configuration file contains expected parameters"
  vars:
    __testing_file_content: "{{ __testing_dropin_content['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      - "'ansible managed' in (__testing_file_content | ansible.builtin.lower)"
      - '__testing_file_content is regex("net\.ipv4\.tcp_syncookies\s*=\s*0")'
      - '__testing_file_content is regex("net\.ipv4\.tcp_timestamps\s*=\s*1")'
      - '__testing_file_content is regex("net\.core\.somaxconn\s*=\s*12288")'
    fail_msg: "The sysctl drop-in configuration file does not contain the expected parameters."
    success_msg: "The sysctl drop-in configuration file contains all expected parameters."


- name: "Molecule | Verify | Assert an orphaned (unmanaged) parameter was removed from the drop-in"
  vars:
    __testing_file_content: "{{ __testing_dropin_content['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # Seeded by 'prepare' but not in the managed set: existing-parameter parsing
      # must detect it (requires splitlines()) and the removal must drop it.
      - '__testing_file_content is not regex("net\.ipv4\.tcp_rfc1337")'
    fail_msg: "The orphaned parameter net.ipv4.tcp_rfc1337 was not removed from the drop-in; orphan detection is not working."
    success_msg: "The orphaned parameter net.ipv4.tcp_rfc1337 was removed from the drop-in."


## Main configuration

- name: "Molecule | Verify | Check sysctl main configuration file exists (created by 'prepare' molecule stage)"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_file_path }}"
  register: __testing_config_file


- name: "Molecule | Verify | Assert sysctl main configuration file exists (created by 'prepare' molecule stage)"
  ansible.builtin.assert:
    that:
      - __testing_config_file['stat']['exists']
    fail_msg: "The sysctl main configuration file '{{ __sysctl_linux_config_file_path }}' does not exist."
    success_msg: "The sysctl main configuration file '{{ __sysctl_linux_config_file_path }}' exists."


- name: "Molecule | Verify | Read sysctl main configuration file content"
  ansible.builtin.slurp:
    src: "{{ __sysctl_linux_config_file_path }}"
  register: __testing_main_config_content
  when:
    - __testing_config_file['stat']['exists']


- name: "Molecule | Verify | Assert only managed parameters are commented out in sysctl main configuration file (to ensure precedence)"
  vars:
    __testing_file_content: "{{ __testing_main_config_content['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # (?m) enables multiline mode so ^ matches start of each line, not just start of string
      # Unmanaged parameter: must exist as uncommented line (role should not touch it)
      - '__testing_file_content is regex("(?m)^net\.ipv4\.tcp_mtu_probing\s*=")'
      # Managed parameters: must be commented out (no uncommented line) AND a line
      # disabled with the role's restore marker must exist (proving the role
      # commented them out, recoverably, not that they were never there).
      - '__testing_file_content is not regex("(?m)^net\.ipv4\.tcp_syncookies\s*=")'
      - '__testing_file_content is regex("(?m)^#ANSIBLE_DISABLED\s+net\.ipv4\.tcp_syncookies\s*=")'
      - '__testing_file_content is not regex("(?m)^net\.ipv4\.tcp_timestamps\s*=")'
      - '__testing_file_content is regex("(?m)^#ANSIBLE_DISABLED\s+net\.ipv4\.tcp_timestamps\s*=")'
      # Profile-derived parameter (managed by the "web" profile, not present in
      # sysctl_linux_parameters): must also be commented out so the drop-in wins.
      - '__testing_file_content is not regex("(?m)^net\.ipv4\.tcp_fin_timeout\s*=")'
      - '__testing_file_content is regex("(?m)^#ANSIBLE_DISABLED\s+net\.ipv4\.tcp_fin_timeout\s*=")'
      # Previously role-disabled key that is NOT managed in this run: must be
      # restored (marker stripped, line uncommented again).
      - '__testing_file_content is regex("(?m)^net\.ipv4\.tcp_keepalive_time\s*=")'
      - '__testing_file_content is not regex("(?m)^#ANSIBLE_DISABLED\s+net\.ipv4\.tcp_keepalive_time")'
    fail_msg: "Managed parameters not properly commented out or unmanaged parameter was modified in '{{ __sysctl_linux_config_file_path }}'."
    success_msg: "All managed parameters are commented out and unmanaged parameters remain untouched in '{{ __sysctl_linux_config_file_path }}'."
  when:
    - __testing_config_file['stat']['exists']


# The molecule instances are virtual machines, so the applied values can be
# asserted against the real kernel on every platform (containers would have to
# skip this because of read-only system parameters).
- name: "Molecule | Verify | Verify kernel parameters"
  block:

    - name: "Molecule | Verify | Get active kernel parameter values "
      ansible.builtin.command:
        argv:
          - "{{ __sysctl_linux_sysctl_executable }}"
          - "--values"
          - "{{ item }}"
      loop:
        - "net.ipv4.tcp_syncookies"
        - "net.ipv4.tcp_timestamps"
        - "net.core.somaxconn"
      register: __testing_active_params
      changed_when:
        - false

    - name: "Molecule | Verify | Assert active kernel parameters have expected values"
      ansible.builtin.assert:
        that:
          - __testing_active_params['results'][0]['stdout'] == "0"
          - __testing_active_params['results'][1]['stdout'] == "1"
          - __testing_active_params['results'][2]['stdout'] == "12288"
        fail_msg: "Active kernel parameters do not match expected values."
        success_msg: "All active kernel parameters have the expected values."


## Regression tests: init-only merged variable evaluation
#
# Re-run the role's init with custom parameters and no profile selected, then
# assert the merged __sysctl_linux_effective_parameters directly. This guards
# the profile/user merge (whether materialized in tasks/init.yml or
# lazily in vars/main.yml): with no profile, __sysctl_linux_profile_parameters
# is undefined, so the expression must resolve via its default({}) guard and
# the user parameters must flow through unchanged.
#
# Inputs are set via set_fact so they outrank the converge-time facts restored
# at the top of this file and stay in scope when the assertion dereferences the
# (lazily evaluated) effective variable.

- name: "Molecule | Verify | Validate effective sysctl parameters merge (init-only)"
  block:

    - name: "Molecule | Verify | Set custom parameters and clear the profile for the merge check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: []
        sysctl_linux_parameters:
          net.ipv4.ip_forward: "1"
          vm.swappiness: "10"


    - name: "Molecule | Verify | Re-initialize sysctl with custom parameters"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert effective sysctl parameters merged correctly"
      ansible.builtin.assert:
        that:
          - __sysctl_linux_effective_parameters is ansible.builtin.mapping
          - __sysctl_linux_effective_parameters['net.ipv4.ip_forward'] == "1"
          - __sysctl_linux_effective_parameters['vm.swappiness'] == "10"
        fail_msg: "__sysctl_linux_effective_parameters did not merge profile and user parameters as expected."
        success_msg: "__sysctl_linux_effective_parameters merged profile and user parameters correctly."


## Regression tests: profile loading and resource auto-calculation
#
# Re-run the role's init with a profile selected (no user parameters) and assert
# the resulting __sysctl_linux_effective_parameters directly: static keys, the
# required kernel module list, and the RAM-derived auto-calculated values. This
# is init-only (nothing is applied to the kernel), so it is safe in containers.

- name: "Molecule | Verify | Validate web profile (init-only, incl. auto-calculation)"
  block:

    - name: "Molecule | Verify | Select the web profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "web"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the web profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert web profile parameters and auto-calculation"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.core.somaxconn'] | ansible.builtin.int) == 65535
          - (__sysctl_linux_effective_parameters['fs.nr_open'] | ansible.builtin.int) == 2097152
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_tw_reuse'] | ansible.builtin.int) == 2
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_local_port_range']) == "16384 65535"
          # security baseline moved to hardening-default; conntrack/rp_filter not managed; no modules.
          - "'net.ipv4.tcp_syncookies' not in __sysctl_linux_effective_parameters"
          - "'fs.protected_symlinks' not in __sysctl_linux_effective_parameters"
          - "'net.netfilter.nf_conntrack_max' not in __sysctl_linux_effective_parameters"
          - "'net.ipv4.conf.all.rp_filter' not in __sysctl_linux_effective_parameters"
          - (__sysctl_linux_profile_modules | ansible.builtin.length) == 0
          - (__sysctl_linux_effective_parameters['fs.file-max'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 100, 100000] | ansible.builtin.max)
          - (__sysctl_linux_effective_parameters['net.core.rmem_max'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 128, 16777216] | ansible.builtin.min)
        fail_msg: "web profile did not load or auto-calculate as expected."
        success_msg: "web profile loaded and auto-calculated correctly."


- name: "Molecule | Verify | Validate database engine profiles (init-only, incl. byte-based write-back)"
  block:

    - name: "Molecule | Verify | Select the redis profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "redis"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the redis profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert redis profile (shared DB tuning + redis specifics, no legacy shm/oom)"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['vm.swappiness'] | ansible.builtin.int) == 10
          - (__sysctl_linux_effective_parameters['vm.overcommit_memory'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.core.somaxconn'] | ansible.builtin.int) == 65535
          # byte-based write-back replaces the dirty ratios
          - (__sysctl_linux_effective_parameters['vm.dirty_background_bytes'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 20, 1073741824] | ansible.builtin.min)
          - (__sysctl_linux_effective_parameters['vm.dirty_bytes'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 10, 4294967296] | ansible.builtin.min)
          # removed legacy/questionable keys and rp_filter are not managed
          - "'vm.dirty_ratio' not in __sysctl_linux_effective_parameters"
          - "'kernel.shmmax' not in __sysctl_linux_effective_parameters"
          - "'vm.oom_kill_allocating_task' not in __sysctl_linux_effective_parameters"
          - "'net.ipv4.conf.all.rp_filter' not in __sysctl_linux_effective_parameters"
        fail_msg: "redis profile did not load as expected."
        success_msg: "redis profile loaded correctly (shared tuning + byte-based write-back)."


    - name: "Molecule | Verify | Select the elasticsearch profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "elasticsearch"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the elasticsearch profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert elasticsearch profile sets the mandatory max_map_count"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['vm.max_map_count'] | ansible.builtin.int) == 262144
          - (__sysctl_linux_effective_parameters['fs.nr_open'] | ansible.builtin.int) == 2097152
        fail_msg: "elasticsearch profile did not load as expected."
        success_msg: "elasticsearch profile loaded correctly (vm.max_map_count set)."


- name: "Molecule | Verify | Validate file profile (init-only, incl. auto-calculation)"
  block:

    - name: "Molecule | Verify | Select the file profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "file"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the file profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert file profile parameters and auto-calculation"
      vars:
        __testing_bufmax: "{{ [(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 128, 16777216] | ansible.builtin.min }}"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['fs.inotify.max_user_watches'] | ansible.builtin.int) == 524288
          - (__sysctl_linux_effective_parameters['vm.vfs_cache_pressure'] | ansible.builtin.int) == 50
          - (__sysctl_linux_effective_parameters['net.core.rmem_max'] | ansible.builtin.int) ==
            (__testing_bufmax | ansible.builtin.int)
          # only the autotuning max is raised; the per-socket default is left alone
          - __sysctl_linux_effective_parameters['net.ipv4.tcp_rmem'] ==
            ('4096 131072 ' ~ __testing_bufmax)
          - "'net.core.rmem_default' not in __sysctl_linux_effective_parameters"
          # default-on TCP flags are no longer asserted (unmanaged)
          - "'net.ipv4.tcp_window_scaling' not in __sysctl_linux_effective_parameters"
        fail_msg: "file profile did not load or auto-calculate as expected."
        success_msg: "file profile loaded and auto-calculated correctly."


- name: "Molecule | Verify | Validate virtualization profile (init-only)"
  block:

    - name: "Molecule | Verify | Select the virtualization profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "virtualization"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the virtualization profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert virtualization profile parameters (no bridge/scheduler/module coupling)"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['vm.overcommit_memory'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['vm.dirty_bytes'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 10, 4294967296] | ansible.builtin.min)
          # bridge filtering, the scheduler knob, rp_filter and modules are intentionally not managed
          - "'net.bridge.bridge-nf-call-iptables' not in __sysctl_linux_effective_parameters"
          - "'kernel.sched_migration_cost_ns' not in __sysctl_linux_effective_parameters"
          - "'net.ipv4.conf.all.rp_filter' not in __sysctl_linux_effective_parameters"
          - (__sysctl_linux_profile_modules | ansible.builtin.length) == 0
        fail_msg: "virtualization profile did not load as expected."
        success_msg: "virtualization profile loaded correctly (no bridge/scheduler/module coupling)."


- name: "Molecule | Verify | Validate router profiles (init-only, incl. forwarding direction)"
  block:

    - name: "Molecule | Verify | Select the router profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "router"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the router profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert router profile forwarding, conntrack and rp_filter"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.rp_filter'] | ansible.builtin.int) == 2
          - "'nf_conntrack' in __sysctl_linux_profile_modules"
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_max'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 32)
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_buckets'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 8)
        fail_msg: "router profile did not load or auto-calculate as expected."
        success_msg: "router profile loaded and auto-calculated correctly."


    - name: "Molecule | Verify | Select the router_v4only profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "router_v4only"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the router_v4only profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert router_v4only enables IPv4 and disables IPv6 forwarding"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.default.forwarding'] | ansible.builtin.int) == 0
        fail_msg: "router_v4only forwarding direction is wrong."
        success_msg: "router_v4only forwarding direction is correct."


    - name: "Molecule | Verify | Select the router_v6only profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "router_v6only"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the router_v6only profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert router_v6only enables IPv6 and disables IPv4 forwarding"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.forwarding'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.default.forwarding'] | ansible.builtin.int) == 0
        fail_msg: "router_v6only forwarding direction is wrong."
        success_msg: "router_v6only forwarding direction is correct."


- name: "Molecule | Verify | Validate container profile (init-only, incl. auto-calculation and modules)"
  block:

    - name: "Molecule | Verify | Select the container profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "container"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the container profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert container profile forwarding, bridge netfilter, conntrack and quotas"
      ansible.builtin.assert:
        that:
          # forwarding (IPv4 + IPv6) and bridge netfilter
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.bridge.bridge-nf-call-iptables'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.bridge.bridge-nf-call-ip6tables'] | ansible.builtin.int) == 1
          # loose reverse-path filtering (functional key, not part of hardening-default)
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.rp_filter'] | ansible.builtin.int) == 2
          # conntrack sizing (auto-calculated, same formulas as the router profile)
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_max'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 32)
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_buckets'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 8)
          # per-UID inotify and kernel keyring quotas for many containers
          - (__sysctl_linux_effective_parameters['fs.inotify.max_user_watches'] | ansible.builtin.int) == 524288
          - (__sysctl_linux_effective_parameters['fs.inotify.max_user_instances'] | ansible.builtin.int) == 1024
          - (__sysctl_linux_effective_parameters['kernel.keys.maxkeys'] | ansible.builtin.int) == 2000
          - (__sysctl_linux_effective_parameters['kernel.keys.maxbytes'] | ansible.builtin.int) == 2000000
          # required kernel modules
          - "'nf_conntrack' in __sysctl_linux_profile_modules"
          - "'br_netfilter' in __sysctl_linux_profile_modules"
          - (__sysctl_linux_profile_modules | ansible.builtin.length) == 2
          # workload tuning is intentionally not managed (stack a workload profile instead)
          - "'net.core.somaxconn' not in __sysctl_linux_effective_parameters"
        fail_msg: "container profile did not load or auto-calculate as expected."
        success_msg: "container profile loaded and auto-calculated correctly."


- name: "Molecule | Verify | Validate stacked profiles (init-only: order, last-wins, module union)"
  block:

    - name: "Molecule | Verify | Select a stacked profile list for the stacking check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "router_v4only"
          - "router_v6only"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the stacked profile list"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert later profile wins on conflicts and modules are unioned"
      ansible.builtin.assert:
        that:
          # router_v4only sets ip_forward=1 / ipv6 forwarding=0; router_v6only (later) flips both.
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 1
          # Both variants require nf_conntrack; the union deduplicates to a single entry.
          - "'nf_conntrack' in __sysctl_linux_profile_modules"
          - (__sysctl_linux_profile_modules | ansible.builtin.length) == 1
        fail_msg: "Stacked profiles did not apply in order / union modules as expected."
        success_msg: "Stacked profiles apply in order (last wins) and union their modules."


- name: "Molecule | Verify | Validate hardening-extra profile, stacked on a workload (init-only)"
  block:

    - name: "Molecule | Verify | Select a workload + hardening-extra stack for the check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "web"
          - "hardening-extra"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the web + hardening-extra stack"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert hardening-extra keys compose with the workload profile"
      ansible.builtin.assert:
        that:
          # hardening-extra keys present
          - (__sysctl_linux_effective_parameters['kernel.kptr_restrict'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['kernel.dmesg_restrict'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['vm.mmap_min_addr'] | ansible.builtin.int) == 65536
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_rfc1337'] | ansible.builtin.int) == 1
          # web keys still present (stack composed, not replaced)
          - (__sysctl_linux_effective_parameters['net.core.somaxconn'] | ansible.builtin.int) == 65535
          # aggressive opt-in keys are NOT shipped by the profile
          - "'kernel.yama.ptrace_scope' not in __sysctl_linux_effective_parameters"
          - "'kernel.unprivileged_bpf_disabled' not in __sysctl_linux_effective_parameters"
        fail_msg: "hardening-extra profile did not compose with the workload profile as expected."
        success_msg: "hardening-extra profile composes with the workload profile (safe subset only)."


- name: "Molecule | Verify | Validate hardening-default profile and its composition with a workload (init-only)"
  block:

    - name: "Molecule | Verify | Select hardening-default alone for the check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "hardening-default"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with hardening-default only"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert hardening-default sets the shared hardening keys (and not rp_filter)"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_syncookies'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['kernel.randomize_va_space'] | ansible.builtin.int) == 2
          - (__sysctl_linux_effective_parameters['fs.protected_symlinks'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.accept_redirects'] | ansible.builtin.int) == 0
          - "'net.ipv4.conf.all.rp_filter' not in __sysctl_linux_effective_parameters"
        fail_msg: "hardening-default did not load the expected hardening keys."
        success_msg: "hardening-default loaded the shared hardening keys (rp_filter excluded)."


    - name: "Molecule | Verify | Select hardening-default stacked before a workload"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "hardening-default"
          - "web"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with hardening-default + web"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert security baseline and workload tuning compose"
      ansible.builtin.assert:
        that:
          # hardening-default hardening key
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_syncookies'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['fs.suid_dumpable'] | ansible.builtin.int) == 0
          # web performance key
          - (__sysctl_linux_effective_parameters['net.core.somaxconn'] | ansible.builtin.int) == 65535
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_tw_reuse'] | ansible.builtin.int) == 2
        fail_msg: "hardening-default + web did not compose security and performance keys."
        success_msg: "hardening-default + web compose security and performance keys."


# IPv6-disabled robustness: when /proc/sys/net/ipv6 is absent the role must drop
# net.ipv6.* keys so it does not fail on IPv6-disabled hosts. The molecule
# container has IPv6, so the fact is overridden AFTER init (the effective
# variable is evaluated lazily and re-reads __sysctl_linux_ipv6_available).
- name: "Molecule | Verify | Validate net.ipv6.* are dropped when IPv6 is unavailable (init-only)"
  block:

    - name: "Molecule | Verify | Select hardening-default for the IPv6-unavailable check"
      ansible.builtin.set_fact:
        sysctl_linux_profile:
          - "hardening-default"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl (hardening-default) for the IPv6 check"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Force IPv6 unavailable (overrides the init detection)"
      ansible.builtin.set_fact:
        __sysctl_linux_ipv6_available: false


    - name: "Molecule | Verify | Assert net.ipv6.* dropped while net.ipv4.* and others remain"
      ansible.builtin.assert:
        that:
          - "'net.ipv6.conf.all.accept_redirects' not in __sysctl_linux_effective_parameters"
          - "'net.ipv6.conf.default.accept_source_route' not in __sysctl_linux_effective_parameters"
          # non-IPv6 keys must be untouched
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_syncookies'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['kernel.randomize_va_space'] | ansible.builtin.int) == 2
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.accept_redirects'] | ansible.builtin.int) == 0
        fail_msg: "net.ipv6.* keys were not dropped (or non-IPv6 keys were lost) when IPv6 is unavailable."
        success_msg: "net.ipv6.* keys are dropped when IPv6 is unavailable; non-IPv6 keys retained."


## Container profile: full apply against the real kernel
#
# The earlier container-profile check is init-only (merged variables). The
# molecule instances are virtual machines, so the module-dependent keys can
# additionally be applied and asserted live: br_netfilter and nf_conntrack
# get loaded and the net.bridge.* / net.netfilter.* keys have to reach the
# kernel - exactly the part a container-based test backend could never cover.

- name: "Molecule | Verify | Container profile apply: run the role with the container profile"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
  vars:
    sysctl_linux_profile:
      - "container"
    sysctl_linux_parameters: {}
    sysctl_linux_config_dropin_file_name: "zz-custom-dropin.conf"


- name: "Molecule | Verify | Container profile apply: read the live kernel values"
  ansible.builtin.command:
    argv:
      - "sysctl"
      - "-n"
      - "net.ipv4.ip_forward"
      - "net.bridge.bridge-nf-call-iptables"
      - "net.bridge.bridge-nf-call-ip6tables"
      - "net.netfilter.nf_conntrack_max"
  register: __testing_container_apply_values
  changed_when: false


- name: "Molecule | Verify | Container profile apply: assert the module-dependent keys reached the kernel"
  ansible.builtin.assert:
    that:
      - __testing_container_apply_values['stdout_lines'][0] == '1'
      - __testing_container_apply_values['stdout_lines'][1] == '1'
      - __testing_container_apply_values['stdout_lines'][2] == '1'
      - (__testing_container_apply_values['stdout_lines'][3] | ansible.builtin.int)
        == ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 32)
    fail_msg: >-
      The container profile did not reach the live kernel (values:
      {{ __testing_container_apply_values['stdout_lines'] }}). br_netfilter or
      nf_conntrack were not loaded, or the sysctl apply was skipped.
    success_msg: >-
      The container profile loaded br_netfilter and nf_conntrack and applied
      the module-dependent keys to the live kernel.


# Runs LAST: state=absent mutates the host (removes the drop-in, restores the
# main config). It verifies that uninstall restores exactly the lines the role
# disabled (marker stripped) and leaves user-commented and unmanaged lines alone.
- name: "Molecule | Verify | Validate state=absent restores the main config lines the role disabled"
  block:

    - name: "Molecule | Verify | Run the role with state=absent (uninstall)"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
      vars:
        sysctl_linux_state: "absent"
        sysctl_linux_reload: false


    - name: "Molecule | Verify | Re-read the main config file after uninstall"
      ansible.builtin.slurp:
        src: "{{ __sysctl_linux_config_file_path }}"
      register: __testing_main_after_uninstall


    - name: "Molecule | Verify | Check the managed drop-in file was removed"
      ansible.builtin.stat:
        path: "{{ __testing_sysctl_dropin_file_path }}"
      register: __testing_dropin_after_uninstall


    - name: "Molecule | Verify | Assert role-disabled lines restored, others untouched, drop-in gone"
      vars:
        __testing_after: "{{ __testing_main_after_uninstall['content'] | ansible.builtin.b64decode }}"
      ansible.builtin.assert:
        that:
          # the restore marker is fully gone
          - '__testing_after is not regex("ANSIBLE_DISABLED")'
          # previously role-disabled lines are restored (now uncommented again)
          - '__testing_after is regex("(?m)^net\.ipv4\.tcp_syncookies\s*=")'
          - '__testing_after is regex("(?m)^net\.ipv4\.tcp_timestamps\s*=")'
          - '__testing_after is regex("(?m)^net\.ipv4\.tcp_fin_timeout\s*=")'
          # the unmanaged line was never touched
          - '__testing_after is regex("(?m)^net\.ipv4\.tcp_mtu_probing\s*=")'
          # the managed drop-in file is removed
          - not (__testing_dropin_after_uninstall['stat']['exists'] | ansible.builtin.default(false))
        fail_msg: "state=absent did not restore the disabled main-config lines or remove the drop-in."
        success_msg: "state=absent restored the role-disabled main-config lines and removed the drop-in."
