# Execute the collection role "sysctl" against all driver-created instances.
#
# The molecule instances are virtual machines, so the role applies the values
# to a real kernel (live `sysctl -w` included) and the verify stage asserts
# them; nothing needs to be skipped or opted out.

- name: "Molecule | Converge | Store sysctl_linux_* role parameters in __testing_state"
  ansible.builtin.include_tasks:
    file: "../tasks/state_update.yml"
  vars:
    __testing_state_update:
      # sysctl_linux_verify is intentionally NOT set here: on the VM instances
      # the role's defaults apply and verify the live values (on containers it
      # would auto-disable live `sysctl -w` itself, "container-aware").
      # A stacked profile list is selected so converge exercises the real stack:
      # hardening-default (shared hardening) + web (performance). This also checks
      # that profile-derived keys duplicated in the main config file (e.g.
      # net.ipv4.tcp_fin_timeout from web, seeded by the prepare stage) are
      # commented out, and that the explicit sysctl_linux_parameters below still
      # take precedence over the profiles (e.g. tcp_syncookies overrides the
      # hardening-default value).
      sysctl_linux_profile:
        - "hardening-default"
        - "web"
      sysctl_linux_parameters:
        "net.ipv4.tcp_syncookies": 0
        "net.ipv4.tcp_timestamps": 1
        "net.core.somaxconn": 12288
      sysctl_linux_config_dropin_file_name: "zz-custom-dropin.conf"


- name: "Molecule | Converge | Set sysctl_linux_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^sysctl_linux_')
      | ansible.builtin.list
    }}

- name: "Molecule | Converge | Include the foundata.linux.sysctl role"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
  # vars: All sysctl_linux_* variables are set as facts and passed this way to
  #       the role. This enables persisting the values in __testing_state
  #       and restoring them in later stages (e.g. verify) without manually
  #       duplicating data across playbooks.
