# Configuration: Manage sysctl kernel parameters.
#
# This file contains the core logic for setting sysctl parameters using
# the ansible.posix.sysctl module.

---

- name: "Config | Default | Ensure drop-in config directory exists with proper permissions"
  ansible.builtin.file:
    path: "{{ __sysctl_linux_config_dropin_dir_path }}"
    state: "directory"
    owner: "{{ __sysctl_linux_config_dropin_dir_owner }}"
    group: "{{ __sysctl_linux_config_dropin_dir_group }}"
    mode: "{{ __sysctl_linux_config_dropin_dir_mode }}"


- name: "Config | Default | Ensure drop-in config file exists with proper permissions"
  ansible.builtin.file:
    path: "{{ __sysctl_linux_config_dropin_file_path }}"
    state: "touch"
    owner: "{{ __sysctl_linux_config_dropin_file_owner }}"
    group: "{{ __sysctl_linux_config_dropin_file_group }}"
    mode: "{{ __sysctl_linux_config_dropin_file_mode }}"
    access_time: "preserve"
    modification_time: "preserve"


- name: "Config | Default | Remove the role's default drop-in config file (if custom filename is used)"
  ansible.builtin.file:
    path: "{{ __sysctl_linux_config_dropin_file_path_default }}"
    state: "absent"
  when:
    - __sysctl_linux_config_dropin_file_path != __sysctl_linux_config_dropin_file_path_default
  notify:
    - "sysctl_linux: reload"


- name: "Config | Default | Remove the legacy default drop-in config file of earlier role versions"
  ansible.builtin.file:
    path: "{{ __sysctl_linux_config_dropin_file_path_legacy }}"
    state: "absent"
  when:
    - __sysctl_linux_config_dropin_file_path != __sysctl_linux_config_dropin_file_path_legacy
  notify:
    - "sysctl_linux: reload"


# No Jinja template file but ansible.posix.sysctl is used below, so {{ ansible_managed }}
# cannot be applied. The header is therefore managed explicitly by a task.
- name: "Config | Default | Ensure 'Ansible managed' header in sysctl drop-in config file"
  ansible.builtin.lineinfile:
    path: "{{ __sysctl_linux_config_dropin_file_path }}"
    regexp: '(?i)^#\s+ansible\s+managed'
    line: "# Ansible managed"
    insertbefore: "BOF"
    state: "present"


- name: "Config | Default | Read current sysctl drop-in file"
  ansible.builtin.slurp:
    src: "{{ __sysctl_linux_config_dropin_file_path }}"
  register: __sysctl_linux_dropin_file_content
  failed_when: false


- name: "Config | Default | Parse existing parameters from drop-in file"
  ansible.builtin.set_fact:
    # splitlines() (not split('\n')): inside this block scalar Jinja treats '\n'
    # as the two literal characters, so split('\n') never splits the real
    # newlines and the parse would always yield an empty list (dead orphan
    # detection). map('trim') then normalizes keys: a hand-indented line
    # ("  net.x = 1") would otherwise yield a key with leading whitespace that
    # never matches the effective set, so it would be misdetected as an orphan
    # and the removal (which strips the name) would delete the managed
    # parameter, breaking idempotence.
    __sysctl_linux_existing_parameters: >-
      {{
        (__sysctl_linux_dropin_file_content['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
        .splitlines()
        | ansible.builtin.reject('ansible.builtin.match', '^\s*#')
        | ansible.builtin.reject('ansible.builtin.match', '^\s*$')
        | ansible.builtin.map('ansible.builtin.regex_replace', '\s*=\s*', '=')
        | ansible.builtin.map('ansible.builtin.regex_search', '^([^=]+)=')
        | ansible.builtin.select('ansible.builtin.string')
        | ansible.builtin.map('ansible.builtin.regex_replace', '=$', '')
        | ansible.builtin.map('ansible.builtin.trim')
        | ansible.builtin.list
      }}


- name: "Config | Default | Set sysctl drop-in parameters"
  ansible.posix.sysctl:
    name: "{{ __sysctl_linux_parameter_item['key'] }}"
    value: "{{ __sysctl_linux_parameter_item['value'] }}"
    state: "present"
    sysctl_file: "{{ __sysctl_linux_config_dropin_file_path }}"
    # Verify and apply the value live with `sysctl -w` (fails if the parameter is
    # invalid or read-only), except on detected containers, where kernel
    # parameters are typically read-only: there we only write the drop-in file so
    # the role does not fail before the (container-tolerant) reload handler runs.
    # sysctl_linux_verify still gates this on real hosts.
    sysctl_set: "{{ (sysctl_linux_verify | ansible.builtin.bool) and (not __sysctl_linux_is_container) }}"
    # reloading will be done by handler, following precedence
    reload: false
    ignoreerrors: "{{ sysctl_linux_ignore_unknown_key_errors | ansible.builtin.default(omit) }}"
  loop: "{{ __sysctl_linux_effective_parameters | ansible.builtin.dict2items }}"
  loop_control:
    loop_var: "__sysctl_linux_parameter_item"
    # human-friendly output like "item=net.ipv4.ip_forward=1"
    label: "{{ __sysctl_linux_parameter_item['key'] }}={{ __sysctl_linux_parameter_item['value'] }}"
  when:
    - __sysctl_linux_effective_parameters | ansible.builtin.length > 0
    # none (Python / Ansible) == null (YAML)
    - __sysctl_linux_parameter_item['value'] is not ansible.builtin.none
    - __sysctl_linux_parameter_item['value'] | ansible.builtin.string | ansible.builtin.length > 0
  notify:
    - "sysctl_linux: reload"


- name: "Config | Default | Build list of sysctl drop-in parameters to remove from config"
  ansible.builtin.set_fact:
    # Combines orphaned parameters (in file but not in effective params) with
    # explicit removals (value is null or empty string, e.g. to override profiles)
    __sysctl_linux_parameters_remove: >-
      {{
        (
          __sysctl_linux_existing_parameters
          | ansible.builtin.difference(__sysctl_linux_effective_parameters.keys() | ansible.builtin.list)
        ) + (
          __sysctl_linux_effective_parameters
          | ansible.builtin.dict2items
          | ansible.builtin.selectattr('value', 'ansible.builtin.in', [none, ''])
          | ansible.builtin.map(attribute='key')
          | ansible.builtin.list
        )
        | ansible.builtin.unique
      }}


- name: "Config | Default | Remove sysctl drop-in parameters marked for deletion from config"
  ansible.posix.sysctl:
    name: "{{ __sysctl_linux_removal_parameter_item }}"
    state: "absent"
    sysctl_file: "{{ __sysctl_linux_config_dropin_file_path }}"
    # reloading will be done by handler, following precedence
    reload: false
    ignoreerrors: "{{ sysctl_linux_ignore_unknown_key_errors | ansible.builtin.default(omit) }}"
  loop: "{{ __sysctl_linux_parameters_remove }}"
  loop_control:
    loop_var: "__sysctl_linux_removal_parameter_item"
    # human-friendly output like "item=net.ipv4.ip_forward (remove)"
    label: "{{ __sysctl_linux_removal_parameter_item }} (remove)"
  when:
    - __sysctl_linux_parameters_remove | ansible.builtin.length > 0
  notify:
    - "sysctl_linux: reload"


- name: "Config | Default | Check if main config file exists"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_file_path }}"
  register: __sysctl_linux_config_file_stat


- name: "Config | Default | Build list of sysctl drop-in parameters that should take precedence"
  ansible.builtin.set_fact:
    # Every key the role writes to the drop-in must be commented out in the main
    # config file as /etc/sysctl.conf is applied last by "sysctl --system"
    # (after /etc/sysctl.d/*.conf, regardless of the drop-in's numeric prefix),
    # so an uncommented duplicate there would otherwise override the managed
    # value, including profile-derived ones. The null/'' filter below keeps keys
    # we intentionally unmanage untouched.
    __sysctl_linux_parameters_comment: >-
      {{
        __sysctl_linux_effective_parameters
        | ansible.builtin.dict2items
        | ansible.builtin.selectattr('value', 'ansible.builtin.ne', none)
        | ansible.builtin.rejectattr('value', 'ansible.builtin.equalto', '')
        | ansible.builtin.map(attribute='key')
        | ansible.builtin.map('ansible.builtin.regex_escape')
        | ansible.builtin.list
      }}
  when:
    - __sysctl_linux_config_file_stat['stat']['exists'] | ansible.builtin.default(false)


# Remember: It is possible to overwrite values, last occurrence wins.
- name: "Config | Default | Comment out duplicates in main config file (if any) to ensure drop-in config precedence"
  ansible.builtin.replace:
    path: "{{ __sysctl_linux_config_file_path }}"
    # Notes on the regex:
    # - ({{ __sysctl_linux_parameters_comment | ansible.builtin.join('|') }}) will result in something like
    #   vm\.swappiness|net\.ipv4\.ip_forward (escaping is done )
    # - When options are joined with '|', an empty (whitespace-only) option would
    #   produce patterns like 'foo||bar', where '||' matches an empty string at any
    #   position. The 'select' filter prevents this.
    # - (?=\s*(?:=|\s|$)) is a safeguard to prevent partial-key matches (e.g.,
    #   'net.ipv4.foo' accidentally matching 'net.ipv4.foobar_baz').
    #   The expression is compatible with the obvious
    #     net.ipv4.foo=5
    #     net.ipv4.foo = 5
    #   and non-obvious
    #     net.ipv4.foo
    #   syntax (without value is valid and means "set to kernel default" or "query
    #   value", depending on context).
    # The comment marker (__sysctl_linux_main_disabled_marker) is prepended so the
    # uninstall path can restore exactly these lines later. The regexp's
    # (?![\t ]*#) negative lookahead also keeps this idempotent: an already-marked
    # line starts with '#' and is not matched again.
    regexp: >-
      ^(?![\t ]*#)([\t ]*)({{ __sysctl_linux_parameters_comment | ansible.builtin.select | ansible.builtin.join('|') }})(?=\s*(?:=|\s|$))(.*)
    replace: "{{ __sysctl_linux_main_disabled_marker }}\\1\\2\\3"
  when:
    - __sysctl_linux_config_file_stat['stat']['exists'] | ansible.builtin.default(false)
    - __sysctl_linux_parameters_comment | ansible.builtin.length > 0
  notify:
    - "sysctl_linux: reload"


# Counterpart to the comment-out above: a key the role used to manage (and thus
# disabled in the main config file) but no longer manages must get its original
# main-file value back, otherwise it stays disabled forever. Strip the marker
# only from lines whose key is NOT in the current managed set; managed keys keep
# the marker so the drop-in still wins. The negative lookahead makes this
# idempotent (managed lines are not matched, already-restored lines no longer
# start with the marker). An empty managed set restores all marked lines.
- name: "Config | Default | Restore main config lines disabled for keys the role no longer manages"
  ansible.builtin.replace:
    path: "{{ __sysctl_linux_config_file_path }}"
    regexp: >-
      ^{{ __sysctl_linux_main_disabled_marker }}(?![\t ]*(?:{{ __sysctl_linux_main_managed_keys_pattern }})(?=\s*(?:=|\s|$)))(.*)$
    replace: '\1'
  vars:
    __sysctl_linux_main_managed_keys_pattern: >-
      {{
        __sysctl_linux_parameters_comment
        | ansible.builtin.default([])
        | ansible.builtin.select
        | ansible.builtin.join('|')
      }}
  when:
    - __sysctl_linux_config_file_stat['stat']['exists'] | ansible.builtin.default(false)
  notify:
    - "sysctl_linux: reload"


### Boot-time loading of the kernel modules the selected profiles depend on
#
# init.yml loads them for the running system; without a persistent entry the
# module-gated parameters would silently disappear after a reboot. The role
# owns exactly one file with a fixed private name (see vars/main.yml) and
# rewrites it from the currently required modules, so changing or dropping a
# profile also reverts the boot behavior. Runtime modules are never unloaded:
# something else may rely on them by now, and unloading can disrupt a running
# system.

- name: "Config | Default | Read the managed modules-load drop-in file (if any)"
  ansible.builtin.slurp:
    src: "{{ __sysctl_linux_modules_load_dropin_file_path }}"
  register: __sysctl_linux_modules_dropin_slurp
  failed_when:
    - __sysctl_linux_modules_dropin_slurp['msg'] is ansible.builtin.defined
    - "'file not found' not in (__sysctl_linux_modules_dropin_slurp['msg'] | ansible.builtin.lower)"


- name: "Config | Default | Determine the modules to load at boot and the ownership of the drop-in file"
  ansible.builtin.set_fact:
    # only modules that actually loaded: persisting one the kernel does not
    # have (container, missing kernel-modules-extra) would promise something
    # this host cannot deliver
    __sysctl_linux_modules_persist: >-
      {{
        (__sysctl_linux_profile_modules | ansible.builtin.default({}, true) | ansible.builtin.list)
        | ansible.builtin.reject('ansible.builtin.in', __sysctl_linux_modules_unavailable | ansible.builtin.default([]))
        | ansible.builtin.sort
        | ansible.builtin.list
      }}
    __sysctl_linux_modules_dropin_exists: >-
      {{ __sysctl_linux_modules_dropin_slurp['content'] is ansible.builtin.defined }}
    # ownership is the exact marker in the first line; anything else at the
    # fixed path is foreign
    __sysctl_linux_modules_dropin_owned: >-
      {{
        ((__sysctl_linux_modules_dropin_slurp['content'] | ansible.builtin.default('') | ansible.builtin.b64decode)
         .splitlines() | ansible.builtin.first | ansible.builtin.default(''))
        == __sysctl_linux_modules_load_marker
      }}


# Fails in check mode as well (the probe above runs there), so a collision is
# reported without modifying anything.
- name: "Config | Default | Check the modules-load drop-in file is not foreign"
  ansible.builtin.assert:
    that:
      - (not __sysctl_linux_modules_dropin_exists) or __sysctl_linux_modules_dropin_owned
    fail_msg: >-
      Refusing to manage {{ __sysctl_linux_modules_load_dropin_file_path }}:
      the existing file does not carry this role's ownership marker
      ('{{ __sysctl_linux_modules_load_marker }}' as its first line) and may
      belong to the administrator or other software. Move it aside or merge
      its content, then run again.
    quiet: true
  when:
    - (__sysctl_linux_modules_persist | ansible.builtin.length) > 0


- name: "Config | Default | Ensure the managed modules-load drop-in file"
  ansible.builtin.copy:
    content: "{{ __sysctl_linux_modules_load_marker ~ '\n' ~ (__sysctl_linux_modules_persist | ansible.builtin.join('\n')) ~ '\n' }}"
    dest: "{{ __sysctl_linux_modules_load_dropin_file_path }}"
    owner: "{{ __sysctl_linux_config_file_owner }}"
    group: "{{ __sysctl_linux_config_file_group }}"
    mode: "{{ __sysctl_linux_config_file_mode }}"
  when:
    - (__sysctl_linux_modules_persist | ansible.builtin.length) > 0


# A foreign file at the fixed path is left alone here: with no modules to
# register the role holds no claim on the path.
- name: "Config | Default | Remove the managed modules-load drop-in file (no modules required)"
  ansible.builtin.file:
    path: "{{ __sysctl_linux_modules_load_dropin_file_path }}"
    state: "absent"
  when:
    - (__sysctl_linux_modules_persist | ansible.builtin.length) == 0
    - __sysctl_linux_modules_dropin_owned | ansible.builtin.bool
