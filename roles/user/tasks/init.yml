# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __user_linux_used_facts }}"
  when:
    - not (__user_linux_used_facts is subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__user_linux_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __user_linux_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is version_compare(__user_linux_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__user_linux_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __user_linux_supported_platforms }}
  vars:
    __user_linux_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __user_linux_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __user_linux_matched_versions: >-
      {{
        __user_linux_supported_platforms
        | ansible.builtin.selectattr('name', 'match', __user_linux_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('match', __user_linux_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__user_linux_supported_platforms | ansible.builtin.length) > 0
    - (__user_linux_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __user_linux_platform_filenames_raw:
      - "{{ __user_linux_dist }}_{{ __user_linux_dist_ver }}.yml"
      - "{{ __user_linux_dist }}_{{ __user_linux_dist_major }}.yml"
      - "{{ __user_linux_dist }}.yml"
      - "{{ __user_linux_os_family }}.yml"
  vars:
    __user_linux_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __user_linux_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __user_linux_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __user_linux_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __user_linux_platform_filenames_most_specific_first: >-
      {{
        (__user_linux_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __user_linux_platform_filenames_most_specific_last: >-
      {{
        __user_linux_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __user_linux_vars_file }}"
  vars:
    __user_linux_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __user_linux_vars_file is ansible.builtin.file
  loop: "{{ __user_linux_platform_filenames_most_specific_last }}"


## user specific

- name: "Init | Assert account names in user_linux_accounts are unique"
  ansible.builtin.assert:
    that:
      - (__user_linux_account_names | ansible.builtin.length) == (__user_linux_account_names | ansible.builtin.unique | ansible.builtin.length)
    fail_msg: "Each 'name' in user_linux_accounts must be unique; one or more duplicate account names were found."
    success_msg: "All account names in user_linux_accounts are unique."
  vars:
    __user_linux_account_names: "{{ user_linux_accounts | ansible.builtin.map(attribute='name') | ansible.builtin.list }}"


- name: "Init | Assert group names in user_linux_groups are unique"
  ansible.builtin.assert:
    that:
      - (__user_linux_group_names | ansible.builtin.length) == (__user_linux_group_names | ansible.builtin.unique | ansible.builtin.length)
    fail_msg: "Each 'name' in user_linux_groups must be unique; one or more duplicate group names were found."
    success_msg: "All group names in user_linux_groups are unique."
  vars:
    __user_linux_group_names: "{{ user_linux_groups | ansible.builtin.map(attribute='name') | ansible.builtin.list }}"


- name: "Init | Reject plaintext passwords (effective password.hash must be empty or a crypt hash)"
  ansible.builtin.assert:
    that:
      - (__user_linux_pw_hash | ansible.builtin.length) == 0 or __user_linux_pw_hash[:1] == '$'
    fail_msg: >-
      Account '{{ __user_linux_pw_item['name'] }}': the effective password.hash is not a crypt hash
      (e.g. '$6$...'). Plaintext passwords are not accepted; use ansible.builtin.password_hash or mkpasswd.
    success_msg: "Account '{{ __user_linux_pw_item['name'] }}': password.hash is empty or a crypt hash."
  vars:
    __user_linux_pw_effective: >-
      {{
        __user_linux_account_defaults_effective
        | ansible.builtin.combine(__user_linux_pw_item, recursive=true)
      }}
    __user_linux_pw_hash: "{{ (__user_linux_pw_effective['password'] | ansible.builtin.default({}, true))['hash'] | ansible.builtin.default('', true) }}"
  loop: "{{ user_linux_accounts }}"
  loop_control:
    loop_var: "__user_linux_pw_item"
    label: "{{ __user_linux_pw_item['name'] }}"


- name: "Init | Read login.defs (only when reaping; tolerate a missing file)"
  ansible.builtin.slurp:
    src: "{{ __user_linux_login_defs_path }}"
  when:
    - user_linux_accounts_delete_unmanaged | ansible.builtin.bool
  failed_when: false
  register: "__user_linux_login_defs_raw"


- name: "Init | Derive effective UID_MIN/UID_MAX (public override, else login.defs, else fallback)"
  ansible.builtin.set_fact:
    # regex_findall (not regex_search) is used on purpose: its single capture
    # group returns the number directly, avoiding a "\1" backreference argument
    # (which Jinja would parse as the octal escape "\x01"). default('') covers a
    # missing login.defs (the slurp uses failed_when: false), and the
    # "+ ['<fallback>']" guarantees a value when there is no matching line.
    __user_linux_uid_min_effective: >-
      {{
        (user_linux_uid_min | int)
        if ((user_linux_uid_min | string | ansible.builtin.length) > 0)
        else (((__user_linux_login_defs_raw['content'] | ansible.builtin.default('') | ansible.builtin.b64decode
                | ansible.builtin.regex_findall('(?m)^\s*UID_MIN\s+(\d+)')) + ['1000']) | first | int)
      }}
    __user_linux_uid_max_effective: >-
      {{
        (user_linux_uid_max | int)
        if ((user_linux_uid_max | string | ansible.builtin.length) > 0)
        else (((__user_linux_login_defs_raw['content'] | ansible.builtin.default('') | ansible.builtin.b64decode
                | ansible.builtin.regex_findall('(?m)^\s*UID_MAX\s+(\d+)')) + ['60000']) | first | int)
      }}
  when:
    - user_linux_accounts_delete_unmanaged | ansible.builtin.bool
