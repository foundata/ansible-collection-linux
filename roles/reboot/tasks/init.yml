# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __reboot_linux_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__reboot_linux_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__reboot_linux_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __reboot_linux_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is ansible.builtin.version(__reboot_linux_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__reboot_linux_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __reboot_linux_supported_platforms }}
  vars:
    __reboot_linux_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __reboot_linux_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __reboot_linux_matched_versions: >-
      {{
        __reboot_linux_supported_platforms
        | ansible.builtin.selectattr('name', 'ansible.builtin.match', __reboot_linux_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('ansible.builtin.match', __reboot_linux_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__reboot_linux_supported_platforms | ansible.builtin.length) > 0
    - (__reboot_linux_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __reboot_linux_platform_filenames_raw:
      - "{{ __reboot_linux_dist }}_{{ __reboot_linux_dist_ver }}.yml"
      - "{{ __reboot_linux_dist }}_{{ __reboot_linux_dist_major }}.yml"
      - "{{ __reboot_linux_dist }}.yml"
      - "{{ __reboot_linux_os_family }}.yml"
  vars:
    __reboot_linux_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __reboot_linux_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __reboot_linux_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __reboot_linux_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __reboot_linux_platform_filenames_most_specific_first: >-
      {{
        (__reboot_linux_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __reboot_linux_platform_filenames_most_specific_last: >-
      {{
        __reboot_linux_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __reboot_linux_vars_file }}"
  vars:
    __reboot_linux_vars_file: "{{ role_path }}/vars/{{ __reboot_linux_varsfile_item }}"
  when:
    - __reboot_linux_vars_file is ansible.builtin.file
  loop: "{{ __reboot_linux_platform_filenames_most_specific_last }}"
  loop_control:
    loop_var: "__reboot_linux_varsfile_item"


### Reboot specific


- name: "Init | Determine if reboot is required"
  # Using the shell module here as we need to run multiple conditional checks
  # that would require many (slow) separate Ansible tasks otherwise. The script
  # handles OS and tools portability internally. This might be moved into a
  # dedicated Ansible module or fact as an improvement.
  ansible.builtin.shell:
    cmd: |
      set -u          # no uninitialized vars
      set -o pipefail # exit on pipeline errors
      __reboot_required='0'

      # Check Debian-like OS reboot indicator file
      if [ "${__reboot_required}" != '1' ] \
        && [ -f '/var/run/reboot-required' ]; then
        __reboot_required='1'
      fi

      # Check openSUSE reboot indicator (zypper needs-rebooting) FIRST;
      # authoritative wherever zypper exists.
      # Exit code 102 (ZYPPER_EXIT_INF_REBOOT_NEEDED) = reboot required
      if [ "${__reboot_required}" != '1' ] \
        && command -v 'zypper' >/dev/null 2>&1; then
        zypper needs-rebooting >/dev/null 2>&1
        __zypper_rc="$?"
        if [ "${__zypper_rc}" = '102' ]; then
          __reboot_required='1'
        fi
        unset __zypper_rc
      fi

      # Check RedHat-like OS reboot indicator (needs-restarting).
      # Only exit code 1 means "reboot required"; any other non-zero code is an
      # error (e.g. a transient dnf/rpm failure) and must NOT trigger a reboot.
      # Skipped where zypper exists: SUSE ships needs-restarting as a wrapper
      # collapsing every non-zero zypper exit (reboot hint and errors alike)
      # into 1, which would turn a zypper error into a reboot.
      if [ "${__reboot_required}" != '1' ] \
        && ! command -v 'zypper' >/dev/null 2>&1 \
        && command -v 'needs-restarting' >/dev/null 2>&1; then
        needs-restarting -r >/dev/null 2>&1
        __needs_restarting_rc="$?"
        if [ "${__needs_restarting_rc}" = '1' ]; then
          __reboot_required='1'
        fi
        unset __needs_restarting_rc
      fi

      # Check if running kernel differs from newest installed kernel.
      # The releases are compared EXACTLY (the filename prefix is stripped
      # first): a substring test would accept a running "6.1.0-3" as the
      # installed "6.1.0-30" and miss the required reboot. Rescue kernels and
      # backup/boot-loader artifacts are not release candidates.
      if [ "${__reboot_required}" != '1' ]; then
        __kernel_installed=''
        if [ -d '/boot' ]; then
          __kernel_installed="$(
            find /boot -maxdepth 1 -name 'vmlinuz-*' \
              ! -name 'vmlinuz-0-rescue-*' ! -name '*.old' \
              ! -name '*.efi' ! -name '*.img' -printf '%f\n' \
            | sed -e 's/^vmlinuz-//' \
            | sort -V \
            | tail -n 1
          )"
        fi
        __kernel_current="$(uname -r)"
        if [ -n "${__kernel_installed}" ] \
          && [ "${__kernel_installed}" != "${__kernel_current}" ]; then
          __reboot_required='1'
        fi
        unset __kernel_installed __kernel_current
      fi

      # Check if SELinux mode changed (requires reboot to apply)
      if [ "${__reboot_required}" != '1' ] \
        && command -v 'sestatus' >/dev/null 2>&1; then
        export LC_ALL='C'
        __selinux_current="$(sestatus 2>/dev/null | grep -i -E 'current.+mode' \
          | cut -d':' -f2 | tr '[:upper:]' '[:lower:]' \
          | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        __selinux_config="$(sestatus 2>/dev/null | grep -i -E 'mode.+file' \
          | cut -d':' -f2 | tr '[:upper:]' '[:lower:]' \
          | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        if [ -n "${__selinux_current}" ] \
          && [ -n "${__selinux_config}" ] \
          && [ "${__selinux_current}" != "${__selinux_config}" ]; then
          __reboot_required='1'
        fi
        unset __selinux_current __selinux_config
      fi

      printf '%s' "${__reboot_required}"
    executable: "/bin/bash"
  changed_when:
    - false
  # The script is read-only; run it under "--check" too, otherwise the detection
  # is skipped and the role always concludes that no reboot is required.
  check_mode: false
  register: __reboot_linux_check_result


- name: "Init | Set fact if a reboot is required"
  ansible.builtin.set_fact:
    __reboot_linux_required: "{{ __reboot_linux_check_result['stdout'] | ansible.builtin.default('0') | ansible.builtin.int | ansible.builtin.bool }}"


# Required for checkability due to the inability to reboot containerized systems
- name: "Init | Set container detection fact"
  ansible.builtin.set_fact:
    __reboot_linux_is_container: >-
      {{
        ((ansible_facts['virtualization_role'] == 'guest' and
          ansible_facts['virtualization_type'] in ['docker', 'podman', 'containerd', 'lxc'])
         or
         (ansible_facts.get('env', {}).get('container') is not ansible.builtin.none))
      }}
