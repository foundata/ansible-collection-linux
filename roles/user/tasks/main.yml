# Main entry point for the role.

---

- name: "Main | Include role initialization tasks"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/init.yml"
    apply:
      tags:
        - "always"
        - "user_linux_always"
  tags:
    - "always"
    - "user_linux_always"


- name: "Main | Include setup tasks (install): best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __user_linux_task_file }}"
    apply:
      tags:
        - "user_linux_setup"
  vars:
    __user_linux_task_file: "{{ role_path }}/tasks/setup/install/{{ __user_linux_loop_item }}"
  when:
    - user_linux_state == 'present'
    - __user_linux_task_file is ansible.builtin.file
  loop: "{{ __user_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__user_linux_loop_item"
  tags:
    - "user_linux_setup"


- name: "Main | Include configuration tasks: best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __user_linux_task_file }}"
    apply:
      tags:
        - "user_linux_config"
  vars:
    __user_linux_task_file: "{{ role_path }}/tasks/config/{{ __user_linux_loop_item }}"
  when:
    - user_linux_state == 'present'
    - __user_linux_task_file is ansible.builtin.file
  loop: "{{ __user_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__user_linux_loop_item"
  tags:
    - "user_linux_config"


- name: "Main | Include service or daemon management tasks: best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __user_linux_task_file }}"
    apply:
      tags:
        - "user_linux_service"
  vars:
    __user_linux_task_file: "{{ role_path }}/tasks/service/{{ __user_linux_loop_item }}"
  when:
    - user_linux_state == 'present'
    - __user_linux_task_file is ansible.builtin.file
  loop: "{{ __user_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__user_linux_loop_item"
  tags:
    - "user_linux_service"


- name: "Main | Include setup tasks (uninstall): best platform matches (if any), then default"
  ansible.builtin.include_tasks:
    file: "{{ __user_linux_task_file }}"
    apply:
      tags:
        - "user_linux_setup"
  vars:
    __user_linux_task_file: "{{ role_path }}/tasks/setup/uninstall/{{ __user_linux_loop_item }}"
  when:
    - user_linux_state == 'absent'
    - __user_linux_task_file is ansible.builtin.file
  loop: "{{ __user_linux_platform_filenames_most_specific_first + ['default.yml'] }}"
  loop_control:
    loop_var: "__user_linux_loop_item"
  tags:
    - "user_linux_setup"
