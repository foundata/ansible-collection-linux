# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __sysctl_linux_used_facts }}"
  when:
    # Check the concrete fact keys the role consumes, not the gather_subset
    # tokens: "hardware" (in __sysctl_linux_used_facts) is never a fact key, so
    # checking the token list would always trigger a (re)gather. This keeps the
    # skip-when-already-available optimization while still working under
    # gather_facts: false.
    - not (__sysctl_linux_required_fact_keys is subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__sysctl_linux_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __sysctl_linux_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is version_compare(__sysctl_linux_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__sysctl_linux_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __sysctl_linux_supported_platforms }}
  vars:
    __sysctl_linux_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __sysctl_linux_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __sysctl_linux_matched_versions: >-
      {{
        __sysctl_linux_supported_platforms
        | ansible.builtin.selectattr('name', 'match', __sysctl_linux_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('match', __sysctl_linux_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__sysctl_linux_supported_platforms | ansible.builtin.length) > 0
    - (__sysctl_linux_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __sysctl_linux_platform_filenames_raw:
      - "{{ __sysctl_linux_dist }}_{{ __sysctl_linux_dist_ver }}.yml"
      - "{{ __sysctl_linux_dist }}_{{ __sysctl_linux_dist_major }}.yml"
      - "{{ __sysctl_linux_dist }}.yml"
      - "{{ __sysctl_linux_os_family }}.yml"
  vars:
    __sysctl_linux_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __sysctl_linux_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __sysctl_linux_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __sysctl_linux_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __sysctl_linux_platform_filenames_most_specific_first: >-
      {{
        (__sysctl_linux_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __sysctl_linux_platform_filenames_most_specific_last: >-
      {{
        __sysctl_linux_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __sysctl_linux_vars_file }}"
  vars:
    __sysctl_linux_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __sysctl_linux_vars_file is ansible.builtin.file
  loop: "{{ __sysctl_linux_platform_filenames_most_specific_last }}"


### sysctl specific

- name: "Init | Show effective merged variables (computed lazily in vars/main.yml)"
  ansible.builtin.debug:
    msg: "{{ __sysctl_linux_effective_var }} = {{ lookup('ansible.builtin.vars', __sysctl_linux_effective_var) }}"
    verbosity: 3
  loop:
    - "__sysctl_linux_effective_parameters"
  loop_control:
    loop_var: "__sysctl_linux_effective_var"
    label: "{{ __sysctl_linux_effective_var }}"


- name: "Init | Include sysctl profile-specific variables (if any)"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/profiles/{{ sysctl_linux_profile }}.yml"
  when:
    - sysctl_linux_profile | ansible.builtin.length > 0


# kernel.shmall is expressed in memory pages, so the "database" profile's
# auto-calculation needs the actual page size. There is no Ansible fact for it,
# hence the command. The default from vars/main.yml (4096) remains in effect
# when this task is skipped or yields no usable value.
- name: "Init | Determine memory page size (needed by the 'database' profile)"
  ansible.builtin.command:
    argv:
      - "getconf"
      - "PAGE_SIZE"
  when:
    - sysctl_linux_profile == 'database'
  changed_when:
    - false
  register: __sysctl_linux_page_size_result


- name: "Init | Set memory page size fact (if determined)"
  ansible.builtin.set_fact:
    __sysctl_linux_page_size: "{{ __sysctl_linux_page_size_result['stdout'] | ansible.builtin.trim }}"
  when:
    - __sysctl_linux_page_size_result['stdout'] is ansible.builtin.defined
    - (__sysctl_linux_page_size_result['stdout'] | ansible.builtin.trim) is ansible.builtin.regex('^[0-9]+$')


# Required for checkability due to read-only kernel parameters in containerized systems
- name: "Init | Set container detection fact"
  ansible.builtin.set_fact:
    __sysctl_linux_is_container: >-
      {{
        ((ansible_facts['virtualization_role'] == 'guest' and
          ansible_facts['virtualization_type'] in ['docker', 'podman', 'containerd', 'lxc'])
         or
         (ansible_facts.get('env', {}).get('container') is not none))
      }}


# Load kernel modules a profile depends on (e.g. nf_conntrack for routers,
# br_netfilter for virtualization) so module-gated kernel parameters
# (net.netfilter.*, net.bridge.*) exist and can be set. Best effort: failures
# are tolerated in containers, where module loading is typically not possible
# and such parameters are read-only anyway.
- name: "Init | Load kernel modules required by the selected profile (best effort)"
  community.general.modprobe:
    name: "{{ item }}"
    state: "present"
    persistent: "present"
  when:
    - sysctl_linux_state == 'present'
    - (__sysctl_linux_profile_modules | ansible.builtin.length) > 0
  failed_when:
    - __sysctl_linux_modprobe_result is ansible.builtin.failed
    - not __sysctl_linux_is_container
  loop: "{{ __sysctl_linux_profile_modules }}"
  loop_control:
    label: "{{ item }}"
  register: __sysctl_linux_modprobe_result
