# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# List of facts used by the role (gathered on a best-effort basis if needed).
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__auto_update_linux_used_facts:
  # from subset "distribution"
  - "distribution"
  - "distribution_major_version"
  - "distribution_version"
  - "os_family"


# List of platforms this role supports and was designed for.
__auto_update_linux_supported_platforms:
  - name: "Debian"
    versions:
      - "12"
      - "13"
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "openSUSE Leap"
    versions:
      - "16.0"
  - name: "RedHat" # includes AlmaLinux, Rocky and CentOS Stream
    versions:
      - "9"
      - "10"
  - name: "Ubuntu"
    versions:
      - "22.04"
      - "24.04"
      - "26.04"


# List of package names to be installed when auto_update_linux_state is
# set to "present".
__auto_update_linux_packages_install: []


# List of package names to be uninstalled when auto_update_linux_state is
# set to "absent". This variable is useful when __auto_update_linux_packages_install
# contains packages that are required for the managed software to function but
# should not be removed during uninstallation, as doing so could break other
# software. This is usually the case if there are common dependencies like
# "curl" or "openssl" which typically should remain installed even after
# uninstalling the software managed by this role.
__auto_update_linux_packages_uninstall: "{{ __auto_update_linux_packages_install }}"


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__auto_update_linux_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__auto_update_linux_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__auto_update_linux_paths_neutralize: {}


### systemd timer that triggers the automatic update run.

# Internal default configuration for the systemd timer drop-in. User values from
# auto_update_linux_timer_settings are merged on top of these in tasks/init.yml.
# See auto_update_linux_timer_settings in defaults/main.yml for a detailed
# description of the structure (as this variable is using the same).
__auto_update_linux_timer_settings_defaults:
  OnCalendar: "daily"
  RandomizedDelaySec: "60m"
  Persistent: true


# Name of the systemd timer unit that triggers the unattended update run. This
# is platform-specific and therefore set in the matching vars/<platform>.yml
# file (e.g. "apt-daily-upgrade.timer", "dnf-automatic.timer",
# "dnf5-automatic.timer" or "os-update.timer"). Defined here as an empty default
# to keep references safe on unsupported platforms.
__auto_update_linux_systemd_timer_unit_name: ""


# systemd timer drop-in override directory and file used to apply the schedule
# from auto_update_linux_timer_settings. The unit name is resolved at runtime
# from the platform-specific variable above.
__auto_update_linux_systemd_timer_unit_dropin_dir_path: "/etc/systemd/system/{{ __auto_update_linux_systemd_timer_unit_name }}.d"
__auto_update_linux_systemd_timer_unit_dropin_dir_owner: "root"
__auto_update_linux_systemd_timer_unit_dropin_dir_group: "root"
__auto_update_linux_systemd_timer_unit_dropin_dir_mode: "u=rwx,g=rx,o=rx" # 0755

__auto_update_linux_systemd_timer_unit_dropin_file_path: "{{ __auto_update_linux_systemd_timer_unit_dropin_dir_path }}/00-managed.conf"
__auto_update_linux_systemd_timer_unit_dropin_file_owner: "root"
__auto_update_linux_systemd_timer_unit_dropin_file_group: "root"
__auto_update_linux_systemd_timer_unit_dropin_file_mode: "u=rw,g=r,o=r" # 0644


### Override defaults of dependencies used by this role (if any).

# nothing right now
