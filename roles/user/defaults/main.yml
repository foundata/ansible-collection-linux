# Default variables and values for this role.
#
# These variables are designed to be easily overridden (as they have a low
# precedence) and typically allow users to customize the role's behavior.
# Each variable should have a clear comment above it, describing its purpose
# and how it fits into the role's functionality.

---

# Default values applied to every entry in `user_linux_accounts` that does not
# set the corresponding key itself. This avoids repeating common settings (login
# shell, umask, ...) on each account.
#
# The keys mirror the per-account keys of the same name (see
# `user_linux_accounts`). Any value provided here is overridden by an explicit
# value on the individual account.
#
# Only the keys you want to change need to be supplied; they are deep-merged
# over the role's built-in defaults (see `__user_linux_account_defaults_builtin`
# in `vars/main.yml`). The effective built-in defaults are:
#
# ```yaml
# user_linux_account_defaults:
#   state: "present"
#   comment: ""
#   shell: "/bin/bash"
#   umask: "0027"
#   system: false
#   local: false
#   groups_append: true
#   expires: -1
#   home:
#     create: true
#     move: true
#   password:
#     update: "on_create"
#   ssh_authorized_keys_delete_unmanaged: false
# ```
#
# Supported keys are all known by `user_linux_accounts`.
#
# - Type: dict
# - Required: No
# - Default: {}
user_linux_account_defaults: {}

# List of local user accounts to manage. Each entry describes one account as a
# dictionary; `name` is mandatory, all other keys are optional and fall back to
# `user_linux_account_defaults` (where noted) or to the underlying platform
# defaults (when completely undefined).
#
# To remove an account, set its `state` to `absent`: this deletes the user
# together with its data (home directory and mail spool). There is intentionally
# no option to keep the data while deleting the account. To disable login while
# preserving all data, do not delete the account; you could instead set
# something like `password['lock']: true` and a non-interactive `shell` like
# `/usr/sbin/nologin`).
#
# Example:
#
# ```yaml
# user_linux_accounts:
#   - name: "ahaerter"
#     state: "present"
#     comment: "Andreas Haerter (foundata)"
#     groups:
#       - "{\{ (ansible_facts['os_family'] == 'Debian') | ternary('sudo', 'wheel') }\}" # 'sudo' on Debian/Ubuntu, 'wheel' elsewhere
#     password:
#       hash: "{\{ lookup('ansible.builtin.unvault', 'secrets/ahaerter-hash.vault') | trim }\}"
#       update: "always"
#     ssh_authorized_keys:
#       - key: "ssh-ed25519 AAAAC3Nz..."
#   - name: "obsoleteUserToWipe"
#     state: "absent"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
user_linux_accounts: []

# Default values applied to every entry in `user_linux_groups` that does not set
# the corresponding key itself. The keys mirror the per-group keys of the same
# name (see `user_linux_groups`); any value provided here is overridden by an
# explicit value on the individual group.
#
# Only the keys you want to change need to be supplied; they are deep-merged
# over the role's built-in defaults (see `__user_linux_group_defaults_builtin`
# in `vars/main.yml`). The effective built-in defaults are:
#
# ```yaml
# user_linux_group_defaults:
#   state: "present"
#   system: false
# ```
#
# Supported keys are all known by `user_linux_groups`.
#
# - Type: dict
# - Required: No
# - Default: {}
user_linux_group_defaults: {}

# List of local groups to manage. Each entry describes one group as a
# dictionary; `name` is mandatory, all other keys are optional.
#
# Groups are created before the accounts in `user_linux_accounts` (so they can
# be referenced as primary or supplementary groups) and groups set to `absent`
# are removed after the accounts.
#
# Note: When a user is deleted, its user-private group (a group with the same
# name as the user, created together with the account) is removed automatically
# by the platform if no other user still uses it. You only need to list groups
# here that you want to manage explicitly.
#
# Example:
#
# ```yaml
# user_linux_groups:
#   - name: "webops"
#     gid: 4200
#   - name: "legacy"
#     state: "absent"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
user_linux_groups: []

# If `true`, local user accounts that are not listed in `user_linux_accounts`
# are removed (together with their data). Only regular accounts are considered:
# an account is a candidate for removal only if its UID is within the
# `UID_MIN`.. `UID_MAX` range (see `user_linux_uid_min` / `user_linux_uid_max`),
# so system accounts are never touched.
#
# The following accounts are always protected, even when not listed in
# `user_linux_accounts`: `root`, the account Ansible is currently connected as,
# and every name in `user_linux_accounts_delete_unmanaged_exclude`.
#
# This is a destructive operation and therefore disabled by default.
#
# - Type: bool
# - Required: No
# - Default: false
user_linux_accounts_delete_unmanaged: false

# List of account names that must never be removed by
# `user_linux_accounts_delete_unmanaged`, even if they are not declared in
# `user_linux_accounts` and fall within the regular UID range. Useful for
# break-glass or automation accounts.
#
# `root` and the current Ansible connection user are always protected and do not
# need to be listed here.
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: str
user_linux_accounts_delete_unmanaged_exclude: []

# Lower bound (inclusive) of the UID range that
# `user_linux_accounts_delete_unmanaged` considers to be regular user accounts.
# An empty string (the default) means the value is read from `UID_MIN` in
# `/etc/login.defs` (falling back to `1000` if it cannot be determined).
#
# - Type: raw
# - Required: No
# - Default: ""
user_linux_uid_min: ""

# Upper bound (inclusive) of the UID range that
# `user_linux_accounts_delete_unmanaged` considers to be regular user accounts.
# An empty string (the default) means the value is read from `UID_MAX` in
# `/etc/login.defs` (falling back to `60000` if it cannot be determined).
#
# - Type: raw
# - Required: No
# - Default: ""
user_linux_uid_max: ""
