# Check collection role "sysctl" outcomes.

- name: "Molecule | Verify | Initialize the foundata.linux.sysctl role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.linux.sysctl"
    tasks_from: "init"
    public: true


## Preparation

- name: "Molecule | Verify | Set sysctl_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'match', '^(sysctl_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | Set other expected or needed facts"
  ansible.builtin.set_fact:
    __sysctl_linux_config_dropin_file_path: "{{ __sysctl_linux_config_dropin_dir_path }}/90-custom-dropin.conf"


## Drop-in config file

- name: "Molecule | Verify | Check if sysctl drop-in configuration file exists"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_dropin_file_path }}"
  register: __testing_dropin_file


- name: "Molecule | Verify | Assert sysctl drop-in configuration file exists"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file['stat']['exists']
    fail_msg: "The sysctl drop-in configuration file '{{ __sysctl_linux_config_dropin_file_path }}' does not exist."
    success_msg: "The sysctl drop-in configuration file '{{ __sysctl_linux_config_dropin_file_path }}' exists."


- name: "Molecule | Verify | Check if default sysctl drop-in configuration file does exists (if custom filename is used)"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_dropin_file_path_default }}"
  when:
    - __sysctl_linux_config_dropin_file_path != __sysctl_linux_config_dropin_file_path_default
  register: __testing_dropin_file_default


- name: "Molecule | Verify | Assert default sysctl drop-in configuration file does not exists (if custom filename is used)"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file_default['stat']['exists'] is ansible.builtin.false
    fail_msg: >-
      The default sysctl drop-in configuration file '{{ __sysctl_linux_config_dropin_file_path }}' exists (even though a custom filename is used).
    success_msg: >-
      The default sysctl drop-in configuration file '{{ __sysctl_linux_config_dropin_file_path }}' does not exist (valid as custom filename is used).
  when:
    - __sysctl_linux_config_dropin_file_path != __sysctl_linux_config_dropin_file_path_default


- name: "Molecule | Verify | Read sysctl drop-in configuration file content"
  ansible.builtin.slurp:
    src: "{{ __sysctl_linux_config_dropin_file_path }}"
  register: __testing_dropin_content


- name: "Molecule | Verify | Assert sysctl drop-in configuration file contains expected parameters"
  vars:
    __testing_file_content: "{{ __testing_dropin_content['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      - "'ansible managed' in (__testing_file_content | ansible.builtin.lower)"
      - '__testing_file_content is regex("net\.ipv4\.tcp_syncookies\s*=\s*0")'
      - '__testing_file_content is regex("net\.ipv4\.tcp_timestamps\s*=\s*1")'
      - '__testing_file_content is regex("net\.core\.somaxconn\s*=\s*12288")'
    fail_msg: "The sysctl drop-in configuration file does not contain the expected parameters."
    success_msg: "The sysctl drop-in configuration file contains all expected parameters."


## Main configuration

- name: "Molecule | Verify | Check sysctl main configuration file exists (created by 'prepare' molecule stage)"
  ansible.builtin.stat:
    path: "{{ __sysctl_linux_config_file_path }}"
  register: __testing_config_file


- name: "Molecule | Verify | Assert sysctl main configuration file exists (created by 'prepare' molecule stage)"
  ansible.builtin.assert:
    that:
      - __testing_config_file['stat']['exists']
    fail_msg: "The sysctl main configuration file '{{ __sysctl_linux_config_file_path }}' does not exist."
    success_msg: "The sysctl main configuration file '{{ __sysctl_linux_config_file_path }}' exists."


- name: "Molecule | Verify | Read sysctl main configuration file content"
  ansible.builtin.slurp:
    src: "{{ __sysctl_linux_config_file_path }}"
  register: __testing_main_config_content
  when:
    - __testing_config_file['stat']['exists']


- name: "Molecule | Verify | Assert only managed parameters are commented out in sysctl main configuration file (to ensure precedence)"
  vars:
    __testing_file_content: "{{ __testing_main_config_content['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # (?m) enables multiline mode so ^ matches start of each line, not just start of string
      # Unmanaged parameter: must exist as uncommented line (role should not touch it)
      - '__testing_file_content is regex("(?m)^net\.ipv4\.tcp_mtu_probing\s*=")'
      # Managed parameters: must be commented out (no uncommented line) AND commented line must
      # exist (proving the role commented them out, not that they were never there)
      - '__testing_file_content is not regex("(?m)^net\.ipv4\.tcp_syncookies\s*=")'
      - '__testing_file_content is regex("(?m)^#\s*net\.ipv4\.tcp_syncookies\s*=")'
      - '__testing_file_content is not regex("(?m)^net\.ipv4\.tcp_timestamps\s*=")'
      - '__testing_file_content is regex("(?m)^#\s*net\.ipv4\.tcp_timestamps\s*=")'
      # Profile-derived parameter (managed by the "web" profile, not present in
      # sysctl_linux_parameters): must also be commented out so the drop-in wins.
      - '__testing_file_content is not regex("(?m)^net\.ipv4\.tcp_fin_timeout\s*=")'
      - '__testing_file_content is regex("(?m)^#\s*net\.ipv4\.tcp_fin_timeout\s*=")'
    fail_msg: "Managed parameters not properly commented out or unmanaged parameter was modified in '{{ __sysctl_linux_config_file_path }}'."
    success_msg: "All managed parameters are commented out and unmanaged parameters remain untouched in '{{ __sysctl_linux_config_file_path }}'."
  when:
    - __testing_config_file['stat']['exists']


- name: "Molecule | Verify | Verify kernel parameters (skipped in containerized systems due to read-only params)"
  when:
    - not __sysctl_linux_is_container
  block:

    - name: "Molecule | Verify | Get active kernel parameter values "
      ansible.builtin.command:
        argv:
          - "{{ __sysctl_linux_sysctl_executable }}"
          - "--values"
          - "{{ item }}"
      loop:
        - "net.ipv4.tcp_syncookies"
        - "net.ipv4.tcp_timestamps"
        - "net.core.somaxconn"
      register: __testing_active_params
      changed_when:
        - false

    - name: "Molecule | Verify | Assert active kernel parameters have expected values (skipped in containers due to read-only system params)"
      ansible.builtin.assert:
        that:
          - __testing_active_params['results'][0]['stdout'] == "0"
          - __testing_active_params['results'][1]['stdout'] == "1"
          - __testing_active_params['results'][1]['stdout'] == "12288"
        fail_msg: "Active kernel parameters do not match expected values."
        success_msg: "All active kernel parameters have the expected values."


## Regression tests: init-only merged variable evaluation
#
# Re-run the role's init with custom parameters and no profile selected, then
# assert the merged __sysctl_linux_effective_parameters directly. This guards
# the profile/user merge (whether materialized in tasks/init.yml or
# lazily in vars/main.yml): with no profile, __sysctl_linux_profile_parameters
# is undefined, so the expression must resolve via its default({}) guard and
# the user parameters must flow through unchanged.
#
# Inputs are set via set_fact so they outrank the converge-time facts restored
# at the top of this file and stay in scope when the assertion dereferences the
# (lazily evaluated) effective variable.

- name: "Molecule | Verify | Validate effective sysctl parameters merge (init-only)"
  block:

    - name: "Molecule | Verify | Set custom parameters and clear the profile for the merge check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: ""
        sysctl_linux_parameters:
          net.ipv4.ip_forward: "1"
          vm.swappiness: "10"


    - name: "Molecule | Verify | Re-initialize sysctl with custom parameters"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert effective sysctl parameters merged correctly"
      ansible.builtin.assert:
        that:
          - __sysctl_linux_effective_parameters is mapping
          - __sysctl_linux_effective_parameters['net.ipv4.ip_forward'] == "1"
          - __sysctl_linux_effective_parameters['vm.swappiness'] == "10"
        fail_msg: "__sysctl_linux_effective_parameters did not merge profile and user parameters as expected."
        success_msg: "__sysctl_linux_effective_parameters merged profile and user parameters correctly."


## Regression tests: profile loading and resource auto-calculation
#
# Re-run the role's init with a profile selected (no user parameters) and assert
# the resulting __sysctl_linux_effective_parameters directly: static keys, the
# required kernel module list, and the RAM-derived auto-calculated values. This
# is init-only (nothing is applied to the kernel), so it is safe in containers.

- name: "Molecule | Verify | Validate web profile (init-only, incl. auto-calculation)"
  block:

    - name: "Molecule | Verify | Select the web profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "web"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the web profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert web profile parameters and auto-calculation"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.core.somaxconn'] | ansible.builtin.int) == 65535
          - (__sysctl_linux_effective_parameters['net.ipv4.tcp_syncookies'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['fs.protected_symlinks'] | ansible.builtin.int) == 1
          - "'nf_conntrack' in __sysctl_linux_profile_modules"
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_max'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 16)
          - (__sysctl_linux_effective_parameters['fs.file-max'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 100, 100000] | ansible.builtin.max)
          - (__sysctl_linux_effective_parameters['net.core.rmem_max'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 128, 16777216] | ansible.builtin.min)
        fail_msg: "web profile did not load or auto-calculate as expected."
        success_msg: "web profile loaded and auto-calculated correctly."


- name: "Molecule | Verify | Validate database profile (init-only, incl. auto-calculation)"
  block:

    - name: "Molecule | Verify | Select the database profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "database"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the database profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert database profile parameters and auto-calculation"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['vm.swappiness'] | ansible.builtin.int) == 10
          - (__sysctl_linux_effective_parameters['vm.dirty_ratio'] | ansible.builtin.int) == 40
          - (__sysctl_linux_effective_parameters['kernel.shmmax'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 2)
          - (__sysctl_linux_effective_parameters['kernel.shmall'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 2 // (__sysctl_linux_page_size | ansible.builtin.int))
          - (__sysctl_linux_effective_parameters['vm.min_free_kbytes'] | ansible.builtin.int) ==
            ([(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 // 100, 2097152] | ansible.builtin.min)
        fail_msg: "database profile did not load or auto-calculate as expected."
        success_msg: "database profile loaded and auto-calculated correctly."


- name: "Molecule | Verify | Validate file profile (init-only, incl. auto-calculation)"
  block:

    - name: "Molecule | Verify | Select the file profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "file"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the file profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert file profile parameters and auto-calculation"
      vars:
        __testing_bufmax: "{{ [(ansible_facts['memtotal_mb'] | ansible.builtin.int) * 1024 * 1024 // 128, 16777216] | ansible.builtin.min }}"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.core.rmem_default'] | ansible.builtin.int) == 1048576
          - (__sysctl_linux_effective_parameters['fs.inotify.max_user_watches'] | ansible.builtin.int) == 524288
          - (__sysctl_linux_effective_parameters['net.core.rmem_max'] | ansible.builtin.int) ==
            (__testing_bufmax | ansible.builtin.int)
          - __sysctl_linux_effective_parameters['net.ipv4.tcp_rmem'] ==
            ('4096 1048576 ' ~ __testing_bufmax)
        fail_msg: "file profile did not load or auto-calculate as expected."
        success_msg: "file profile loaded and auto-calculated correctly."


- name: "Molecule | Verify | Validate virtualization profile (init-only)"
  block:

    - name: "Molecule | Verify | Select the virtualization profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "virtualization"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the virtualization profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert virtualization profile parameters and required module"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['vm.overcommit_memory'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['kernel.sched_migration_cost_ns'] | ansible.builtin.int) == 5000000
          - (__sysctl_linux_effective_parameters['net.bridge.bridge-nf-call-iptables'] | ansible.builtin.int) == 0
          - "'br_netfilter' in __sysctl_linux_profile_modules"
        fail_msg: "virtualization profile did not load as expected."
        success_msg: "virtualization profile loaded correctly."


- name: "Molecule | Verify | Validate router profiles (init-only, incl. forwarding direction)"
  block:

    - name: "Molecule | Verify | Select the router profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "router"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the router profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert router profile forwarding, conntrack and rp_filter"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.rp_filter'] | ansible.builtin.int) == 2
          - "'nf_conntrack' in __sysctl_linux_profile_modules"
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_max'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 32)
          - (__sysctl_linux_effective_parameters['net.netfilter.nf_conntrack_buckets'] | ansible.builtin.int) ==
            ((ansible_facts['memtotal_mb'] | ansible.builtin.int) * 8)
        fail_msg: "router profile did not load or auto-calculate as expected."
        success_msg: "router profile loaded and auto-calculated correctly."


    - name: "Molecule | Verify | Select the router_v4only profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "router_v4only"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the router_v4only profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert router_v4only enables IPv4 and disables IPv6 forwarding"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.default.forwarding'] | ansible.builtin.int) == 0
        fail_msg: "router_v4only forwarding direction is wrong."
        success_msg: "router_v4only forwarding direction is correct."


    - name: "Molecule | Verify | Select the router_v6only profile for the profile check"
      ansible.builtin.set_fact:
        sysctl_linux_profile: "router_v6only"
        sysctl_linux_parameters: {}


    - name: "Molecule | Verify | Re-initialize sysctl with the router_v6only profile"
      ansible.builtin.include_role:
        name: "foundata.linux.sysctl"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert router_v6only enables IPv6 and disables IPv4 forwarding"
      ansible.builtin.assert:
        that:
          - (__sysctl_linux_effective_parameters['net.ipv6.conf.all.forwarding'] | ansible.builtin.int) == 1
          - (__sysctl_linux_effective_parameters['net.ipv4.ip_forward'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.all.forwarding'] | ansible.builtin.int) == 0
          - (__sysctl_linux_effective_parameters['net.ipv4.conf.default.forwarding'] | ansible.builtin.int) == 0
        fail_msg: "router_v6only forwarding direction is wrong."
        success_msg: "router_v6only forwarding direction is correct."
