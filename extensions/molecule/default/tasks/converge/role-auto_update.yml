# Execute the collection role "auto_update" against all driver-created instances.

- name: "Molecule | Converge | Store auto_update_linux_* role parameters in __testing_state"
  ansible.builtin.include_tasks:
    file: "../tasks/state_update.yml"
  vars:
    __testing_state_update:
      auto_update_linux_type: "security"
      auto_update_linux_apply: "install"
      auto_update_linux_reboot: "scheduled"
      auto_update_linux_service_state: "enabled"
      auto_update_linux_timer_settings:
        # A list renders one assignment per item after the single shared reset,
        # so this also guards that repeatable triggers are not stringified.
        OnCalendar:
          - "*-*-* 03:30:00"
          - "Sat,Sun 05:00"
        # A second trigger of a different kind: all trigger directives share one
        # list in systemd, so this guards against a reset that wipes the
        # calendar trigger rendered before it.
        OnActiveSec: "7d"
        # boolean event trigger, guarding the third value kind of the contract
        OnClockChange: true
        RandomizedDelaySec: "30m"
      auto_update_linux_reboot_timer_settings:
        # A list renders one assignment per item, guarding the list contract on
        # the role-owned reboot unit as well.
        OnCalendar:
          - "*-*-* 04:30:00"
          - "Sat,Sun 05:15"
        RandomizedDelaySec: "45m"
      auto_update_linux_exclude:
        - "vim"


- name: "Molecule | Converge | Set auto_update_linux_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'match', '^auto_update_linux_')
      | ansible.builtin.list
    }}


- name: "Molecule | Converge | Include the foundata.linux.auto_update role"
  ansible.builtin.include_role:
    name: "foundata.linux.auto_update"
  # vars: All auto_update_linux_* variables are set as facts and passed this way
  #       to the role. This enables persisting the values in __testing_state and
  #       restoring them in later stages (e.g. verify) without manually
  #       duplicating data across playbooks.
