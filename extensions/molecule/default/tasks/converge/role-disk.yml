# Execute the collection role "disk" against all driver-created instances.
# The libvirt platforms attach two blank extra disks (see molecule.yml,
# "extra_disks"), addressable as /dev/disk/by-id/virtio-molecule-data0/1.


# Seeded BEFORE the first role run while the mountpoint is still a plain
# directory on the root filesystem: exercises the on_nonempty "copy"
# migration. Idempotent, so the (then migrated) content is simply confirmed
# on later runs.
- name: "Molecule | Converge | disk | Seed content below the future mountpoints"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=rx,o=rx" # 0755
  loop:
    - "/srv/molecule_data0/subdir"
    # the ext4 destination: covers the copy migration onto a fresh ext4
    # filesystem (mkfs-created lost+found must not abort it)
    - "/srv/molecule_data1"


- name: "Molecule | Converge | disk | Seed files below the future mountpoint"
  ansible.builtin.copy:
    dest: "{{ item['dest'] }}"
    content: "{{ item['content'] }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  loop:
    - dest: "/srv/molecule_data0/seeded.txt"
      content: "seeded before the first mount\n"
    - dest: "/srv/molecule_data0/.hidden_seed"
      content: "hidden seed\n"
    - dest: "/srv/molecule_data0/subdir/nested_seed.txt"
      content: "nested seed\n"
    # the ext4 destination: covers the copy migration onto a fresh ext4
    # filesystem (mkfs-created lost+found must not abort it)
    - dest: "/srv/molecule_data1/seeded-ext4.txt"
      content: "molecule ext4 migration content\n"
  loop_control:
    label: "{{ item['dest'] }}"


# --- Mismatch fixture -------------------------------------------------------
# A foreign signature directly on the whole disk (no partition table) is the
# simplest mismatch class, and mkswap is available everywhere (util-linux
# core). Seeded only while the disk is blank: on the idempotence run the disk
# already carries the role-created layout (converted via on_mismatch "wipe"
# below), so seeding and the negative check are skipped and stay out of the
# idempotence accounting.
- name: "Molecule | Converge | disk | Query the third extra disk"
  ansible.builtin.command:
    argv:
      - "lsblk"
      - "--json"
      - "--output"
      - "NAME,PTTYPE,FSTYPE"
      - "/dev/disk/by-id/virtio-molecule-data2"
  changed_when:
    - false
  register: __testing_disk_data2_lsblk_result


- name: "Molecule | Converge | disk | Derive the third disk's state"
  ansible.builtin.set_fact:
    __testing_disk_data2_blank: >-
      {{
        (__testing_disk_data2_dev['pttype'] is ansible.builtin.none)
        and (__testing_disk_data2_dev['fstype'] is ansible.builtin.none)
        and ((__testing_disk_data2_dev['children'] | ansible.builtin.default([]) | ansible.builtin.length) == 0)
      }}
    __testing_disk_data2_swap: "{{ __testing_disk_data2_dev['fstype'] == 'swap' }}"
  vars:
    __testing_disk_data2_dev: >-
      {{ (__testing_disk_data2_lsblk_result['stdout'] | ansible.builtin.from_json)['blockdevices'][0] }}


- name: "Molecule | Converge | disk | Seed a foreign signature on the third disk"
  ansible.builtin.command:
    argv:
      - "mkswap"
      - "/dev/disk/by-id/virtio-molecule-data2"
  when:
    - __testing_disk_data2_blank | ansible.builtin.bool
  changed_when:
    - true


# Runs BEFORE the disk_linux_* facts are set below: include_role vars (task
# vars) would lose against already-set facts otherwise.
- name: "Molecule | Converge | disk | Negative check: on_mismatch fail must refuse the foreign disk"
  when:
    - (__testing_disk_data2_blank | ansible.builtin.bool) or (__testing_disk_data2_swap | ansible.builtin.bool)
  block:

    - name: "Molecule | Converge | disk | Run the role against the foreign disk (must fail)"
      ansible.builtin.include_role:
        name: "foundata.linux.disk"
      vars:
        disk_linux_devices:
          - device: "/dev/disk/by-id/virtio-molecule-data2"
            mount:
              path: "/srv/molecule_data2"


    - name: "Molecule | Converge | disk | Fail because the role accepted the foreign disk"
      ansible.builtin.fail:
        msg: "The role accepted a disk with a foreign signature although on_mismatch is fail."

  rescue:

    - name: "Molecule | Converge | disk | Assert the failure is the expected mismatch refusal"
      ansible.builtin.assert:
        that:
          - "'contradicts the declared layout' in (ansible_failed_result['msg'] | ansible.builtin.default(''))"
        fail_msg: >-
          The role failed for an unexpected reason:
          {{ ansible_failed_result['msg'] | ansible.builtin.default('(no message)') }}
        success_msg: "The role refused the foreign disk with the expected mismatch message."


- name: "Molecule | Converge | disk | Store disk_linux_* role parameters in __testing_state"
  ansible.builtin.include_tasks:
    file: "../tasks/state_update.yml"
  vars:
    __testing_state_update:
      disk_linux_device_defaults:
        mount:
          options: "defaults,noatime"
      disk_linux_devices:
        # defaults path: GPT, XFS, options inherited from the defaults dict,
        # one-time content migration of the seeded files
        - device: "/dev/disk/by-id/virtio-molecule-data0"
          mount:
            path: "/srv/molecule_data0"
            on_nonempty: "copy"
        # explicit path: ext4 with creation-time options, boot-time fsck,
        # per-entry mount options override; on_nonempty "copy" onto a FRESH
        # ext4 filesystem on purpose (regression: the emptiness check
        # classified the mkfs-created lost+found as foreign data and aborted
        # the migration; the XFS entry above cannot cover this)
        - device: "/dev/disk/by-id/virtio-molecule-data1"
          filesystem:
            type: "ext4"
            mkfs_options: "-m 1"
          mount:
            path: "/srv/molecule_data1"
            options: "defaults,noatime,nodev"
            passno: 2
            on_nonempty: "copy"
        # repurposing path: the foreign signature seeded above is wiped and
        # the disk set up per declaration (single-run on_mismatch "wipe");
        # on later runs the disk conforms and the setting is a no-op
        - device: "/dev/disk/by-id/virtio-molecule-data2"
          on_mismatch: "wipe"
          mount:
            path: "/srv/molecule_data2"
        # optional disk that is not attached to any instance: on_missing skip
        - device: "/dev/disk/by-id/virtio-molecule-missing0"
          on_missing: "skip"
          mount:
            path: "/srv/molecule_missing"


- name: "Molecule | Converge | disk | Set disk_linux_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^disk_linux_')
      | ansible.builtin.list
    }}


- name: "Molecule | Converge | disk | Include the foundata.linux.disk role"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
  # vars: All disk_linux_* variables are set as facts and passed this way to
  #       the role, so they can be persisted in __testing_state and restored in
  #       later stages (e.g. verify) without duplicating data across playbooks.
