# Variables for the sysctl profile "router_v6only"
#
# Like the "router" profile, but forwards IPv6 only and explicitly DISABLES IPv4
# forwarding. The off-direction is set to 0 (not omitted) on purpose: the
# declarative drop-in then actively enforces "IPv4 forwarding off" instead of
# merely leaving it unmanaged at the kernel default. See router.md for the full
# reasoning; only the forwarding keys differ from "router".
#
# This profile targets routing function; for the shared security hardening,
# stack the "hardening-default" profile (usually first), e.g.
# sysctl_linux_profile: ["hardening-default", "router_v6only"].
#
# Auto-calculated values are Jinja expressions based on
# ansible_facts['memtotal_mb'] (RAM in MiB), evaluated when the profile is
# loaded. Override any value via sysctl_linux_parameters; set it to null to
# unmanage it.

---

# Kernel modules this profile depends on. nf_conntrack provides the
# net.netfilter.nf_conntrack_* keys below; it is loaded best-effort by
# tasks/init.yml (tolerated if unavailable, e.g. in containers).
__sysctl_linux_profile_modules:
  - "nf_conntrack"


__sysctl_linux_profile_parameters:

  ## IP forwarding (IPv6 only; IPv4 explicitly disabled)

  "net.ipv4.ip_forward": 0
  "net.ipv4.conf.all.forwarding": 0
  "net.ipv4.conf.default.forwarding": 0
  "net.ipv6.conf.all.forwarding": 1
  "net.ipv6.conf.default.forwarding": 1

  ## Connection tracking (auto-calculated, requires nf_conntrack)

  # ~32 tracked connections per MiB of RAM for a forwarding device.
  "net.netfilter.nf_conntrack_max": "{{ (ansible_facts['memtotal_mb'] | ansible.builtin.int) * 32 }}"
  # Hash buckets = conntrack_max / 4 (i.e. RAM_MiB * 8). Note: the canonical way
  # to size the hash table is the nf_conntrack `hashsize` module parameter at
  # load time; this sysctl resizes it after load on current kernels. The TCP
  # established/TIME_WAIT timeouts are left at their kernel defaults (they are
  # not tuned here); see router.md for UDP timeouts relevant to VPN/NAT.
  "net.netfilter.nf_conntrack_buckets": "{{ (ansible_facts['memtotal_mb'] | ansible.builtin.int) * 8 }}"

  ## Neighbor tables (ARP / NDP)

  # Larger GC thresholds so the ARP/ND caches do not thrash with many peers.
  "net.ipv4.neigh.default.gc_thresh1": 1024
  "net.ipv4.neigh.default.gc_thresh2": 4096
  "net.ipv4.neigh.default.gc_thresh3": 8192
  "net.ipv6.neigh.default.gc_thresh1": 1024
  "net.ipv6.neigh.default.gc_thresh2": 4096
  "net.ipv6.neigh.default.gc_thresh3": 8192

  ## Reverse path filtering (router-specific, not part of hardening-default)

  # Loose mode (2): a forwarding device frequently has asymmetric routes, where
  # strict mode (1) would wrongly drop valid packets. Still rejects packets with
  # an unroutable source. The kernel uses max(conf.all, conf.<iface>).
  "net.ipv4.conf.all.rp_filter": 2
  "net.ipv4.conf.default.rp_filter": 2
