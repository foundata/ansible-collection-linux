# Check collection role "disk" outcomes.

- name: "Molecule | Verify | disk | Initialize the foundata.linux.disk role (expose internal vars without running it)"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
    tasks_from: "init"
    public: true


- name: "Molecule | Verify | disk | Set disk_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(disk_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | disk | Query the mounted filesystems"
  ansible.builtin.command:
    argv:
      - "findmnt"
      - "--json"
      - "--output"
      - "TARGET,SOURCE,FSTYPE,OPTIONS"
      - "--mountpoint"
      - "{{ item }}"
  changed_when:
    - false
  loop:
    - "/srv/molecule_data0"
    - "/srv/molecule_data1"
    - "/srv/molecule_data2"
  register: __testing_disk_findmnt_result


- name: "Molecule | Verify | disk | Assert the filesystems are mounted as declared"
  ansible.builtin.assert:
    that:
      - __testing_disk_mounts['/srv/molecule_data0']['fstype'] == 'xfs'
      - "'noatime' in __testing_disk_mounts['/srv/molecule_data0']['options']"
      - __testing_disk_mounts['/srv/molecule_data1']['fstype'] == 'ext4'
      - "'noatime' in __testing_disk_mounts['/srv/molecule_data1']['options']"
      - "'nodev' in __testing_disk_mounts['/srv/molecule_data1']['options']"
      # the repurposed disk (foreign signature wiped via on_mismatch)
      - __testing_disk_mounts['/srv/molecule_data2']['fstype'] == 'xfs'
      - "'noatime' in __testing_disk_mounts['/srv/molecule_data2']['options']"
    fail_msg: "The declared filesystems are not mounted as expected: {{ __testing_disk_mounts }}"
    success_msg: "All declared filesystems are mounted with the expected type and options."
  vars:
    __testing_disk_mounts: >-
      {%- set __ns = namespace(map={}) -%}
      {%- for __r in __testing_disk_findmnt_result['results'] -%}
      {%-   set __row = (__r['stdout'] | ansible.builtin.from_json)['filesystems'][0] -%}
      {%-   set _ = __ns.map.update({__r['item']: __row}) -%}
      {%- endfor -%}
      {{ __ns.map }}


- name: "Molecule | Verify | disk | Query the disk layout"
  ansible.builtin.command:
    argv:
      - "lsblk"
      - "--json"
      - "--output"
      # NAME must be present: lsblk only nests "children" in its JSON when
      # the NAME column is part of the output
      - "NAME,KNAME,TYPE,PTTYPE,FSTYPE"
      - "{{ item }}"
  changed_when:
    - false
  loop:
    - "/dev/disk/by-id/virtio-molecule-data0"
    - "/dev/disk/by-id/virtio-molecule-data1"
    - "/dev/disk/by-id/virtio-molecule-data2"
  register: __testing_disk_lsblk_result


- name: "Molecule | Verify | disk | Assert the on-disk layout matches the declaration"
  ansible.builtin.assert:
    that:
      # GPT (the built-in default) on every disk, exactly one partition each
      - __testing_disk_layouts[0]['pttype'] == 'gpt'
      - (__testing_disk_layouts[0]['children'] | ansible.builtin.length) == 1
      - __testing_disk_layouts[0]['children'][0]['fstype'] == 'xfs'
      - __testing_disk_layouts[1]['pttype'] == 'gpt'
      - (__testing_disk_layouts[1]['children'] | ansible.builtin.length) == 1
      - __testing_disk_layouts[1]['children'][0]['fstype'] == 'ext4'
      # the repurposed disk: foreign swap signature gone, declared layout in place
      - __testing_disk_layouts[2]['pttype'] == 'gpt'
      - (__testing_disk_layouts[2]['children'] | ansible.builtin.length) == 1
      - __testing_disk_layouts[2]['children'][0]['fstype'] == 'xfs'
    fail_msg: "The on-disk layout does not match the declaration: {{ __testing_disk_layouts }}"
    success_msg: "All disks carry a GPT with exactly one partition and the declared filesystem."
  vars:
    __testing_disk_layouts: >-
      {%- set __ns = namespace(rows=[]) -%}
      {%- for __r in __testing_disk_lsblk_result['results'] -%}
      {%-   set _ = __ns.rows.append((__r['stdout'] | ansible.builtin.from_json)['blockdevices'][0]) -%}
      {%- endfor -%}
      {{ __ns.rows }}


- name: "Molecule | Verify | disk | Read /etc/fstab"
  ansible.builtin.slurp:
    src: "/etc/fstab"
  register: __testing_disk_fstab_result


- name: "Molecule | Verify | disk | Assert the /etc/fstab entries (UUID source, fields, no leftovers)"
  ansible.builtin.assert:
    that:
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data0') | ansible.builtin.length) == 1
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data1') | ansible.builtin.length) == 1
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data2') | ansible.builtin.length) == 1
      - __testing_disk_fstab_data0['source'] is ansible.builtin.match('^UUID=')
      - __testing_disk_fstab_data1['source'] is ansible.builtin.match('^UUID=')
      - __testing_disk_fstab_data1['passno'] == '2'
      # the skipped optional disk must not leave any trace
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_missing') | ansible.builtin.length) == 0
    fail_msg: "The /etc/fstab entries do not match the declaration: {{ __testing_disk_fstab_rows }}"
    success_msg: "Both filesystems are registered in /etc/fstab by UUID with the declared fields."
  vars:
    __testing_disk_fstab_rows: >-
      {%- set __ns = namespace(rows=[]) -%}
      {%- for __l in (__testing_disk_fstab_result['content'] | ansible.builtin.b64decode).splitlines() -%}
      {%-   set __t = __l.strip() -%}
      {%-   if __t and not __t.startswith('#') -%}
      {%-     set __f = __t.split() -%}
      {%-     if (__f | ansible.builtin.length) >= 6 -%}
      {%-       set _ = __ns.rows.append({'source': __f[0], 'target': __f[1], 'passno': __f[5]}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.rows }}
    __testing_disk_fstab_data0: >-
      {{ __testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data0') | ansible.builtin.first }}
    __testing_disk_fstab_data1: >-
      {{ __testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data1') | ansible.builtin.first }}


- name: "Molecule | Verify | disk | Validate /etc/fstab as a whole"
  ansible.builtin.command:
    argv:
      - "findmnt"
      - "--verify"
  changed_when:
    - false


- name: "Molecule | Verify | disk | Determine the state of the migrated content and the marker"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/srv/molecule_data0/seeded.txt"
    - "/srv/molecule_data0/.hidden_seed"
    - "/srv/molecule_data0/subdir/nested_seed.txt"
    - "/srv/molecule_data0/.ansible-disk-migration-in-progress"
    - "/srv/molecule_missing"
  register: __testing_disk_stat_result


- name: "Molecule | Verify | disk | Assert the migration outcome"
  ansible.builtin.assert:
    that:
      # the seeded content was migrated onto the new filesystem
      - __testing_disk_stat_result['results'][0]['stat']['exists']
      - __testing_disk_stat_result['results'][1]['stat']['exists']
      - __testing_disk_stat_result['results'][2]['stat']['exists']
      # no in-progress marker was left behind
      - not __testing_disk_stat_result['results'][3]['stat']['exists']
    fail_msg: "The on_nonempty copy migration did not produce the expected content."
    success_msg: "The seeded content was migrated onto the new filesystem, no marker was left behind."


- name: "Molecule | Verify | disk | Determine the device of the parent filesystem"
  ansible.builtin.stat:
    path: "/srv"
  register: __testing_disk_root_stat_result


- name: "Molecule | Verify | disk | Assert the migrated content is not shadowed on the parent filesystem"
  ansible.builtin.assert:
    that:
      # the device number of the file differs from the parent filesystem's,
      # so the content lives on the mounted disk, not below the mount
      - __testing_disk_stat_result['results'][0]['stat']['dev'] != __testing_disk_root_stat_result['stat']['dev']
    fail_msg: "The migrated content does not reside on the mounted filesystem."
    success_msg: "The migrated content resides on the mounted filesystem, not on the parent."


## Copy migration onto the fresh ext4 filesystem

- name: "Molecule | Verify | disk | Read the migrated ext4 content"
  ansible.builtin.slurp:
    src: "/srv/molecule_data1/seeded-ext4.txt"
  register: __testing_disk_ext4_migrated


- name: "Molecule | Verify | disk | Query the ext4 mount"
  ansible.builtin.command:
    argv: ["findmnt", "--noheadings", "--output", "FSTYPE", "/srv/molecule_data1"]
  changed_when:
    - false
  register: __testing_disk_ext4_mount


- name: "Molecule | Verify | disk | Assert the ext4 migration succeeded despite lost+found"
  ansible.builtin.assert:
    that:
      - (__testing_disk_ext4_migrated['content'] | ansible.builtin.b64decode) is ansible.builtin.search('molecule ext4 migration content')
      - "'ext4' in __testing_disk_ext4_mount['stdout']"
    fail_msg: >-
      The copy migration onto the fresh ext4 filesystem failed or the content
      did not arrive (regression: the mkfs-created lost+found used to abort
      it as foreign data).
    success_msg: "The copy migration onto the fresh ext4 filesystem succeeded."


## Busy-tree protection of on_mismatch "wipe"

# The mounted, role-managed data0 disk deliberately gets a CONTRADICTING
# declaration (ext4 instead of its actual XFS) with on_mismatch "wipe": the
# preflight must classify the mismatch and then refuse the wipe because the
# disk's tree is mounted - before anything was changed.
- name: "Molecule | Verify | disk | Busy wipe: attempt a mismatch wipe of a mounted disk"
  block:

    - name: "Molecule | Verify | disk | Busy wipe: include the role with a contradicting declaration"
      ansible.builtin.include_role:
        name: "foundata.linux.disk"
      vars:
        disk_linux_devices:
          - device: "/dev/disk/by-id/virtio-molecule-data0"
            filesystem:
              type: "ext4"
            mount:
              path: "/srv/molecule_data0"
            on_mismatch: "wipe"

    - name: "Molecule | Verify | disk | Busy wipe: record that the wipe was accepted"
      ansible.builtin.set_fact:
        __testing_disk_busywipe_rejected: false

  rescue:

    - name: "Molecule | Verify | disk | Busy wipe: record that the wipe was rejected"
      ansible.builtin.set_fact:
        __testing_disk_busywipe_rejected: true


- name: "Molecule | Verify | disk | Busy wipe: check the filesystem survived"
  ansible.builtin.command:
    argv: ["findmnt", "--noheadings", "--output", "FSTYPE", "/srv/molecule_data0"]
  changed_when:
    - false
  register: __testing_disk_busywipe_fstype


- name: "Molecule | Verify | disk | Busy wipe: assert the mounted tree was protected"
  ansible.builtin.assert:
    that:
      - __testing_disk_busywipe_rejected | ansible.builtin.bool
      - "'xfs' in __testing_disk_busywipe_fstype['stdout']"
    fail_msg: >-
      on_mismatch "wipe" was not refused on a mounted device tree (rejected:
      {{ __testing_disk_busywipe_rejected }}, filesystem now:
      {{ __testing_disk_busywipe_fstype['stdout'] }}).
    success_msg: "A mismatch wipe on a mounted device tree is refused before mutation."


## Check mode on the deployed state
#
# A --check run must succeed as a dry run (regression: the read-only
# discovery probes were skipped in check mode and their missing results
# dereferenced) and must not change anything on disk; /etc/fstab is the
# witness (its state must be identical before and after).

- name: "Molecule | Verify | disk | Check mode: get information about /etc/fstab (before)"
  ansible.builtin.stat:
    path: "/etc/fstab"
  register: __testing_disk_checkmode_fstab_before


- name: "Molecule | Verify | disk | Run the role in check mode on the deployed state"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
    apply:
      check_mode: true


- name: "Molecule | Verify | disk | Check mode: get information about /etc/fstab (after)"
  ansible.builtin.stat:
    path: "/etc/fstab"
  register: __testing_disk_checkmode_fstab_after


- name: "Molecule | Verify | disk | Check mode: assert nothing was changed"
  ansible.builtin.assert:
    that:
      - __testing_disk_checkmode_fstab_after['stat']['checksum'] == __testing_disk_checkmode_fstab_before['stat']['checksum']
    fail_msg: "The check-mode run changed /etc/fstab on disk."
    success_msg: "The check-mode run succeeded as a dry run without changing the deployed state."
