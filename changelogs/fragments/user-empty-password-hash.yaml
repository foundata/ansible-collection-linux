---
security_fixes:
  - >
    user role - an empty (but defined) ``password.hash`` no longer creates a
    passwordless account. ``ansible.builtin.default(omit)`` only omits an
    *undefined* value, so an empty hash (for example from a vault lookup that
    returned nothing) was passed to the ``user`` module as ``password: ""``,
    which writes an empty crypt field and allows password-less login. The
    parameter is now omitted for an empty hash, leaving the account's password
    unmanaged.
