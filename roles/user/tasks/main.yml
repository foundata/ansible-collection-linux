# Main entry point for the role.

---

- name: "Main | Include role initialization tasks"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/init.yml"
    apply:
      tags:
        - "always"
        - "user_linux_always"
  tags:
    - "always"
    - "user_linux_always"


# Separate includes for platform-specific files and default.yml on purpose. When
# looping over "platform files + ['default.yml']" for multiple platforms in one
# play, Ansible batches them across all hosts. Insertion order depends on when
# results arrive (non-deterministic behavior) and default.yml may run before the
# platform-specific files. Separate tasks enforce the required barrier.

- name: "Main | Include configuration tasks: best platform matches (if any)"
  ansible.builtin.include_tasks:
    file: "{{ __user_linux_task_file }}"
    apply:
      tags:
        - "user_linux_config"
  vars:
    __user_linux_task_file: "{{ role_path }}/tasks/config/{{ __user_linux_loop_item }}"
  when:
    - __user_linux_task_file is ansible.builtin.file
  loop: "{{ __user_linux_platform_filenames_most_specific_first }}"
  loop_control:
    loop_var: "__user_linux_loop_item"
  tags:
    - "user_linux_config"

- name: "Main | Include configuration tasks: default"
  ansible.builtin.include_tasks:
    file: "{{ __user_linux_task_file }}"
    apply:
      tags:
        - "user_linux_config"
  vars:
    __user_linux_task_file: "{{ role_path }}/tasks/config/default.yml"
  when:
    - __user_linux_task_file is ansible.builtin.file
  tags:
    - "user_linux_config"
