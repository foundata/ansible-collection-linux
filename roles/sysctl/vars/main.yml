# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# List of facts used by the role (gathered on a best-effort basis if needed).
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
#
# These are "gather_subset" tokens for ansible.builtin.setup (not raw fact key
# names). The "hardware" token is required because profile auto-calculation
# (vars/profiles/*.yml) derives values from ansible_facts['memtotal_mb'], which
# is only provided by "hardware" (there is no fine-grained memory token).
__sysctl_linux_used_facts:
  # from subset "distribution"
  - "distribution"
  - "distribution_major_version"
  - "distribution_version"
  - "os_family"
  # from subset "virtual"
  - "virtualization_role"
  - "virtualization_type"
  # from subset "hardware" (provides memtotal_mb and processor_* for profiles)
  - "hardware"


# Concrete ansible_facts key names the role actually consumes. Used to decide
# whether facts must be (re)gathered: unlike __sysctl_linux_used_facts (which
# contains gather_subset tokens like "hardware" that are never fact keys), every
# entry here is a real key in ansible_facts, so it can be checked for presence.
__sysctl_linux_required_fact_keys:
  - "distribution"
  - "distribution_major_version"
  - "distribution_version"
  - "os_family"
  - "virtualization_role"
  - "virtualization_type"
  - "memtotal_mb"


# List of platforms this role supports and was designed for.
#
# A warning will be issued if the list contains values and the role is executed
# on an unknown (not listed) platform, but execution will continue. Example:
#
# - name: "Fedora" # A ansible_facts value ('distribution' or 'os_family')
#   versions: # A ansible_facts value ('distribution_major_version' or
#     - "all" # 'distribution_version') or "all"
# - name: "Ubuntu"
#   versions:
#     - "22.04"
#     - "24.04"
# - name: "RedHat"
#   versions:
#     - "all"
# - name: "Debian"
#   versions:
#     - "all"
__sysctl_linux_supported_platforms:
  - name: "Debian"
    versions:
      - "12"
      - "13"
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "openSUSE Leap"
    versions:
      - "16.0"
  - name: "RedHat" # includes AlmaLinux, Rocky and CentOS Stream
    versions:
      - "9"
      - "10"
  - name: "Ubuntu"
    versions:
      - "22.04"
      - "24.04"
      - "26.04"


# List of package names to be installed when sysctl_linux_state is
# set to "present".
__sysctl_linux_packages_install:
  - "procps"


# List of package names to be uninstalled when sysctl_linux_state is
# set to "absent". This variable is useful when __sysctl_linux_packages_install
# contains packages that are required for the managed software to function but
# should not be removed during uninstallation, as doing so could break other
# software. This is usually the case if there are common dependencies like
# "curl" or "openssl" which typically should remain installed even after
# uninstalling the software managed by this role.
__sysctl_linux_packages_uninstall: []


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__sysctl_linux_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__sysctl_linux_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__sysctl_linux_paths_neutralize: {}


# Configuration file paths, ownership, and permissions. These variables define
# the different locations of configuration files, include directories, and
# Ansible-managed files, ensuring consistent file handling across distributions.
__sysctl_linux_config_file_path: "/etc/sysctl.conf"
__sysctl_linux_config_file_owner: "root"
__sysctl_linux_config_file_group: "root"
__sysctl_linux_config_file_mode: "u=rw,g=r,o=r" # 0644

# The path is not a user-configurable variable because the sysctl drop-in path
# is fixed (cf. sysctl(8)).
__sysctl_linux_config_dropin_dir_path: "/etc/sysctl.d"
__sysctl_linux_config_dropin_dir_owner: "root"
__sysctl_linux_config_dropin_dir_group: "root"
__sysctl_linux_config_dropin_dir_mode: "u=rwx,g=rx,o=rx" # 0755

__sysctl_linux_config_dropin_file_path: "{{ __sysctl_linux_config_dropin_dir_path }}/{{ sysctl_linux_config_dropin_file_name }}"
__sysctl_linux_config_dropin_file_path_default: "{{ __sysctl_linux_config_dropin_dir_path }}/90-managed.conf" # needed to detect non-default names
__sysctl_linux_config_dropin_file_owner: "{{ __sysctl_linux_config_file_owner }}"
__sysctl_linux_config_dropin_file_group: "{{ __sysctl_linux_config_file_group }}"
__sysctl_linux_config_dropin_file_mode: "{{ __sysctl_linux_config_file_mode }}"


# Executable paths
__sysctl_linux_sysctl_executable: "/usr/sbin/sysctl"


# Kernel modules required by the selected profile (e.g. "nf_conntrack" for the
# router profiles, "br_netfilter" for virtualization). The default is empty; a
# profile overrides it via vars/profiles/<profile>.yml (include_vars outranks
# this file). tasks/init.yml loads them on a best-effort basis so module-
# dependent kernel parameters (net.netfilter.*, net.bridge.*) can be set.
__sysctl_linux_profile_modules: []


# Memory page size in bytes, used by profile auto-calculation for parameters
# expressed in pages (e.g. kernel.shmall). There is no Ansible fact for it, so
# tasks/init.yml overrides this default with the value reported by
# "getconf PAGE_SIZE" when a profile that needs it is selected. The 4096 default
# is the common x86_64 / aarch64 (4K) page size and a safe fallback.
__sysctl_linux_page_size: 4096


# Effective sysctl parameters: the profile parameters (loaded on demand by
# tasks/init.yml from vars/profile/<profile>.yml into
# __sysctl_linux_profile_parameters) merged with the user-supplied
# sysctl_linux_parameters, the latter taking precedence. Both operands are
# guarded with default({}) so this resolves even when no profile is selected
# (the profile include_vars is conditional) and when the user sets no
# parameters.
#
# Lazy / late-bound evaluation: Jinja renders this variable on access,
# after tasks/init.yml loads the platform vars file that sets the inputs.
__sysctl_linux_effective_parameters: >-
  {{
    (__sysctl_linux_profile_parameters | ansible.builtin.default({}))
    | ansible.builtin.combine(sysctl_linux_parameters | ansible.builtin.default({}))
  }}


### Override defaults of dependencies used by this role (if any).

# nothing right now
