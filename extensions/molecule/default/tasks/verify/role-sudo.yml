# Check collection role "sudo" outcomes.

- name: "Molecule | Verify | sudo | Initialize the foundata.linux.sudo role (expose internal vars without running it)"
  ansible.builtin.include_role:
    name: "foundata.linux.sudo"
    tasks_from: "init"
    public: true


- name: "Molecule | Verify | sudo | Set sudo_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(sudo_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | sudo | Rebuild the expected per-grantee drop-in basenames"
  # Reconstruct the filenames the role builds: "<prefix><rule>-<type>-<sanitized
  # grantee, capped>-<sha1(original grantee)[:8]>". Kept in sync with
  # roles/sudo/tasks/config/default.yml on purpose so a scheme change is caught.
  ansible.builtin.set_fact:
    __testing_sudo_grantees: >-
      {%- set __ns = namespace(items=[]) -%}
      {%- for __e in [
            {'rule': 'molecule_admins', 'type': 'group', 'grantee': 'molecule_sudoadmins'},
            {'rule': 'molecule_deploy', 'type': 'user', 'grantee': 'molecule_deployer'},
            {'rule': 'molecule_multi', 'type': 'user', 'grantee': 'molecule_deployer'},
            {'rule': 'molecule_multi', 'type': 'group', 'grantee': 'molecule_sudoadmins'},
            {'rule': 'molecule_defaultcmd', 'type': 'user', 'grantee': 'molecule_deployer'},
            {'rule': 'molecule_dotted', 'type': 'user', 'grantee': 'molecule.dotuser'},
          ] -%}
      {%-   set _ = __ns.items.append(__e | ansible.builtin.combine({
              'file': __sudo_linux_dropin_prefix ~ __e['rule'] ~ '-' ~ __e['type'] ~ '-'
                      ~ (__e['grantee'] | ansible.builtin.regex_replace('[^A-Za-z0-9_-]', '_'))[:40]
                      ~ '-' ~ (__e['grantee'] | ansible.builtin.hash('sha1'))[:8]})) -%}
      {%- endfor -%}
      {{ __ns.items }}


- name: "Molecule | Verify | sudo | Stat the managed drop-in files (one per grantee plus the global Defaults file)"
  ansible.builtin.stat:
    path: "{{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_basename }}"
  register: __testing_sudo_dropins
  loop: >-
    {{
      (__testing_sudo_grantees | ansible.builtin.map(attribute='file') | ansible.builtin.list)
      + [__sudo_linux_dropin_prefix ~ 'defaults']
    }}
  loop_control:
    loop_var: "__sudo_linux_dropin_basename"


- name: "Molecule | Verify | sudo | Assert every managed drop-in exists with root:root ownership and mode 0440"
  ansible.builtin.assert:
    that:
      - __sudo_linux_dropin_stat['stat']['exists']
      - __sudo_linux_dropin_stat['stat']['pw_name'] == __sudo_linux_dropin_file_owner
      - __sudo_linux_dropin_stat['stat']['gr_name'] == __sudo_linux_dropin_file_group
      - __sudo_linux_dropin_stat['stat']['mode'] == '0440'
    fail_msg: "Drop-in '{{ __sudo_linux_dropin_stat['__sudo_linux_dropin_basename'] }}' is missing or has unexpected ownership/permissions."
    success_msg: "Drop-in '{{ __sudo_linux_dropin_stat['__sudo_linux_dropin_basename'] }}' exists with root:root and mode 0440."
  loop: "{{ __testing_sudo_dropins['results'] }}"
  loop_control:
    loop_var: "__sudo_linux_dropin_stat"
    label: "{{ __sudo_linux_dropin_stat['__sudo_linux_dropin_basename'] }}"


- name: "Molecule | Verify | sudo | Read the drop-in of the grantee with a dotted name"
  ansible.builtin.slurp:
    src: >-
      {{ __sudo_linux_dropin_dir }}/{{
        (__testing_sudo_grantees | ansible.builtin.selectattr('rule', 'ansible.builtin.match', '^molecule_dotted$')
         | ansible.builtin.map(attribute='file') | ansible.builtin.first)
      }}
  register: __testing_sudo_dotted


- name: "Molecule | Verify | sudo | Assert the dotted grantee is filename-safe yet grants the real name"
  vars:
    __testing_sudo_dotted_file: >-
      {{
        __testing_sudo_grantees | ansible.builtin.selectattr('rule', 'ansible.builtin.match', '^molecule_dotted$')
        | ansible.builtin.map(attribute='file') | ansible.builtin.first
      }}
  ansible.builtin.assert:
    that:
      # The filename is sudo-safe: the dot is gone, replaced in the readable stem.
      - "'.' not in __testing_sudo_dotted_file"
      - "'molecule_dotuser' in __testing_sudo_dotted_file"
      # The rule itself still targets the real, dotted account.
      - "'molecule.dotuser ' in (__testing_sudo_dotted['content'] | ansible.builtin.b64decode)"
    fail_msg: "The dotted grantee drop-in is not sanitized correctly or does not grant the real name."
    success_msg: "The dotted grantee has a sudo-safe filename '{{ __testing_sudo_dotted_file }}' and grants 'molecule.dotuser'."


- name: "Molecule | Verify | sudo | Read the drop-in of the rule that relies on rule_defaults for commands"
  ansible.builtin.slurp:
    src: >-
      {{ __sudo_linux_dropin_dir }}/{{
        (__testing_sudo_grantees | ansible.builtin.selectattr('rule', 'ansible.builtin.match', '^molecule_defaultcmd$')
         | ansible.builtin.map(attribute='file') | ansible.builtin.first)
      }}
  register: __testing_sudo_defaultcmd


- name: "Molecule | Verify | sudo | Assert a command supplied via rule_defaults was rendered"
  ansible.builtin.assert:
    that:
      - "'/usr/bin/uptime' in (__testing_sudo_defaultcmd['content'] | ansible.builtin.b64decode)"
    fail_msg: "The rule relying on rule_defaults for 'commands' did not render the default command."
    success_msg: "A 'commands' value supplied via sudo_linux_rule_defaults was validated and rendered."


- name: "Molecule | Verify | sudo | Stat the drop-in of the 'absent' rule"
  ansible.builtin.stat:
    path: >-
      {{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_prefix }}molecule_legacy_absent-group-molecule_sudoadmins-{{
        ('molecule_sudoadmins' | ansible.builtin.hash('sha1'))[:8]
      }}
  register: __testing_sudo_absent


- name: "Molecule | Verify | sudo | Assert the 'absent' rule has no drop-in"
  ansible.builtin.assert:
    that:
      - not __testing_sudo_absent['stat']['exists']
    fail_msg: "The drop-in for the 'absent' rule still exists."
    success_msg: "The 'absent' rule has no drop-in, as expected."


- name: "Molecule | Verify | sudo | Stat the seeded orphan role-managed drop-in"
  ansible.builtin.stat:
    path: "{{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_prefix }}molecule_orphan-user-ghost-deadbeef"
  register: __testing_sudo_orphan


- name: "Molecule | Verify | sudo | Assert the orphaned role-managed drop-in was cleaned up"
  ansible.builtin.assert:
    that:
      - not __testing_sudo_orphan['stat']['exists']
    fail_msg: "The orphaned '99_managed_*' drop-in was not removed; namespace cleanup did not run."
    success_msg: "The orphaned '99_managed_*' drop-in was removed by the namespace cleanup."


- name: "Molecule | Verify | sudo | Read the global Defaults / extra_content drop-in"
  ansible.builtin.slurp:
    src: "{{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_prefix }}defaults"
  register: __testing_sudo_defaults


- name: "Molecule | Verify | sudo | Assert the global Defaults and extra_content were rendered"
  vars:
    __testing_sudo_defaults_content: "{{ __testing_sudo_defaults['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      - "'Defaults env_reset' in __testing_sudo_defaults_content"
      - "'Defaults timestamp_timeout=15' in __testing_sudo_defaults_content"
      # verbatim sudo_linux_extra_content (a qualified Defaults the list cannot express)
      - "'Defaults:molecule_deployer env_keep += \"MOLECULE_CANARY\"' in __testing_sudo_defaults_content"
    fail_msg: "The global Defaults drop-in does not contain the expected directives."
    success_msg: "The global Defaults drop-in contains the expected directives and extra_content."


- name: "Molecule | Verify | sudo | Validate every managed drop-in with visudo -cf (non-zero rc fails the task)"
  ansible.builtin.command:
    cmd: "{{ __sudo_linux_visudo_exec_path }} -cf {{ __sudo_linux_dropin_dir }}/{{ __sudo_linux_dropin_basename }}"
  changed_when: false
  loop: >-
    {{
      (__testing_sudo_grantees | ansible.builtin.map(attribute='file') | ansible.builtin.list)
      + [__sudo_linux_dropin_prefix ~ 'defaults']
    }}
  loop_control:
    loop_var: "__sudo_linux_dropin_basename"
