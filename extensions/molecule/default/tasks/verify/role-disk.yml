# Check collection role "disk" outcomes.

- name: "Molecule | Verify | disk | Initialize the foundata.linux.disk role (expose internal vars without running it)"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
    tasks_from: "init"
    public: true


- name: "Molecule | Verify | disk | Set disk_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(disk_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | disk | Query the mounted filesystems"
  ansible.builtin.command:
    argv:
      - "findmnt"
      - "--json"
      - "--output"
      - "TARGET,SOURCE,FSTYPE,OPTIONS"
      - "--mountpoint"
      - "{{ item }}"
  changed_when:
    - false
  loop:
    - "/srv/molecule_data0"
    - "/srv/molecule_data1"
    - "/srv/molecule_data2"
  register: __testing_disk_findmnt_result


- name: "Molecule | Verify | disk | Assert the filesystems are mounted as declared"
  ansible.builtin.assert:
    that:
      - __testing_disk_mounts['/srv/molecule_data0']['fstype'] == 'xfs'
      - "'noatime' in __testing_disk_mounts['/srv/molecule_data0']['options']"
      - __testing_disk_mounts['/srv/molecule_data1']['fstype'] == 'ext4'
      - "'noatime' in __testing_disk_mounts['/srv/molecule_data1']['options']"
      - "'nodev' in __testing_disk_mounts['/srv/molecule_data1']['options']"
      # the repurposed disk (foreign signature wiped via on_mismatch)
      - __testing_disk_mounts['/srv/molecule_data2']['fstype'] == 'xfs'
      - "'noatime' in __testing_disk_mounts['/srv/molecule_data2']['options']"
    fail_msg: "The declared filesystems are not mounted as expected: {{ __testing_disk_mounts }}"
    success_msg: "All declared filesystems are mounted with the expected type and options."
  vars:
    __testing_disk_mounts: >-
      {%- set __ns = namespace(map={}) -%}
      {%- for __r in __testing_disk_findmnt_result['results'] -%}
      {%-   set __row = (__r['stdout'] | ansible.builtin.from_json)['filesystems'][0] -%}
      {%-   set _ = __ns.map.update({__r['item']: __row}) -%}
      {%- endfor -%}
      {{ __ns.map }}


- name: "Molecule | Verify | disk | Query the disk layout"
  ansible.builtin.command:
    argv:
      - "lsblk"
      - "--json"
      - "--output"
      # NAME must be present: lsblk only nests "children" in its JSON when
      # the NAME column is part of the output
      - "NAME,KNAME,TYPE,PTTYPE,FSTYPE"
      - "{{ item }}"
  changed_when:
    - false
  loop:
    - "/dev/disk/by-id/virtio-molecule-data0"
    - "/dev/disk/by-id/virtio-molecule-data1"
    - "/dev/disk/by-id/virtio-molecule-data2"
  register: __testing_disk_lsblk_result


- name: "Molecule | Verify | disk | Assert the on-disk layout matches the declaration"
  ansible.builtin.assert:
    that:
      # GPT (the built-in default) on every disk, exactly one partition each
      - __testing_disk_layouts[0]['pttype'] == 'gpt'
      - (__testing_disk_layouts[0]['children'] | ansible.builtin.length) == 1
      - __testing_disk_layouts[0]['children'][0]['fstype'] == 'xfs'
      - __testing_disk_layouts[1]['pttype'] == 'gpt'
      - (__testing_disk_layouts[1]['children'] | ansible.builtin.length) == 1
      - __testing_disk_layouts[1]['children'][0]['fstype'] == 'ext4'
      # the repurposed disk: foreign swap signature gone, declared layout in place
      - __testing_disk_layouts[2]['pttype'] == 'gpt'
      - (__testing_disk_layouts[2]['children'] | ansible.builtin.length) == 1
      - __testing_disk_layouts[2]['children'][0]['fstype'] == 'xfs'
    fail_msg: "The on-disk layout does not match the declaration: {{ __testing_disk_layouts }}"
    success_msg: "All disks carry a GPT with exactly one partition and the declared filesystem."
  vars:
    __testing_disk_layouts: >-
      {%- set __ns = namespace(rows=[]) -%}
      {%- for __r in __testing_disk_lsblk_result['results'] -%}
      {%-   set _ = __ns.rows.append((__r['stdout'] | ansible.builtin.from_json)['blockdevices'][0]) -%}
      {%- endfor -%}
      {{ __ns.rows }}


- name: "Molecule | Verify | disk | Read /etc/fstab"
  ansible.builtin.slurp:
    src: "/etc/fstab"
  register: __testing_disk_fstab_result


- name: "Molecule | Verify | disk | Assert the /etc/fstab entries (UUID source, fields, no leftovers)"
  ansible.builtin.assert:
    that:
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data0') | ansible.builtin.length) == 1
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data1') | ansible.builtin.length) == 1
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data2') | ansible.builtin.length) == 1
      - __testing_disk_fstab_data0['source'] is ansible.builtin.match('^UUID=')
      - __testing_disk_fstab_data1['source'] is ansible.builtin.match('^UUID=')
      - __testing_disk_fstab_data1['passno'] == '2'
      # the skipped optional disk must not leave any trace
      - (__testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_missing') | ansible.builtin.length) == 0
    fail_msg: "The /etc/fstab entries do not match the declaration: {{ __testing_disk_fstab_rows }}"
    success_msg: "Both filesystems are registered in /etc/fstab by UUID with the declared fields."
  vars:
    __testing_disk_fstab_rows: >-
      {%- set __ns = namespace(rows=[]) -%}
      {%- for __l in (__testing_disk_fstab_result['content'] | ansible.builtin.b64decode).splitlines() -%}
      {%-   set __t = __l.strip() -%}
      {%-   if __t and not __t.startswith('#') -%}
      {%-     set __f = __t.split() -%}
      {%-     if (__f | ansible.builtin.length) >= 6 -%}
      {%-       set _ = __ns.rows.append({'source': __f[0], 'target': __f[1], 'passno': __f[5]}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.rows }}
    __testing_disk_fstab_data0: >-
      {{ __testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data0') | ansible.builtin.first }}
    __testing_disk_fstab_data1: >-
      {{ __testing_disk_fstab_rows | ansible.builtin.selectattr('target', 'ansible.builtin.equalto', '/srv/molecule_data1') | ansible.builtin.first }}


- name: "Molecule | Verify | disk | Validate /etc/fstab as a whole"
  ansible.builtin.command:
    argv:
      - "findmnt"
      - "--verify"
  changed_when:
    - false


- name: "Molecule | Verify | disk | Determine the state of the migrated content and the marker"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "/srv/molecule_data0/seeded.txt"
    - "/srv/molecule_data0/.hidden_seed"
    - "/srv/molecule_data0/subdir/nested_seed.txt"
    - "/srv/molecule_data0/.ansible-disk-migration-in-progress"
    - "/srv/molecule_missing"
  register: __testing_disk_stat_result


- name: "Molecule | Verify | disk | Assert the migration outcome"
  ansible.builtin.assert:
    that:
      # the seeded content was migrated onto the new filesystem
      - __testing_disk_stat_result['results'][0]['stat']['exists']
      - __testing_disk_stat_result['results'][1]['stat']['exists']
      - __testing_disk_stat_result['results'][2]['stat']['exists']
      # no in-progress marker was left behind
      - not __testing_disk_stat_result['results'][3]['stat']['exists']
    fail_msg: "The on_nonempty copy migration did not produce the expected content."
    success_msg: "The seeded content was migrated onto the new filesystem, no marker was left behind."


- name: "Molecule | Verify | disk | Determine the device of the parent filesystem"
  ansible.builtin.stat:
    path: "/srv"
  register: __testing_disk_root_stat_result


- name: "Molecule | Verify | disk | Assert the migrated content is not shadowed on the parent filesystem"
  ansible.builtin.assert:
    that:
      # the device number of the file differs from the parent filesystem's,
      # so the content lives on the mounted disk, not below the mount
      - __testing_disk_stat_result['results'][0]['stat']['dev'] != __testing_disk_root_stat_result['stat']['dev']
    fail_msg: "The migrated content does not reside on the mounted filesystem."
    success_msg: "The migrated content resides on the mounted filesystem, not on the parent."


## Copy migration onto the fresh ext4 filesystem

- name: "Molecule | Verify | disk | Read the migrated ext4 content"
  ansible.builtin.slurp:
    src: "/srv/molecule_data1/seeded-ext4.txt"
  register: __testing_disk_ext4_migrated


- name: "Molecule | Verify | disk | Query the ext4 mount"
  ansible.builtin.command:
    argv: ["findmnt", "--noheadings", "--output", "FSTYPE", "/srv/molecule_data1"]
  changed_when:
    - false
  register: __testing_disk_ext4_mount


- name: "Molecule | Verify | disk | Assert the ext4 migration succeeded despite lost+found"
  ansible.builtin.assert:
    that:
      - (__testing_disk_ext4_migrated['content'] | ansible.builtin.b64decode) is ansible.builtin.search('molecule ext4 migration content')
      - "'ext4' in __testing_disk_ext4_mount['stdout']"
    fail_msg: >-
      The copy migration onto the fresh ext4 filesystem failed or the content
      did not arrive (regression: the mkfs-created lost+found used to abort
      it as foreign data).
    success_msg: "The copy migration onto the fresh ext4 filesystem succeeded."


## Busy-tree protection of on_mismatch "wipe"

# The mounted, role-managed data0 disk deliberately gets a CONTRADICTING
# declaration (ext4 instead of its actual XFS) with on_mismatch "wipe": the
# preflight must classify the mismatch and then refuse the wipe because the
# disk's tree is mounted - before anything was changed.
- name: "Molecule | Verify | disk | Busy wipe: attempt a mismatch wipe of a mounted disk"
  block:

    - name: "Molecule | Verify | disk | Busy wipe: include the role with a contradicting declaration"
      ansible.builtin.include_role:
        name: "foundata.linux.disk"
      vars:
        disk_linux_devices:
          - device: "/dev/disk/by-id/virtio-molecule-data0"
            filesystem:
              type: "ext4"
            mount:
              path: "/srv/molecule_data0"
            on_mismatch: "wipe"

    - name: "Molecule | Verify | disk | Busy wipe: record that the wipe was accepted"
      ansible.builtin.set_fact:
        __testing_disk_busywipe_rejected: false

  rescue:

    - name: "Molecule | Verify | disk | Busy wipe: record that the wipe was rejected"
      ansible.builtin.set_fact:
        __testing_disk_busywipe_rejected: true


- name: "Molecule | Verify | disk | Busy wipe: check the filesystem survived"
  ansible.builtin.command:
    argv: ["findmnt", "--noheadings", "--output", "FSTYPE", "/srv/molecule_data0"]
  changed_when:
    - false
  register: __testing_disk_busywipe_fstype


- name: "Molecule | Verify | disk | Busy wipe: assert the mounted tree was protected"
  ansible.builtin.assert:
    that:
      - __testing_disk_busywipe_rejected | ansible.builtin.bool
      - "'xfs' in __testing_disk_busywipe_fstype['stdout']"
    fail_msg: >-
      on_mismatch "wipe" was not refused on a mounted device tree (rejected:
      {{ __testing_disk_busywipe_rejected }}, filesystem now:
      {{ __testing_disk_busywipe_fstype['stdout'] }}).
    success_msg: "A mismatch wipe on a mounted device tree is refused before mutation."


## Multi-device Btrfs system-disk protection (loop devices)

- name: "Molecule | Verify | disk | Btrfs: install tooling and create two loop devices"
  ansible.builtin.shell:
    cmd: |
      set -eu
      command -v mkfs.btrfs >/dev/null 2>&1 || {
        (command -v apt-get >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get -qq install -y btrfs-progs) \
        || (command -v dnf >/dev/null && dnf -q -y install btrfs-progs) \
        || zypper -q -n install btrfsprogs
      } >/dev/null 2>&1
      mkdir -p /var/tmp/molecule-loops /mnt/molecule-btrfs
      truncate -s 200M /var/tmp/molecule-loops/btrfs0.img /var/tmp/molecule-loops/btrfs1.img
      L0=$(losetup --find --show /var/tmp/molecule-loops/btrfs0.img)
      L1=$(losetup --find --show /var/tmp/molecule-loops/btrfs1.img)
      mkfs.btrfs -f -d single -m single "$L0" "$L1" >/dev/null
      mount "$L0" /mnt/molecule-btrfs
      printf '%s %s\n' "$L0" "$L1"
  args:
    executable: "/bin/bash"
  register: __testing_disk_btrfs_setup
  changed_when:
    - true


- name: "Molecule | Verify | disk | Btrfs: set the loop device facts"
  ansible.builtin.set_fact:
    __testing_disk_btrfs_loops: "{{ __testing_disk_btrfs_setup['stdout_lines'][-1].split() }}"


# Declaring EITHER member has to be rejected: the second member is a peer of
# the mount source, not an ancestor (regression: only the source's ancestors
# were protected).
- name: "Molecule | Verify | disk | Btrfs: reset the attempt results"
  ansible.builtin.set_fact:
    __testing_attempt_results: []


- name: "Molecule | Verify | disk | Btrfs: attempt to manage each member of the critical filesystem"
  ansible.builtin.include_tasks:
    file: "../helpers/disk-attempt.yml"
  vars:
    __testing_attempt_critical:
      - "/mnt/molecule-btrfs"
    __testing_attempt_devices:
      - device: "{{ __testing_disk_btrfs_member }}"
        mount:
          path: "/srv/molecule-btrfs-member"
  loop: "{{ __testing_disk_btrfs_loops }}"
  loop_control:
    loop_var: "__testing_disk_btrfs_member"


- name: "Molecule | Verify | disk | Btrfs: assert both members are protected"
  ansible.builtin.assert:
    that:
      - __testing_attempt_results == [true, true]
    fail_msg: >-
      A member of the critical multi-device Btrfs filesystem passed the
      system-disk safeguard (rejections: {{ __testing_attempt_results }}).
    success_msg: "Both Btrfs members are protected, peers included."


- name: "Molecule | Verify | disk | Btrfs: tear the loop filesystem down again"
  ansible.builtin.shell:
    cmd: |
      set -u
      umount /mnt/molecule-btrfs || true
      for l in {{ __testing_disk_btrfs_loops | ansible.builtin.join(' ') }}; do losetup -d "$l" || true; done
      rm -rf /var/tmp/molecule-loops /mnt/molecule-btrfs
  args:
    executable: "/bin/bash"
  changed_when:
    - true


## Atomic wipe refusal on an active unmounted stack (loop device + LUKS)

- name: "Molecule | Verify | disk | LUKS: build a two-partition loop disk with an open unmounted mapping"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      command -v cryptsetup >/dev/null 2>&1 || {
        (command -v apt-get >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get -qq install -y cryptsetup) \
        || (command -v dnf >/dev/null && dnf -q -y install cryptsetup) \
        || zypper -q -n install cryptsetup
      } >/dev/null 2>&1
      mkdir -p /var/tmp/molecule-loops
      # sparse; >=512M so the role-created partition stays above the
      # mkfs.xfs 300MB minimum in the final wipe-succeeds step
      truncate -s 512M /var/tmp/molecule-loops/luks.img
      L=$(losetup --find --show --partscan /var/tmp/molecule-loops/luks.img)
      parted --script "$L" mklabel gpt mkpart p1 ext4 1MiB 50% mkpart p2 ext4 50% 100%
      udevadm settle || true
      mkfs.ext4 -q "${L}p1"
      echo -n "molecule-luks-pass" | cryptsetup luksFormat --batch-mode --pbkdf pbkdf2 --pbkdf-force-iterations 1000 "${L}p2" -
      echo -n "molecule-luks-pass" | cryptsetup open "${L}p2" molecule-luks-hold -
      blkid --match-tag UUID --output value "${L}p1"
      echo "$L"
  args:
    executable: "/bin/bash"
  register: __testing_disk_luks_setup
  changed_when:
    - true


- name: "Molecule | Verify | disk | LUKS: set the fixture facts"
  ansible.builtin.set_fact:
    __testing_disk_luks_loop: "{{ __testing_disk_luks_setup['stdout_lines'][-1] }}"
    __testing_disk_luks_p1_uuid: "{{ __testing_disk_luks_setup['stdout_lines'][-2] }}"


# The mismatch wipe and the absent wipe must both refuse the disk while the
# unmounted LUKS mapping holds partition 2, and partition 1's signature has
# to survive the refusal untouched (atomic failure, nothing partially wiped).
- name: "Molecule | Verify | disk | LUKS: reset the attempt results"
  ansible.builtin.set_fact:
    __testing_attempt_results: []


- name: "Molecule | Verify | disk | LUKS: attempt a mismatch wipe and an absent wipe of the held disk"
  ansible.builtin.include_tasks:
    file: "../helpers/disk-attempt.yml"
  vars:
    __testing_attempt_devices:
      - "{{ __testing_disk_luks_declaration }}"
  loop:
    - device: "{{ __testing_disk_luks_loop }}"
      on_mismatch: "wipe"
      mount:
        path: "/srv/molecule-luks-test"
    - device: "{{ __testing_disk_luks_loop }}"
      state: "absent"
      wipe: true
      mount:
        path: "/srv/molecule-luks-test"
  loop_control:
    loop_var: "__testing_disk_luks_declaration"
    label: "{{ __testing_disk_luks_declaration['state'] | ansible.builtin.default('present') }}"


- name: "Molecule | Verify | disk | LUKS: read partition 1's signature after the refusals"
  ansible.builtin.command:
    argv: ["blkid", "--match-tag", "UUID", "--output", "value", "{{ __testing_disk_luks_loop }}p1"]
  register: __testing_disk_luks_p1_after
  changed_when:
    - false


- name: "Molecule | Verify | disk | LUKS: assert both wipes were refused atomically"
  ansible.builtin.assert:
    that:
      - __testing_attempt_results == [true, true]
      # nothing was partially wiped before the refusal
      - __testing_disk_luks_p1_after['stdout'] == __testing_disk_luks_p1_uuid
    fail_msg: >-
      A wipe of the LUKS-held disk was not refused atomically (rejections:
      {{ __testing_attempt_results }}, p1 UUID before:
      {{ __testing_disk_luks_p1_uuid }}, after:
      {{ __testing_disk_luks_p1_after['stdout'] }}).
    success_msg: "Both wipe paths refuse the held disk before touching any signature."


- name: "Molecule | Verify | disk | LUKS: close the mapping"
  ansible.builtin.command:
    argv: ["cryptsetup", "close", "molecule-luks-hold"]
  changed_when:
    - true


- name: "Molecule | Verify | disk | LUKS: repeat the mismatch wipe on the now-inactive disk"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
  vars:
    disk_linux_devices:
      - device: "{{ __testing_disk_luks_loop }}"
        on_mismatch: "wipe"
        mount:
          path: "/srv/molecule-luks-test"


- name: "Molecule | Verify | disk | LUKS: assert the inactive disk was repurposed"
  ansible.builtin.command:
    argv: ["findmnt", "--noheadings", "--output", "SOURCE", "/srv/molecule-luks-test"]
  register: __testing_disk_luks_mounted
  changed_when:
    - false
  failed_when:
    - __testing_disk_luks_loop not in __testing_disk_luks_mounted['stdout']


- name: "Molecule | Verify | disk | LUKS: tear the fixture down again"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
  vars:
    disk_linux_devices:
      - device: "{{ __testing_disk_luks_loop }}"
        state: "absent"
        mount:
          path: "/srv/molecule-luks-test"


- name: "Molecule | Verify | disk | LUKS: release the loop device"
  ansible.builtin.shell:
    cmd: |
      set -u
      losetup -d {{ __testing_disk_luks_loop }} || true
      rm -rf /var/tmp/molecule-loops
      rmdir /srv/molecule-luks-test 2>/dev/null || true
  args:
    executable: "/bin/bash"
  changed_when:
    - true


## Migration staging path safety
#
# Regression: the copy migration staged at the fixed path
# /mnt/.disk-migration; a foreign directory or mount already sitting there
# was unmounted and recursively deleted by the staging cleanup. The staging
# area is a unique per-run directory now, so a foreign /mnt/.disk-migration
# must survive a copy migration completely untouched, mount included.

- name: "Molecule | Verify | disk | Staging: plant a foreign mount at the old fixed staging path"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p /var/tmp/molecule-loops
      truncate -s 64M /var/tmp/molecule-loops/foreignstage.img
      mkfs.ext4 -q /var/tmp/molecule-loops/foreignstage.img
      FL=$(losetup --find --show /var/tmp/molecule-loops/foreignstage.img)
      mkdir -p /mnt/.disk-migration
      mount "$FL" /mnt/.disk-migration
      echo "foreign canary" > /mnt/.disk-migration/canary.txt
      truncate -s 512M /var/tmp/molecule-loops/stagemig.img
      ML=$(losetup --find --show /var/tmp/molecule-loops/stagemig.img)
      wipefs --all "$ML" >/dev/null
      partx --delete "$ML" >/dev/null 2>&1 || true
      blockdev --flushbufs "$ML"
      blockdev --rereadpt "$ML" >/dev/null 2>&1 || true
      mkdir -p /srv/molecule-stage-test
      echo "staged content" > /srv/molecule-stage-test/seeded.txt
      echo "$FL"
      echo "$ML"
  args:
    executable: "/bin/bash"
  register: __testing_disk_staging_setup
  changed_when:
    - true


- name: "Molecule | Verify | disk | Staging: pick up the loop device names"
  ansible.builtin.set_fact:
    __testing_disk_staging_foreign_loop: "{{ __testing_disk_staging_setup['stdout_lines'][-2] }}"
    __testing_disk_staging_migration_loop: "{{ __testing_disk_staging_setup['stdout_lines'][-1] }}"


- name: "Molecule | Verify | disk | Staging: run a copy migration"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
  vars:
    disk_linux_devices:
      - device: "{{ __testing_disk_staging_migration_loop }}"
        mount:
          path: "/srv/molecule-stage-test"
          on_nonempty: "copy"


- name: "Molecule | Verify | disk | Staging: query the migrated mount and the foreign mount"
  ansible.builtin.command:
    argv: ["findmnt", "--noheadings", "--output", "SOURCE", "{{ item }}"]
  register: __testing_disk_staging_mounts
  changed_when:
    - false
  loop:
    - "/srv/molecule-stage-test"
    - "/mnt/.disk-migration"


- name: "Molecule | Verify | disk | Staging: get information about the migrated and the foreign content"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_disk_staging_files
  loop:
    - "/srv/molecule-stage-test/seeded.txt"
    - "/mnt/.disk-migration/canary.txt"


- name: "Molecule | Verify | disk | Staging: assert the migration worked and the foreign mount survived"
  ansible.builtin.assert:
    that:
      # the copy migration itself succeeded onto the new filesystem
      - __testing_disk_staging_migration_loop in __testing_disk_staging_mounts['results'][0]['stdout']
      - __testing_disk_staging_files['results'][0]['stat']['exists'] | ansible.builtin.bool
      # the foreign mount at the old fixed path is still mounted and intact
      - __testing_disk_staging_foreign_loop in __testing_disk_staging_mounts['results'][1]['stdout']
      - __testing_disk_staging_files['results'][1]['stat']['exists'] | ansible.builtin.bool
    fail_msg: >-
      The copy migration touched a foreign /mnt/.disk-migration (mounts:
      {{ __testing_disk_staging_mounts['results'] | ansible.builtin.map(attribute='stdout') | ansible.builtin.list }}).
    success_msg: >-
      The copy migration used its own staging directory; the foreign mount
      and its content survived untouched.


- name: "Molecule | Verify | disk | Staging: tear the migrated fixture down again"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
  vars:
    disk_linux_devices:
      - device: "{{ __testing_disk_staging_migration_loop }}"
        state: "absent"
        mount:
          path: "/srv/molecule-stage-test"


- name: "Molecule | Verify | disk | Staging: release the fixtures"
  ansible.builtin.shell:
    cmd: |
      set -u
      umount /mnt/.disk-migration || true
      rmdir /mnt/.disk-migration 2>/dev/null || true
      for l in {{ __testing_disk_staging_foreign_loop }} {{ __testing_disk_staging_migration_loop }}; do
        partx --delete "$l" >/dev/null 2>&1 || true
        losetup -d "$l" || true
      done
      rm -rf /var/tmp/molecule-loops
      rm -rf /srv/molecule-stage-test
  args:
    executable: "/bin/bash"
  changed_when:
    - true


## Check mode on the deployed state
#
# A --check run must succeed as a dry run (regression: the read-only
# discovery probes were skipped in check mode and their missing results
# dereferenced) and must not change anything on disk; /etc/fstab is the
# witness (its state must be identical before and after).

- name: "Molecule | Verify | disk | Check mode: get information about /etc/fstab (before)"
  ansible.builtin.stat:
    path: "/etc/fstab"
  register: __testing_disk_checkmode_fstab_before


- name: "Molecule | Verify | disk | Run the role in check mode on the deployed state"
  ansible.builtin.include_role:
    name: "foundata.linux.disk"
    apply:
      check_mode: true


- name: "Molecule | Verify | disk | Check mode: get information about /etc/fstab (after)"
  ansible.builtin.stat:
    path: "/etc/fstab"
  register: __testing_disk_checkmode_fstab_after


- name: "Molecule | Verify | disk | Check mode: assert nothing was changed"
  ansible.builtin.assert:
    that:
      - __testing_disk_checkmode_fstab_after['stat']['checksum'] == __testing_disk_checkmode_fstab_before['stat']['checksum']
    fail_msg: "The check-mode run changed /etc/fstab on disk."
    success_msg: "The check-mode run succeeded as a dry run without changing the deployed state."
