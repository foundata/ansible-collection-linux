# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Manage systemd timer drop-in (schedule)"
  when:
    - auto_update_linux_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - (__auto_update_linux_systemd_timer_unit_name | ansible.builtin.length) > 0
  block:

    - name: "Config | Default | Ensure systemd timer override directory exists"
      ansible.builtin.file:
        path: "{{ __auto_update_linux_systemd_timer_unit_dropin_dir_path }}"
        state: "directory"
        owner: "{{ __auto_update_linux_systemd_timer_unit_dropin_dir_owner }}"
        group: "{{ __auto_update_linux_systemd_timer_unit_dropin_dir_group }}"
        mode: "{{ __auto_update_linux_systemd_timer_unit_dropin_dir_mode }}"
      notify:
        - "auto_update_linux: systemd daemon-reload"

    - name: "Config | Default | Create systemd timer drop-in config file"
      ansible.builtin.template:
        src: "systemd_timer.conf.j2"
        dest: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}"
        owner: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_owner }}"
        group: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_group }}"
        mode: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_mode }}"
      vars:
        # Pass (and/or adjust) variables needed for the template
        tpl_timer_settings: "{{ __auto_update_linux_effective_timer_settings }}"
      notify:
        - "auto_update_linux: systemd daemon-reload"


- name: "Config | Default | Remove role-managed systemd timer drop-in when unmanaged"
  # override is removed to allow the vendor timer schedule takes over
  ansible.builtin.file:
    path: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}"
    state: "absent"
  when:
    - auto_update_linux_service_state == 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - (__auto_update_linux_systemd_timer_unit_name | ansible.builtin.length) > 0
  notify:
    - "auto_update_linux: systemd daemon-reload"


- name: "Config | Default | Warn about unsupported service manager for timer configuration"
  ansible.builtin.debug:
    msg: >-
      Automatic update timer management is only supported with systemd as service manager.
      The current service manager '{{ ansible_facts['service_mgr'] }}' is not supported;
      the platform's  default scheduling mechanism remains unchanged.
  when:
    - auto_update_linux_service_state != 'unmanaged'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) != 'systemd'


# Scheduled reboot (auto_update_linux_reboot == "scheduled"): role-managed
# systemd units + helper script that reboot the host when needed, at a
# controlled time. Cross-platform (systemd), hence handled here in default.yml.
# The timer's enable/run state is managed in tasks/service/default.yml.

- name: "Config | Default | Install scheduled reboot timer resources (auto_update_linux_reboot is scheduled)"
  when:
    - auto_update_linux_reboot == 'scheduled'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  block:

    # The script mirrors the checks used by the foundata.linux.reboot role
    # (task "Init | Determine if reboot is required") and handles tool/OS
    # portability internally, so a single script covers all supported platforms.
    - name: "Config | Default | Install reboot-if-needed helper script"
      ansible.builtin.template:
        src: "reboot-if-needed.j2"
        dest: "{{ __auto_update_linux_reboot_script_path }}"
        owner: "{{ __auto_update_linux_reboot_script_owner }}"
        group: "{{ __auto_update_linux_reboot_script_group }}"
        mode: "{{ __auto_update_linux_reboot_script_mode }}"


    - name: "Config | Default | Install scheduled reboot service unit"
      ansible.builtin.template:
        src: "auto-update-reboot.service.j2"
        dest: "{{ __auto_update_linux_reboot_service_unit_path }}"
        owner: "{{ __auto_update_linux_reboot_unit_file_owner }}"
        group: "{{ __auto_update_linux_reboot_unit_file_group }}"
        mode: "{{ __auto_update_linux_reboot_unit_file_mode }}"
      notify:
        - "auto_update_linux: systemd daemon-reload"


    - name: "Config | Default | Install scheduled reboot timer unit"
      ansible.builtin.template:
        src: "auto-update-reboot.timer.j2"
        dest: "{{ __auto_update_linux_reboot_timer_unit_path }}"
        owner: "{{ __auto_update_linux_reboot_unit_file_owner }}"
        group: "{{ __auto_update_linux_reboot_unit_file_group }}"
        mode: "{{ __auto_update_linux_reboot_unit_file_mode }}"
      vars:
        # Pass (and/or adjust) variables needed for the template
        tpl_reboot_timer_settings: "{{ __auto_update_linux_effective_reboot_timer_settings }}"
      notify:
        - "auto_update_linux: systemd daemon-reload"


- name: "Config | Default | Remove scheduled reboot timer resources (auto_update_linux_reboot is not scheduled)"
  when:
    - auto_update_linux_reboot != 'scheduled'
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  block:

    - name: "Config | Default | Check whether the scheduled reboot timer unit exists"
      ansible.builtin.stat:
        path: "{{ __auto_update_linux_reboot_timer_unit_path }}"
      register: __auto_update_linux_reboot_timer_unit_stat


    - name: "Config | Default | Disable and stop the scheduled reboot timer (if present)"
      ansible.builtin.systemd_service:
        name: "{{ __auto_update_linux_reboot_timer_unit_name }}"
        enabled: false
        state: "stopped"
      when:
        - __auto_update_linux_reboot_timer_unit_stat['stat']['exists'] | ansible.builtin.default(false)


    - name: "Config | Default | Remove scheduled reboot timer units and helper script"
      ansible.builtin.file:
        path: "{{ __auto_update_linux_reboot_timer_item }}"
        state: "absent"
      loop:
        - "{{ __auto_update_linux_reboot_timer_unit_path }}"
        - "{{ __auto_update_linux_reboot_service_unit_path }}"
        - "{{ __auto_update_linux_reboot_script_path }}"
      loop_control:
        loop_var: "__auto_update_linux_reboot_timer_item"
        label: "{{ __auto_update_linux_reboot_timer_item }}"
      notify:
        - "auto_update_linux: systemd daemon-reload"
