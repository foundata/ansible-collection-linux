# Check collection role "user" outcomes.


- name: "Molecule | Verify | user | Initialize the foundata.linux.user role (expose internal vars without running it)"
  ansible.builtin.include_role:
    name: "foundata.linux.user"
    tasks_from: "init"
    public: true


- name: "Molecule | Verify | user | Set user_linux_* and __testing_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'match', '^(user_linux_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | user | Gather the passwd and group databases"
  ansible.builtin.getent:
    database: "{{ item }}"
  loop:
    - "passwd"
    - "group"


- name: "Molecule | Verify | user | Assert accounts and groups are in their expected state"
  ansible.builtin.assert:
    that:
      # managed accounts exist
      - "'molecule_testuser1' in ansible_facts['getent_passwd']"
      - "ansible_facts['getent_passwd']['molecule_testuser1'][1] == '4001'"
      - "'molecule_testuser2' in ansible_facts['getent_passwd']"
      - "'molecule_keyuser' in ansible_facts['getent_passwd']"
      # supplementary group membership
      - "'molecule_testuser1' in (ansible_facts['getent_group']['molecule_testops'][2] | ansible.builtin.default(''))"
      - "ansible_facts['getent_group']['molecule_testops'][1] == '4321'"
      - "'molecule_testfree' in ansible_facts['getent_group']"
      # absent account and group were removed
      - "'molecule_obsolete' not in ansible_facts['getent_passwd']"
      - "'molecule_legacy_absent' not in ansible_facts['getent_group']"
      # reaping removed the unmanaged in-range account, kept the excluded one
      - "'molecule_reapme' not in ansible_facts['getent_passwd']"
      - "'molecule_keepme' in ansible_facts['getent_passwd']"
      # the connection user is always protected from reaping
      - "ansible_facts['user_id'] in ansible_facts['getent_passwd']"
    fail_msg: "Accounts or groups are not in the expected state after running the role."
    success_msg: "All accounts and groups are in the expected state."


- name: "Molecule | Verify | user | Stat the home directory of molecule_testuser1"
  ansible.builtin.stat:
    path: "/home/molecule_testuser1"
  register: __testing_user_home


- name: "Molecule | Verify | user | Assert molecule_testuser1 home directory exists"
  ansible.builtin.assert:
    that:
      - __testing_user_home['stat']['exists']
      - __testing_user_home['stat']['isdir']
    fail_msg: "The home directory '/home/molecule_testuser1' does not exist."
    success_msg: "The home directory '/home/molecule_testuser1' exists."


- name: "Molecule | Verify | user | Read authorized_keys of molecule_testuser1"
  ansible.builtin.slurp:
    src: "/home/molecule_testuser1/.ssh/authorized_keys"
  register: __testing_user1_keys


- name: "Molecule | Verify | user | Read authorized_keys of molecule_keyuser"
  ansible.builtin.slurp:
    src: "/home/molecule_keyuser/.ssh/authorized_keys"
  register: __testing_keyuser_keys


- name: "Molecule | Verify | user | Assert authorized_keys content (managed keys present, options applied, stray purged)"
  vars:
    __testing_user1_ak: "{{ __testing_user1_keys['content'] | ansible.builtin.b64decode }}"
    __testing_keyuser_ak: "{{ __testing_keyuser_keys['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # both managed keys for testuser1 are present
      - "'AAAAC3NzaC1lZDI1NTE5AAAAILcYoZILzNQaw72LxKdK9he97yaQ02wbnWWntBmrk6ry' in __testing_user1_ak"
      - "'AAAAC3NzaC1lZDI1NTE5AAAAIMULmKMeqE3+4OVsbn6Ec0/sCQDJc8ktt6zfFIYyHzLV' in __testing_user1_ak"
      # the per-key options were rendered onto the line
      - "'from=\"10.0.0.0/8\"' in __testing_user1_ak"
      # keyuser keeps the managed key but the stray key was purged (exclusive)
      - "'AAAAC3NzaC1lZDI1NTE5AAAAIKR6FdXomFQ1h6RmzQxN4GWmqgV/GXE9RNOBh0iMQgEQ' in __testing_keyuser_ak"
      - "'AAAAC3NzaC1lZDI1NTE5AAAAILmFhCG3dipt7baMWEJOo9chtWBt+rpTsltkYcnd4jcu' not in __testing_keyuser_ak"
    fail_msg: "The authorized_keys files do not match the expected managed state."
    success_msg: "All authorized_keys files contain exactly the expected managed keys."
