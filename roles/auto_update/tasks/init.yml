# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __auto_update_linux_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__auto_update_linux_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__auto_update_linux_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __auto_update_linux_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is version_compare(__auto_update_linux_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__auto_update_linux_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __auto_update_linux_supported_platforms }}
  vars:
    __auto_update_linux_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __auto_update_linux_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __auto_update_linux_matched_versions: >-
      {{
        __auto_update_linux_supported_platforms
        | ansible.builtin.selectattr('name', 'match', __auto_update_linux_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('match', __auto_update_linux_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__auto_update_linux_supported_platforms | ansible.builtin.length) > 0
    - (__auto_update_linux_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __auto_update_linux_platform_filenames_raw:
      - "{{ __auto_update_linux_dist }}_{{ __auto_update_linux_dist_ver }}.yml"
      - "{{ __auto_update_linux_dist }}_{{ __auto_update_linux_dist_major }}.yml"
      - "{{ __auto_update_linux_dist }}.yml"
      - "{{ __auto_update_linux_os_family }}.yml"
  vars:
    __auto_update_linux_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __auto_update_linux_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __auto_update_linux_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __auto_update_linux_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __auto_update_linux_platform_filenames_most_specific_first: >-
      {{
        (__auto_update_linux_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __auto_update_linux_platform_filenames_most_specific_last: >-
      {{
        __auto_update_linux_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __auto_update_linux_vars_file }}"
  vars:
    __auto_update_linux_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __auto_update_linux_vars_file is ansible.builtin.file
  loop: "{{ __auto_update_linux_platform_filenames_most_specific_last }}"


### auto_update specific


- name: "Init | Show effective merged variables (computed lazily in vars/main.yml)"
  ansible.builtin.debug:
    msg: "{{ __auto_update_linux_effective_var }} = {{ lookup('ansible.builtin.vars', __auto_update_linux_effective_var) }}"
    verbosity: 3
  loop:
    - "__auto_update_linux_effective_timer_settings"
    - "__auto_update_linux_effective_reboot_timer_settings"
  loop_control:
    loop_var: "__auto_update_linux_effective_var"
    label: "{{ __auto_update_linux_effective_var }}"


# The timer templates accept a list for the repeatable trigger directives and
# render one assignment per item. Everything else must be a scalar: a list for a
# non-repeatable directive, an empty list, or a boolean/mapping for a trigger
# would otherwise be stringified into an invalid systemd value, or produce an
# enabled timer with no trigger at all.
- name: "Init | Assert the timer settings use supported value types"
  ansible.builtin.assert:
    that:
      - (__auto_update_linux_timer_value_offenders_0 | ansible.builtin.length) == 0
      - (__auto_update_linux_timer_value_offenders_1 | ansible.builtin.length) == 0
    fail_msg: >-
      Unsupported timer setting value(s):
      {{ (__auto_update_linux_timer_value_offenders_0
          + __auto_update_linux_timer_value_offenders_1) | ansible.builtin.join(', ') }}.
      Repeatable trigger directives ({{ __auto_update_linux_timer_trigger_directives | ansible.builtin.join(', ') }})
      take a string or a non-empty list of strings, all other directives take a scalar.
    success_msg: "All timer settings use supported value types."
  vars:
    __auto_update_linux_timer_trigger_directives:
      - "OnCalendar"
      - "OnActiveSec"
      - "OnBootSec"
      - "OnStartupSec"
      - "OnUnitActiveSec"
      - "OnUnitInactiveSec"
    __auto_update_linux_timer_value_offenders_0: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for k, v in (__auto_update_linux_effective_timer_settings | ansible.builtin.default({})).items() -%}
      {%-   set is_list = (v is ansible.builtin.iterable)
                           and (v is not ansible.builtin.string)
                           and (v is not ansible.builtin.mapping) -%}
      {%-   if is_list and (k not in __auto_update_linux_timer_trigger_directives) -%}
      {%-     set _ = ns.items.append(k ~ " (a list is only supported for the repeatable trigger directives)") -%}
      {%-   elif is_list and ((v | ansible.builtin.length) == 0) -%}
      {%-     set _ = ns.items.append(k ~ " (empty list: configure at least one value or omit the directive)") -%}
      {%-   elif (k in __auto_update_linux_timer_trigger_directives)
                  and ((v is ansible.builtin.boolean) or (v is ansible.builtin.mapping)) -%}
      {%-     set _ = ns.items.append(k ~ " (trigger directives take a string or a list of strings)") -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}
    __auto_update_linux_timer_value_offenders_1: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for k, v in (__auto_update_linux_effective_reboot_timer_settings | ansible.builtin.default({})).items() -%}
      {%-   set is_list = (v is ansible.builtin.iterable)
                           and (v is not ansible.builtin.string)
                           and (v is not ansible.builtin.mapping) -%}
      {%-   if is_list and (k not in __auto_update_linux_timer_trigger_directives) -%}
      {%-     set _ = ns.items.append(k ~ " (a list is only supported for the repeatable trigger directives)") -%}
      {%-   elif is_list and ((v | ansible.builtin.length) == 0) -%}
      {%-     set _ = ns.items.append(k ~ " (empty list: configure at least one value or omit the directive)") -%}
      {%-   elif (k in __auto_update_linux_timer_trigger_directives)
                  and ((v is ansible.builtin.boolean) or (v is ansible.builtin.mapping)) -%}
      {%-     set _ = ns.items.append(k ~ " (trigger directives take a string or a list of strings)") -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}
