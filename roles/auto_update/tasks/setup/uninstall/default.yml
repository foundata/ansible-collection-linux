# Uninstall: Manage basic resource removal, such as packages or service users.

---

- name: "Setup | Uninstall | Remove managed systemd timer drop-in"
  ansible.builtin.file:
    path: "{{ __auto_update_linux_systemd_timer_unit_dropin_file_path }}"
    state: "absent"
  when:
    - (__auto_update_linux_systemd_timer_unit_name | ansible.builtin.length) > 0
  notify:
    - "auto_update_linux: systemd daemon-reload"


- name: "Setup | Uninstall | Remove managed apt configuration files (Debian/Ubuntu)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  when:
    - __auto_update_linux_apt_config_file_path is ansible.builtin.defined
  loop:
    - "{{ __auto_update_linux_apt_periodic_file_path }}"
    - "{{ __auto_update_linux_apt_config_file_path }}"
  loop_control:
    label: "{{ item }}"


# Scheduled reboot timer resources (only present when auto_update_linux_reboot
# was "scheduled"). Disable the timer before removing its unit files to avoid
# leaving a dangling enablement symlink.
- name: "Setup | Uninstall | Check whether the scheduled reboot timer unit exists"
  ansible.builtin.stat:
    path: "{{ __auto_update_linux_reboot_timer_unit_path }}"
  register: __auto_update_linux_reboot_timer_unit_stat


- name: "Setup | Uninstall | Disable and stop the scheduled reboot timer (if present)"
  ansible.builtin.systemd_service:
    name: "{{ __auto_update_linux_reboot_timer_unit_name }}"
    enabled: false
    state: "stopped"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - __auto_update_linux_reboot_timer_unit_stat['stat']['exists'] | ansible.builtin.default(false)


- name: "Setup | Uninstall | Remove scheduled reboot timer units and helper script"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop:
    - "{{ __auto_update_linux_reboot_timer_unit_path }}"
    - "{{ __auto_update_linux_reboot_service_unit_path }}"
    - "{{ __auto_update_linux_reboot_script_path }}"
  loop_control:
    label: "{{ item }}"
  notify:
    - "auto_update_linux: systemd daemon-reload"


# The dnf automatic.conf and os-update.conf files are owned by their respective
# packages and are removed together with the package below.
- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __auto_update_linux_packages_uninstall }}"
    state: "absent"
  when:
    - __auto_update_linux_packages_uninstall is ansible.builtin.defined
    - (__auto_update_linux_packages_uninstall | ansible.builtin.length) > 0
