# Shared safety preflight for every destructive path of this role: device
# existence, canonical block device identity, whole-disk and duplicate
# enforcement and the protection of disks backing the running system.
# Lives in tasks/shared/ because it is phase-neutral: included by
# tasks/config/default.yml AND tasks/setup/uninstall/default.yml, so a wipe
# can never run without these checks.

---

- name: "Safety | Determine device existence"
  ansible.builtin.stat:
    path: "{{ item['device'] }}"
    follow: true
  loop: "{{ __disk_linux_devices_effective }}"
  loop_control:
    label: "{{ item['device'] }}"
  register: __disk_linux_stat_result


- name: "Safety | Build device existence map"
  ansible.builtin.set_fact:
    __disk_linux_device_exists: >-
      {%- set __ns = namespace(map={}) -%}
      {%- for __r in __disk_linux_stat_result['results'] -%}
      {%-   set _ = __ns.map.update({__r['item']['device']: (__r['stat']['exists'] | ansible.builtin.bool)}) -%}
      {%- endfor -%}
      {{ __ns.map }}


- name: "Safety | Fail on missing devices with on_missing policy fail"
  ansible.builtin.assert:
    that:
      - (__disk_linux_missing_fail | ansible.builtin.length) == 0
    quiet: true
    fail_msg: >-
      The following configured devices do not exist on this host (and their
      on_missing policy is "fail"): {{ __disk_linux_missing_fail | ansible.builtin.join(', ') }}.
      Attach the disks or set on_missing to "skip" for optional ones.
  vars:
    # missing devices matter for present entries and for the destructive
    # wipe step of absent entries; plain absent cleanup proceeds without
    # the device (a detached disk is the normal decommissioning case)
    __disk_linux_existing_devices: >-
      {{
        __disk_linux_device_exists
        | ansible.builtin.dict2items
        | ansible.builtin.selectattr('value')
        | ansible.builtin.map(attribute='key')
        | ansible.builtin.list
      }}
    __disk_linux_missing_fail: >-
      {{
        __disk_linux_devices_effective
        | ansible.builtin.rejectattr('device', 'in', __disk_linux_existing_devices)
        | ansible.builtin.selectattr('on_missing', 'ansible.builtin.equalto', 'fail')
        | ansible.builtin.rejectattr('state', 'ansible.builtin.equalto', 'absent')
        | ansible.builtin.map(attribute='device')
        | ansible.builtin.list
      }}
  when:
    - (__disk_linux_devices_effective | ansible.builtin.length) > 0


- name: "Safety | Query block device identity of all existing devices"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_lsblk_exec_path }}"
      - "--json"
      - "--nodeps"
      - "--bytes"
      - "--output"
      - "KNAME,TYPE,MAJ:MIN,SIZE"
      - "{{ item['device'] }}"
  when:
    - __disk_linux_device_exists[item['device']]
  changed_when:
    - false
  # The probe is read-only; run it under "--check" too, otherwise it is
  # skipped and the discovery dereferences its missing result.
  check_mode: false
  loop: "{{ __disk_linux_devices_effective }}"
  loop_control:
    label: "{{ item['device'] }}"
  register: __disk_linux_identity_result


- name: "Safety | Build canonical block device identity map"
  ansible.builtin.set_fact:
    __disk_linux_blockdev: >-
      {%- set __ns = namespace(map={}) -%}
      {%- for __r in __disk_linux_identity_result['results'] -%}
      {%-   if __r is not ansible.builtin.skipped -%}
      {%-     set __b = (__r['stdout'] | ansible.builtin.from_json)['blockdevices'][0] -%}
      {%-     set _ = __ns.map.update({__r['item']['device']: {
                'kname': __b['kname'],
                'type': __b['type'],
                'majmin': __b['maj:min'],
                'size': (__b['size'] | int)
              }}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.map }}


- name: "Safety | Enforce whole-disk devices and reject aliased duplicates"
  ansible.builtin.assert:
    that:
      # every existing device must be a whole disk (loop devices count:
      # they are legitimate whole-disk targets for tests and image files),
      # not a partition or a device-mapper/LVM child
      - >-
        (__disk_linux_blockdev | ansible.builtin.dict2items
         | ansible.builtin.rejectattr('value.type', 'ansible.builtin.in', ['disk', 'loop'])
         | ansible.builtin.length) == 0
      # no two entries may address the same physical disk through aliases;
      # canonical identity is the major:minor pair
      - >-
        (__disk_linux_majmins | ansible.builtin.length)
        == (__disk_linux_majmins | ansible.builtin.unique | ansible.builtin.length)
    quiet: true
    fail_msg: >-
      Device identity violation: every entry must address a whole disk
      (lsblk TYPE "disk") and no two entries may address the same disk
      through different aliases. Queried identities:
      {{ __disk_linux_blockdev }}
  vars:
    __disk_linux_majmins: >-
      {{
        __disk_linux_blockdev
        | ansible.builtin.dict2items
        | ansible.builtin.map(attribute='value.majmin')
        | ansible.builtin.list
      }}
  when:
    - (__disk_linux_blockdev | ansible.builtin.length) > 0


- name: "Safety | Determine whether /etc/fstab exists"
  ansible.builtin.stat:
    path: "/etc/fstab"
  register: __disk_linux_fstab_stat_result


- name: "Safety | Read /etc/fstab"
  ansible.builtin.slurp:
    src: "/etc/fstab"
  when:
    - __disk_linux_fstab_stat_result['stat']['exists']
  register: __disk_linux_fstab_result


- name: "Safety | Determine the sources backing critical system paths"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_findmnt_exec_path }}"
      - "--noheadings"
      - "--pairs"
      - "--output"
      - "SOURCE,FSTYPE,UUID"
      - "--mountpoint"
      - "{{ item }}"
  changed_when:
    - false
  # a path that is no own mountpoint is normal (rc 1); real resolution
  # failures are caught below
  failed_when:
    - false
  # The probe is read-only; run it under "--check" too, otherwise it is
  # skipped and the discovery dereferences its missing result.
  check_mode: false
  loop: "{{ __disk_linux_critical_mountpoints }}"
  register: __disk_linux_sysmount_result


- name: "Safety | Determine active swap devices"
  ansible.builtin.slurp:
    src: "/proc/swaps"
  register: __disk_linux_swaps_result


# Multi-device Btrfs filesystems report only ONE member as the mount source;
# the other members are peers, not ancestors, so the inverse traversal below
# would miss them. The members of a MOUNTED Btrfs filesystem are enumerated
# from sysfs (/sys/fs/btrfs/<UUID>/devices/), which needs no btrfs-progs and
# cannot be confused by an unrelated clone carrying the same UUID.
- name: "Safety | Enumerate the members of critical Btrfs filesystems"
  ansible.builtin.find:
    paths: "/sys/fs/btrfs/{{ __disk_linux_btrfs_uuid }}/devices"
    file_type: "any"
  register: __disk_linux_btrfs_members_result
  vars:
    __disk_linux_btrfs_uuids: >-
      {%- set __ns = namespace(uuids=[]) -%}
      {%- for __r in (__disk_linux_sysmount_result['results'] | ansible.builtin.default([])) -%}
      {%-   if (__r['rc'] | ansible.builtin.default(1)) == 0
              and ('FSTYPE="btrfs"' in (__r['stdout'] | ansible.builtin.default(''))) -%}
      {%-     set __m = (__r['stdout'] | ansible.builtin.regex_search('UUID="[^"]+"')) -%}
      {%-     if __m -%}
      {%-       set _ = __ns.uuids.append((__m.split('"'))[1]) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ __ns.uuids | ansible.builtin.unique }}
  loop: "{{ __disk_linux_btrfs_uuids }}"
  loop_control:
    loop_var: "__disk_linux_btrfs_uuid"


# Fail closed: a critical Btrfs filesystem whose member enumeration yields
# nothing would leave peer disks unprotected.
- name: "Safety | Check every critical Btrfs filesystem enumerated its members"
  ansible.builtin.assert:
    that:
      - >-
        __disk_linux_btrfs_members_result['results'] | ansible.builtin.default([])
        | ansible.builtin.selectattr('matched', 'ansible.builtin.defined')
        | ansible.builtin.rejectattr('matched', '>', 0)
        | ansible.builtin.length == 0
    fail_msg: >-
      Refusing to continue: a Btrfs filesystem backing a critical system
      path did not enumerate its member devices via
      /sys/fs/btrfs/<UUID>/devices, so the system-disk protection would be
      incomplete.
    quiet: true
  when:
    - (__disk_linux_blockdev | ansible.builtin.length) > 0
    - (__disk_linux_btrfs_members_result['results'] | ansible.builtin.default([]) | ansible.builtin.length) > 0


# Every critical source is resolved through the WHOLE storage stack to its
# physical disks with an inverse lsblk (LUKS, LVM and MD RAID sit between a
# mount source and its disks; a one-level parent lookup misses them). The
# Btrfs "[/subvolume]" suffix is stripped (lsblk does not accept it) and the
# sysfs-enumerated Btrfs members are added as additional sources. Swap files
# need no entry of their own: their backing filesystem is already covered by
# its mountpoint.
- name: "Safety | Resolve the critical sources to their physical disks"
  ansible.builtin.command:
    argv:
      - "{{ __disk_linux_lsblk_exec_path }}"
      - "--inverse"
      - "--list"
      - "--noheadings"
      - "--output"
      - "KNAME,TYPE,MAJ:MIN"
      - "{{ item }}"
  changed_when:
    - false
  # evaluated below: an unresolvable critical source fails CLOSED
  failed_when:
    - false
  # The probe is read-only; run it under "--check" too, otherwise it is
  # skipped and the discovery dereferences its missing result.
  check_mode: false
  vars:
    __disk_linux_system_sources: >-
      {%- set __ns = namespace(sources=[]) -%}
      {%- for __r in (__disk_linux_sysmount_result['results'] | ansible.builtin.default([])) -%}
      {%-   if (__r['rc'] | ansible.builtin.default(1)) == 0 -%}
      {%-     set __m = (__r['stdout'] | ansible.builtin.default('') | ansible.builtin.regex_search('SOURCE="[^"]+"')) -%}
      {%-     if __m -%}
      {%-       set _ = __ns.sources.append((__m.split('"'))[1]) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for __sw in (__disk_linux_swaps_result['content'] | ansible.builtin.b64decode).splitlines()[1:] -%}
      {%-   set _ = __ns.sources.append(__sw.split() | ansible.builtin.first) -%}
      {%- endfor -%}
      {%- for __r in (__disk_linux_btrfs_members_result['results'] | ansible.builtin.default([])) -%}
      {%-   for __f in (__r['files'] | ansible.builtin.default([])) -%}
      {%-     set _ = __ns.sources.append('/dev/' ~ (__f['path'] | ansible.builtin.basename)) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{
        __ns.sources
        | ansible.builtin.map('ansible.builtin.regex_replace', '\[.*\]$', '')
        | ansible.builtin.select('ansible.builtin.match', '^/dev/')
        | ansible.builtin.unique
      }}
  loop: "{{ __disk_linux_system_sources }}"
  register: __disk_linux_sysdisk_result


# Fail closed: continuing with an incomplete protected set would let a
# wipe reach a disk that actually backs the running system. The root
# filesystem additionally has to resolve to a block device at all (an
# overlay or network root is outside this role's safety model).
- name: "Safety | Check every critical source resolved to physical disks"
  ansible.builtin.assert:
    that:
      - >-
        __disk_linux_sysdisk_result['results'] | ansible.builtin.default([])
        | ansible.builtin.selectattr('rc', 'ansible.builtin.defined')
        | ansible.builtin.rejectattr('rc', 'ansible.builtin.equalto', 0)
        | ansible.builtin.length == 0
      - >-
        ((__disk_linux_sysmount_result['results'][0]['stdout'] | ansible.builtin.default(''))
         | ansible.builtin.regex_search('SOURCE="[^"]+"') | ansible.builtin.default('SOURCE=""', true))
        is ansible.builtin.search('SOURCE="/dev/')
    fail_msg: >-
      Refusing to continue: a device backing the running system (/, /boot,
      the EFI system partition or active swap) could not be resolved to its
      physical disks, so the system-disk protection would be incomplete.
      Unresolvable:
      {{
        __disk_linux_sysdisk_result['results'] | ansible.builtin.default([])
        | ansible.builtin.selectattr('rc', 'ansible.builtin.defined')
        | ansible.builtin.rejectattr('rc', 'ansible.builtin.equalto', 0)
        | ansible.builtin.map(attribute='item') | ansible.builtin.join(', ')
      }}
      (root source:
      {{ __disk_linux_sysmount_result['results'][0]['stdout'] | ansible.builtin.default('unknown') }}).
    quiet: true
  when:
    - (__disk_linux_blockdev | ansible.builtin.length) > 0


- name: "Safety | Reject disks backing the running system"
  ansible.builtin.assert:
    that:
      - >-
        (__disk_linux_blockdev | ansible.builtin.dict2items
         | ansible.builtin.selectattr('value.majmin', 'in', __disk_linux_protected_majmin)
         | ansible.builtin.length) == 0
    quiet: true
    fail_msg: >-
      Refusing to manage a disk that backs the running system (/, /boot, the
      EFI system partition or active swap). Protected disks (MAJ:MIN):
      {{ __disk_linux_protected_majmin | ansible.builtin.join(', ') }}.
  vars:
    # every TYPE=disk ancestor of every critical source, by MAJ:MIN
    __disk_linux_protected_majmin: >-
      {{
        __disk_linux_sysdisk_result['results'] | ansible.builtin.default([])
        | ansible.builtin.selectattr('rc', 'ansible.builtin.defined')
        | ansible.builtin.selectattr('rc', 'ansible.builtin.equalto', 0)
        | ansible.builtin.map(attribute='stdout_lines')
        | ansible.builtin.flatten
        | ansible.builtin.map('ansible.builtin.trim')
        | ansible.builtin.select('ansible.builtin.match', '^\S+\s+(disk|loop)\s+\S+$')
        | ansible.builtin.map('ansible.builtin.split')
        | ansible.builtin.map(attribute='2')
        | ansible.builtin.unique
      }}
  when:
    - (__disk_linux_blockdev | ansible.builtin.length) > 0
